* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #0a2a3a;
  font-family: 'Norse', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
canvas { display: block; }
#gameCanvas {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
}
/* Touch Controls */
#touchControls {
  display: none; position: absolute; bottom: 0; left: 0; right: 0;
  height: 200px; pointer-events: none; z-index: 10;
}
.touch-zone {
  position: absolute; pointer-events: auto;
  border-radius: 50%; opacity: 0.25;
}
#joystickZone {
  left: 20px; bottom: 20px; width: 150px; height: 150px;
  background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3);
}
#fireBtn {
  right: 30px; bottom: 40px; width: 100px; height: 100px;
  background: rgba(220,60,60,0.3); border: 3px solid rgba(220,60,60,0.5);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: rgba(255,255,255,0.7); font-weight: bold;
}
#joystickKnob {
  position: absolute; width: 60px; height: 60px;
  border-radius: 50%; background: rgba(255,255,255,0.35);
  border: 2px solid rgba(255,255,255,0.5);
  left: 45px; top: 45px; pointer-events: none;
  transition: none;
}
</style>

<canvas id="gameCanvas"></canvas>
<div id="touchControls">
  <div id="joystickZone" class="touch-zone">
    <div id="joystickKnob"></div>
  </div>
  <div id="fireBtn" class="touch-zone">SPEAR</div>
</div>

<script>
// ============================================================
// SURF VIKINGS: SHARK ATTACK
// An Asteroids-style game with Viking surfing theme
// © Surf Vikings — surfvikings.com
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Brand colors
const BRAND = {
  teal: '#1a6b7c',
  tealDark: '#0e4a56',
  tealLight: '#2a9bb0',
  gold: '#d4a843',
  cream: '#f0e6c8',
  red: '#c0392b',
  white: '#ffffff'
};

// ============================================================
// RESPONSIVE CANVAS
// ============================================================
let W, H, SCALE;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  SCALE = Math.min(W, H) / 800;
}
window.addEventListener('resize', resize);
resize();

// Detect touch
const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
if (isTouchDevice) {
  document.getElementById('touchControls').style.display = 'block';
}

// ============================================================
// AUDIO ENGINE (Web Audio API)
// ============================================================
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playSound(type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  switch(type) {
    case 'throw':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(150, now + 0.15);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
      break;
    case 'hit':
      osc.type = 'square';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
      // Add a noise burst
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.15, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.3;
      const noise = audioCtx.createBufferSource();
      const ng = audioCtx.createGain();
      noise.buffer = buf;
      noise.connect(ng);
      ng.connect(audioCtx.destination);
      ng.gain.setValueAtTime(0.15, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      noise.start(now);
      break;
    case 'powerup':
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
      // Second tone
      const osc2 = audioCtx.createOscillator();
      const g2 = audioCtx.createGain();
      osc2.connect(g2); g2.connect(audioCtx.destination);
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(600, now + 0.1);
      osc2.frequency.exponentialRampToValueAtTime(1200, now + 0.3);
      g2.gain.setValueAtTime(0.12, now + 0.1);
      g2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc2.start(now + 0.1); osc2.stop(now + 0.35);
      break;
    case 'damage':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.4);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc.start(now); osc.stop(now + 0.4);
      break;
    case 'levelup':
      for (let i = 0; i < 4; i++) {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = 'sine';
        const t = now + i * 0.12;
        o.frequency.setValueAtTime(400 + i * 150, t);
        g.gain.setValueAtTime(0.12, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        o.start(t); o.stop(t + 0.15);
      }
      return;
    case 'gameover':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 1.0);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
      osc.start(now); osc.stop(now + 1.0);
      break;
  }
}

// Ambient ocean loop
let ambientNode = null;
function startAmbient() {
  if (!audioCtx || ambientNode) return;
  const bufSize = audioCtx.sampleRate * 4;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  // Low-pass filtered noise for ocean
  let prev = 0;
  for (let i = 0; i < bufSize; i++) {
    const white = Math.random() * 2 - 1;
    prev = prev * 0.97 + white * 0.03;
    d[i] = prev * 4;
  }
  ambientNode = audioCtx.createBufferSource();
  const g = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 400;
  ambientNode.buffer = buf;
  ambientNode.loop = true;
  ambientNode.connect(filter);
  filter.connect(g);
  g.connect(audioCtx.destination);
  g.gain.value = 0.06;
  ambientNode.start();
}

// Touch joystick
let joystickAngle = 0, joystickMag = 0, touchFiring = false;
const joystickZone = document.getElementById('joystickZone');
const joystickKnob = document.getElementById('joystickKnob');
const fireBtn = document.getElementById('fireBtn');

let joystickTouchId = null;
let joystickCenter = { x: 0, y: 0 };

joystickZone.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  joystickTouchId = t.identifier;
  const rect = joystickZone.getBoundingClientRect();
  joystickCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
}, { passive: false });

joystickZone.addEventListener('touchmove', e => {
  e.preventDefault();
  for (let t of e.changedTouches) {
    if (t.identifier === joystickTouchId) {
      const dx = t.clientX - joystickCenter.x;
      const dy = t.clientY - joystickCenter.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const maxR = 55;
      const clampDist = Math.min(dist, maxR);
      joystickAngle = Math.atan2(dy, dx);
      joystickMag = clampDist / maxR;
      const knobX = (dx / dist) * clampDist;
      const knobY = (dy / dist) * clampDist;
      joystickKnob.style.left = (45 + knobX) + 'px';
      joystickKnob.style.top = (45 + knobY) + 'px';
    }
  }
}, { passive: false });

function resetJoystick() {
  joystickTouchId = null;
  joystickMag = 0;
  joystickKnob.style.left = '45px';
  joystickKnob.style.top = '45px';
}
joystickZone.addEventListener('touchend', e => {
  for (let t of e.changedTouches) {
    if (t.identifier === joystickTouchId) resetJoystick();
  }
});
joystickZone.addEventListener('touchcancel', resetJoystick);

fireBtn.addEventListener('touchstart', e => { e.preventDefault(); touchFiring = true; }, { passive: false });
fireBtn.addEventListener('touchend', e => { e.preventDefault(); touchFiring = false; }, { passive: false });
fireBtn.addEventListener('touchcancel', e => { touchFiring = false; });

function getActiveName(name) {

  return leaderboard.find(e => e.name.toLowerCase() === name.toLowerCase());

function saveToLeaderboard() {
  const existing = getActiveName(playerName);
  if (existing) {
    if (score > existing.score) {
      existing.score = score;
      existing.level = level;
    }
  } else {

  leaderboard.sort((a, b) => b.score - a.score);
  if (leaderboard.length > 10) leaderboard.length = 10;
  localStorage.setItem('svLeaderboard', JSON.stringify(leaderboard));
  highScore = leaderboard.length > 0 ? leaderboard[0].score : 0;
  localStorage.setItem('svHighScore', highScore.toString());
}

// Draw tropical water background
function drawWater(time) {
  // Base gradient - tropical ocean
  const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H) * 0.7);
  grad.addColorStop(0, '#0fb5c4');
  grad.addColorStop(0.3, '#0e96a8');
  grad.addColorStop(0.6, '#0a7589');
  grad.addColorStop(1, '#065564');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Animated caustic light patterns
  ctx.save();
  ctx.globalAlpha = 0.08;
  const caustSize = 120 * SCALE;
  for (let cx = -caustSize; cx < W + caustSize; cx += caustSize * 0.8) {
    for (let cy = -caustSize; cy < H + caustSize; cy += caustSize * 0.8) {
      const ox = Math.sin(time * 0.4 + cx * 0.01 + cy * 0.008) * 20;
      const oy = Math.cos(time * 0.3 + cy * 0.01 + cx * 0.005) * 20;
      const r = (caustSize * 0.3) + Math.sin(time * 0.5 + cx * 0.02) * caustSize * 0.15;
      const cg = ctx.createRadialGradient(cx + ox, cy + oy, 0, cx + ox, cy + oy, r);
      cg.addColorStop(0, 'rgba(120,230,255,0.6)');
      cg.addColorStop(1, 'rgba(120,230,255,0)');
      ctx.fillStyle = cg;
      ctx.fillRect(cx + ox - r, cy + oy - r, r * 2, r * 2);
    }
  }
  ctx.restore();

  // Wave lines
  ctx.save();
  ctx.globalAlpha = 0.06;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.5;
  for (const w of waveOffsets) {
    ctx.beginPath();
    const baseY = w.y * H;
    for (let x = 0; x < W; x += 4) {
      const y = baseY + Math.sin(x * 0.008 + time * w.speed + w.phase) * w.amp * SCALE
                       + Math.sin(x * 0.015 + time * w.speed * 0.7) * w.amp * 0.5 * SCALE;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.restore();
}

// Draw Viking on surfboard (top-down)
function drawPlayer(p, time) {
  if (!p.alive) return;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.angle + Math.PI / 2);

  const s = SCALE;
  const blink = p.invincible > 0 && Math.floor(p.invincible / 4) % 2 === 0;
  if (blink) { ctx.globalAlpha = 0.4; }

  // Wake trail
  ctx.save();
  ctx.globalAlpha = 0.15;
  ctx.fillStyle = '#ffffff';
  const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
  const wakeLen = Math.min(speed * 8, 50) * s;
  ctx.beginPath();
  ctx.moveTo(-8 * s, 20 * s);
  ctx.quadraticCurveTo(-12 * s, (20 + wakeLen * 0.5) * s, -3 * s, (25 + wakeLen) * s);
  ctx.lineTo(3 * s, (25 + wakeLen) * s);
  ctx.quadraticCurveTo(12 * s, (20 + wakeLen * 0.5) * s, 8 * s, 20 * s);
  ctx.fill();
  ctx.restore();

  // Surfboard
  ctx.fillStyle = '#d4a043';
  ctx.strokeStyle = '#8b6914';
  ctx.lineWidth = 1.5 * s;
  ctx.beginPath();
  ctx.ellipse(0, 5 * s, 8 * s, 22 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  // Board stripe
  ctx.strokeStyle = BRAND.teal;
  ctx.lineWidth = 2 * s;
  ctx.beginPath();
  ctx.moveTo(0, -15 * s);
  ctx.lineTo(0, 22 * s);
  ctx.stroke();

  // Viking body (torso from above)
  ctx.fillStyle = '#6b4c2a';
  ctx.beginPath();
  ctx.ellipse(0, 0, 7 * s, 9 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  // Tunic/vest
  ctx.fillStyle = BRAND.teal;
  ctx.beginPath();
  ctx.ellipse(0, 2 * s, 6 * s, 7 * s, 0, 0, Math.PI * 2);
  ctx.fill();

  // Arms
  ctx.strokeStyle = '#c8a882';
  ctx.lineWidth = 3.5 * s;
  ctx.lineCap = 'round';
  // Left arm
  ctx.beginPath();
  ctx.moveTo(-5 * s, 0);
  ctx.lineTo(-10 * s, -5 * s);
  ctx.stroke();
  // Right arm (holding spear up)
  ctx.beginPath();
  ctx.moveTo(5 * s, 0);
  ctx.lineTo(9 * s, -8 * s);
  ctx.stroke();

  // Spear in hand
  ctx.strokeStyle = '#8b6914';
  ctx.lineWidth = 2 * s;
  ctx.beginPath();
  ctx.moveTo(8 * s, -6 * s);
  ctx.lineTo(6 * s, -20 * s);
  ctx.stroke();
  // Spear tip
  ctx.fillStyle = '#c0c0c0';
  ctx.beginPath();
  ctx.moveTo(6 * s, -20 * s);
  ctx.lineTo(4 * s, -16 * s);
  ctx.lineTo(8 * s, -16 * s);
  ctx.closePath();
  ctx.fill();

  // Head (from above - round with helmet)
  ctx.fillStyle = '#c8a882';
  ctx.beginPath();
  ctx.arc(0, -6 * s, 5.5 * s, 0, Math.PI * 2);
  ctx.fill();
  // Viking helmet
  ctx.fillStyle = '#7a7a7a';
  ctx.beginPath();
  ctx.arc(0, -7 * s, 6 * s, Math.PI * 1.1, Math.PI * 1.9);
  ctx.fill();
  // Helmet horns
  ctx.strokeStyle = '#d4c9a0';
  ctx.lineWidth = 2.5 * s;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-5 * s, -9 * s);
  ctx.quadraticCurveTo(-10 * s, -16 * s, -7 * s, -18 * s);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(5 * s, -9 * s);
  ctx.quadraticCurveTo(10 * s, -16 * s, 7 * s, -18 * s);
  ctx.stroke();

  // Beard
  ctx.fillStyle = '#c0792a';
  ctx.beginPath();
  ctx.moveTo(-4 * s, -3 * s);
  ctx.quadraticCurveTo(-5 * s, 3 * s, -2 * s, 5 * s);
  ctx.lineTo(2 * s, 5 * s);
  ctx.quadraticCurveTo(5 * s, 3 * s, 4 * s, -3 * s);
  ctx.closePath();
  ctx.fill();

  // Shield power-up visual
  if (p.shieldActive) {
    ctx.strokeStyle = BRAND.gold;
    ctx.lineWidth = 2.5 * s;
    ctx.globalAlpha = 0.5 + Math.sin(time * 5) * 0.2;
    ctx.beginPath();
    ctx.arc(0, 0, 26 * s, 0, Math.PI * 2);
    ctx.stroke();
    // Rune symbols
    ctx.globalAlpha = 0.3;
    ctx.font = `${10 * s}px serif`;
    ctx.fillStyle = BRAND.gold;
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + time * 0.8;
      const rx = Math.cos(a) * 28 * s;
      const ry = Math.sin(a) * 28 * s;
      ctx.fillText('ᚱ', rx - 4 * s, ry + 3 * s);
    }
  }

  // Trident glow
  if (p.trident) {
    ctx.globalAlpha = 0.3 + Math.sin(time * 6) * 0.1;
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(7 * s, -18 * s, 6 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

// Draw a shark (top-down)
function drawShark(shark, time) {
  ctx.save();
  ctx.translate(shark.x, shark.y);
  ctx.rotate(shark.angle + Math.PI / 2);

  const s = SCALE * shark.size;
  const swim = Math.sin(time * 4 + shark.phase) * 3;

  // Shadow under water
  ctx.save();
  ctx.globalAlpha = 0.15;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(3 * s, 3 * s, 8 * s, 20 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Tail fin
  ctx.fillStyle = '#5a6a7a';
  ctx.beginPath();
  ctx.moveTo(0, 18 * s);
  ctx.lineTo(-7 * s + swim * s * 0.5, 28 * s);
  ctx.lineTo(0, 24 * s);
  ctx.lineTo(7 * s + swim * s * 0.5, 28 * s);
  ctx.closePath();
  ctx.fill();

  // Body
  const bodyGrad = ctx.createLinearGradient(-8 * s, 0, 8 * s, 0);
  bodyGrad.addColorStop(0, '#4a5a6a');
  bodyGrad.addColorStop(0.3, '#6a7a8a');
  bodyGrad.addColorStop(0.5, '#7a8a99');
  bodyGrad.addColorStop(0.7, '#6a7a8a');
  bodyGrad.addColorStop(1, '#4a5a6a');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.moveTo(0, -18 * s);
  ctx.quadraticCurveTo(-9 * s, -8 * s, -8 * s + swim * s * 0.2, 5 * s);
  ctx.quadraticCurveTo(-6 * s, 18 * s, 0, 20 * s);
  ctx.quadraticCurveTo(6 * s, 18 * s, 8 * s + swim * s * 0.2, 5 * s);
  ctx.quadraticCurveTo(9 * s, -8 * s, 0, -18 * s);
  ctx.fill();

  // Belly (lighter underside)
  ctx.fillStyle = 'rgba(200,210,220,0.3)';
  ctx.beginPath();
  ctx.ellipse(0, 2 * s, 4 * s, 12 * s, 0, 0, Math.PI * 2);
  ctx.fill();

  // Dorsal fin
  ctx.fillStyle = '#4a5868';
  ctx.beginPath();
  ctx.moveTo(0, -5 * s);
  ctx.lineTo(-2 * s, -2 * s);
  ctx.lineTo(0, -14 * s);
  ctx.lineTo(2 * s, -2 * s);
  ctx.closePath();
  ctx.fill();
  // Fin shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.moveTo(0, -5 * s);
  ctx.lineTo(1 * s, -2 * s);
  ctx.lineTo(0, -12 * s);
  ctx.closePath();
  ctx.fill();

  // Pectoral fins
  ctx.fillStyle = '#5a6878';
  // Left
  ctx.beginPath();
  ctx.moveTo(-6 * s, -2 * s);
  ctx.quadraticCurveTo(-14 * s + swim * s * 0.3, 4 * s, -10 * s, 8 * s);
  ctx.lineTo(-5 * s, 3 * s);
  ctx.closePath();
  ctx.fill();
  // Right
  ctx.beginPath();
  ctx.moveTo(6 * s, -2 * s);
  ctx.quadraticCurveTo(14 * s + swim * s * 0.3, 4 * s, 10 * s, 8 * s);
  ctx.lineTo(5 * s, 3 * s);
  ctx.closePath();
  ctx.fill();

  // Eyes
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.ellipse(-5 * s, -10 * s, 1.5 * s, 2 * s, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(5 * s, -10 * s, 1.5 * s, 2 * s, 0.3, 0, Math.PI * 2);
  ctx.fill();
  // Eye glint
  ctx.fillStyle = '#ff3333';
  ctx.beginPath();
  ctx.arc(-5 * s, -10.5 * s, 0.7 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(5 * s, -10.5 * s, 0.7 * s, 0, Math.PI * 2);
  ctx.fill();

  // Mouth line
  ctx.strokeStyle = '#2a2a2a';
  ctx.lineWidth = 1.2 * s;
  ctx.beginPath();
  ctx.moveTo(-5 * s, -14 * s);
  ctx.quadraticCurveTo(0, -12 * s, 5 * s, -14 * s);
  ctx.stroke();

  // Gill slits
  ctx.strokeStyle = 'rgba(40,50,60,0.4)';
  ctx.lineWidth = 0.8 * s;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(-7 * s, (-5 + i * 2.5) * s);
    ctx.lineTo(-5 * s, (-4 + i * 2.5) * s);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(7 * s, (-5 + i * 2.5) * s);
    ctx.lineTo(5 * s, (-4 + i * 2.5) * s);
    ctx.stroke();
  }

  ctx.restore();
}

// Draw spear
function drawSpear(sp) {
  ctx.save();
  ctx.translate(sp.x, sp.y);
  ctx.rotate(sp.angle + Math.PI / 2);
  const s = SCALE;

  // Shaft
  ctx.strokeStyle = '#8b6914';
  ctx.lineWidth = 2.5 * s;
  ctx.beginPath();
  ctx.moveTo(0, -12 * s);
  ctx.lineTo(0, 12 * s);
  ctx.stroke();

  // Spearhead
  ctx.fillStyle = '#c8c8c8';
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 1 * s;
  ctx.beginPath();
  ctx.moveTo(0, -18 * s);
  ctx.lineTo(-3 * s, -10 * s);
  ctx.lineTo(3 * s, -10 * s);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Trail glow
  if (sp.electric) {
    // Electric spear: bright cyan glow + flickering arcs
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#00ccff';
    ctx.beginPath();
    ctx.arc(0, 0, 6 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.7;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1 * s;
    const t = Date.now() * 0.01;
    ctx.beginPath();
    ctx.moveTo(-4 * s, -3 * s);
    ctx.lineTo(-7 * s + Math.sin(t) * 2 * s, 2 * s);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(4 * s, -3 * s);
    ctx.lineTo(7 * s + Math.cos(t) * 2 * s, 2 * s);
    ctx.stroke();
  } else if (sp.trident) {
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(0, 5 * s, 4 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

// Draw power-up
function drawPowerup(pu, time) {
  ctx.save();
  ctx.translate(pu.x, pu.y);
  const s = SCALE;
  const bob = Math.sin(time * 3 + pu.phase) * 4;

  // Glow
  ctx.globalAlpha = 0.3 + Math.sin(time * 4 + pu.phase) * 0.1;
  const colors = { trident: '#ffd700', shield: '#4fc3f7', speed: '#66ff66', electric: '#00ccff' };
  const col = colors[pu.type] || '#fff';
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.arc(0, bob, 18 * s, 0, Math.PI * 2);
  ctx.fill();

  // Icon
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = col;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2 * s;

  if (pu.type === 'trident') {
    // Trident icon
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2.5 * s;
    ctx.beginPath();
    ctx.moveTo(0, 10 * s + bob);
    ctx.lineTo(0, -6 * s + bob);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-6 * s, -3 * s + bob);
    ctx.lineTo(-6 * s, -10 * s + bob);
    ctx.moveTo(0, -6 * s + bob);
    ctx.lineTo(0, -14 * s + bob);
    ctx.moveTo(6 * s, -3 * s + bob);
    ctx.lineTo(6 * s, -10 * s + bob);
    ctx.moveTo(-6 * s, -3 * s + bob);
    ctx.lineTo(6 * s, -3 * s + bob);
    ctx.stroke();
  } else if (pu.type === 'shield') {
    // Shield icon
    ctx.fillStyle = '#4fc3f7';
    ctx.beginPath();
    ctx.moveTo(0, -12 * s + bob);
    ctx.quadraticCurveTo(-10 * s, -8 * s + bob, -10 * s, 0 + bob);
    ctx.quadraticCurveTo(-10 * s, 8 * s + bob, 0, 12 * s + bob);
    ctx.quadraticCurveTo(10 * s, 8 * s + bob, 10 * s, 0 + bob);
    ctx.quadraticCurveTo(10 * s, -8 * s + bob, 0, -12 * s + bob);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5 * s;
    ctx.stroke();
  } else if (pu.type === 'speed') {
    // Lightning bolt
    ctx.fillStyle = '#66ff66';
    ctx.beginPath();
    ctx.moveTo(-2 * s, -12 * s + bob);
    ctx.lineTo(-6 * s, 1 * s + bob);
    ctx.lineTo(-1 * s, 0 + bob);
    ctx.lineTo(2 * s, 12 * s + bob);
    ctx.lineTo(6 * s, -1 * s + bob);
    ctx.lineTo(1 * s, 0 + bob);
    ctx.closePath();
    ctx.fill();
  } else if (pu.type === 'electric') {
    // Electric spear icon — spear with electricity arcs
    ctx.strokeStyle = '#00ccff';
    ctx.lineWidth = 2.5 * s;
    // Spear shaft
    ctx.beginPath();
    ctx.moveTo(0, 10 * s + bob);
    ctx.lineTo(0, -10 * s + bob);
    ctx.stroke();
    // Spear tip
    ctx.fillStyle = '#00ccff';
    ctx.beginPath();
    ctx.moveTo(0, -14 * s + bob);
    ctx.lineTo(-4 * s, -8 * s + bob);
    ctx.lineTo(4 * s, -8 * s + bob);
    ctx.closePath();
    ctx.fill();
    // Electric arcs
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5 * s;
    const flicker = Math.sin(time * 12 + pu.phase) * 3 * s;
    ctx.beginPath();
    ctx.moveTo(-3 * s, -4 * s + bob);
    ctx.lineTo(-7 * s + flicker, 0 + bob);
    ctx.lineTo(-3 * s, 4 * s + bob);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(3 * s, -4 * s + bob);
    ctx.lineTo(7 * s - flicker, 0 + bob);
    ctx.lineTo(3 * s, 4 * s + bob);
    ctx.stroke();
  }

  ctx.restore();
}

// ============================================================
// PARTICLE SYSTEM
// ============================================================
function spawnParticles(x, y, color, count, speed) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const v = (0.5 + Math.random()) * speed;
    particles.push({
      x, y,
      vx: Math.cos(angle) * v,
      vy: Math.sin(angle) * v,
      life: 1,
      decay: 0.015 + Math.random() * 0.02,
      size: 2 + Math.random() * 4,
      color
    });
  }
}

function spawnBlood(x, y) {
  // Red particles for shark hit
  spawnParticles(x, y, 'rgba(180,30,30,', 12, 3);
  // Water splash white
  spawnParticles(x, y, 'rgba(200,230,255,', 8, 2);
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color + p.life + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * SCALE * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawLogo(cx, cy, size) {
  if (!logoLoaded) return;
  ctx.save();
  // SVG native aspect ratio: 938 x 1042
  const aspect = 938 / 1042;
  const drawH = size;
  const drawW = drawH * aspect;
  ctx.drawImage(logoImg, cx - drawW / 2, cy - drawH / 2, drawW, drawH);
  ctx.restore();
}

function drawSplash(time) {
  drawWater(time);

  // Darken
  ctx.fillStyle = 'rgba(5,30,45,0.6)';
  ctx.fillRect(0, 0, W, H);

  // Logo
  const logoSize = Math.min(W, H) * 0.45;
  drawLogo(W/2, H * 0.35, logoSize);

  // Subtitle
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.font = `bold ${Math.max(22, 32 * SCALE)}px 'Norse', 'Segoe UI', Tahoma, sans-serif`;
  ctx.fillText('⚔ SHARK ATTACK ⚔', W/2, H * 0.64);

  // Start prompt
  const pulse = 0.6 + Math.sin(time * 3) * 0.4;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = BRAND.cream;
  ctx.font = `${Math.max(16, 20 * SCALE)}px 'Norse', 'Segoe UI', Tahoma, sans-serif`;
  if (isTouchDevice) {
    ctx.fillText('TAP TO START', W/2, H * 0.73);
  } else {
    ctx.fillText('PRESS ENTER TO START', W/2, H * 0.73);
  }
  ctx.globalAlpha = 1;

  // Leaderboard on splash
  if (leaderboard.length > 0) {
    ctx.fillStyle = BRAND.gold;
    ctx.font = `bold ${Math.max(14, 16 * SCALE)}px 'Norse', 'Segoe UI', Tahoma, sans-serif`;
    ctx.fillText('🏆 LEADERBOARD', W/2, H * 0.80);
    ctx.font = `${Math.max(12, 14 * SCALE)}px 'Norse', 'Segoe UI', Tahoma, sans-serif`;
    const top5 = leaderboard.slice(0, 5);
    for (let i = 0; i < top5.length; i++) {
      ctx.fillStyle = i === 0 ? BRAND.gold : 'rgba(255,255,255,0.6)';
      ctx.fillText(`${i + 1}. ${top5[i].name} — ${top5[i].score}`, W/2, H * 0.84 + i * Math.max(16, 18 * SCALE));
    }
  }

  // Branding link
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.font = `${Math.max(10, 12 * SCALE)}px 'Norse', 'Segoe UI', Tahoma, sans-serif`;
  ctx.fillText('surfvikings.com', W/2, H * 0.97);
}

function drawNameEntry(time) {
  drawWater(time);

  ctx.fillStyle = 'rgba(5,30,45,0.75)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';

  // Title
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${Math.max(22, 30 * SCALE)}px 'Norse', 'Segoe UI', Tahoma, sans-serif`;
  ctx.fillText('ENTER YOUR NAME', W/2, H * 0.28);

  // Error message (18pt red)
  if (nameError) {
    ctx.fillStyle = '#ff3333';
    ctx.font = `${18}px 'Norse', 'Segoe UI', Tahoma, sans-serif`;
    ctx.fillText(nameError, W/2, H * 0.15);
  }

  // Name input box
  const boxW = Math.min(400, W * 0.6);
  const boxH = Math.max(44, 50 * SCALE);
  const boxX = W/2 - boxW/2;
  const boxY = H * 0.33;

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.strokeRect(boxX, boxY, boxW, boxH);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(boxX, boxY, boxW, boxH);

  // Player name text with blinking cursor
  ctx.fillStyle = '#ffffff';
  ctx.font = `${Math.max(20, 24 * SCALE)}px 'Norse', 'Segoe UI', Tahoma, sans-serif`;
  const cursor = Math.sin(time * 4) > 0 ? '|' : '';
  ctx.fillText(playerName + cursor, W/2, boxY + boxH/2 + 8);

  // Instruction
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = `${Math.max(14, 16 * SCALE)}px 'Norse', 'Segoe UI', Tahoma, sans-serif`;
  ctx.fillText('Type your name and press ENTER', W/2, boxY + boxH + 30);

  // Controls hint
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.font = `${Math.max(11, 13 * SCALE)}px 'Norse', 'Segoe UI', Tahoma, sans-serif`;
  if (!isTouchDevice) {
    ctx.fillText('ARROW KEYS to paddle • SPACE to throw spear', W/2, H * 0.90);
  }
}

function drawHUD() {
  const pad = 15;
  const sz = Math.max(14, 16 * SCALE);

  // Score
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(0, 0, W, 45 * SCALE);

  ctx.fillStyle = BRAND.cream;
  ctx.textAlign = 'left';
  ctx.font = `bold ${sz}px 'Norse', 'Segoe UI', Tahoma, sans-serif`;
  ctx.fillText(`SCORE: ${score}`, pad, 28 * SCALE);

  // Level + next level info
  ctx.textAlign = 'center';
  ctx.fillText(`LEVEL ${level}`, W/2, 28 * SCALE);
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = `${Math.max(10, 12 * SCALE)}px 'Norse', 'Segoe UI', Tahoma, sans-serif`;
  ctx.fillText(`Next: ${level * POINTS_PER_LEVEL}`, W/2, 44 * SCALE);

  // Player name + High score
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = `${Math.max(11, 13 * SCALE)}px 'Norse', 'Segoe UI', Tahoma, sans-serif`;
  ctx.fillText(`${playerName}  |  HI: ${highScore}`, W - pad, 16 * SCALE);

  // Lives (surfboard icons)
  ctx.fillStyle = BRAND.cream;
  ctx.textAlign = 'right';
  ctx.font = `${sz}px 'Norse', 'Segoe UI', Tahoma, sans-serif`;
  let livesStr = '';
  for (let i = 0; i < lives; i++) livesStr += '🏄 ';
  ctx.fillText(livesStr.trim(), W - pad, 36 * SCALE);

  // Power-up timers
  let timerY = 55 * SCALE;
  if (player) {
    if (player.trident) {
      ctx.fillStyle = '#ffd700';
      ctx.textAlign = 'left';
      ctx.font = `${Math.max(12, 14 * SCALE)}px 'Segoe UI', sans-serif`;
      const barW = 80 * SCALE;
      ctx.fillText('⚔ TRIDENT', pad, timerY);
      ctx.fillStyle = 'rgba(255,215,0,0.3)';
      ctx.fillRect(pad + 75 * SCALE, timerY - 10 * SCALE, barW, 12 * SCALE);
      ctx.fillStyle = '#ffd700';
      ctx.fillRect(pad + 75 * SCALE, timerY - 10 * SCALE, barW * (player.tridentTimer / 600), 12 * SCALE);
      timerY += 20 * SCALE;
    }
    if (player.shieldActive) {
      ctx.fillStyle = '#4fc3f7';
      ctx.textAlign = 'left';
      ctx.font = `${Math.max(12, 14 * SCALE)}px 'Segoe UI', sans-serif`;
      ctx.fillText('🛡 SHIELD', pad, timerY);
      timerY += 20 * SCALE;
    }
    if (player.speedBoost) {
      ctx.fillStyle = '#66ff66';
      ctx.textAlign = 'left';
      ctx.font = `${Math.max(12, 14 * SCALE)}px 'Segoe UI', sans-serif`;
      const barW = 80 * SCALE;
      ctx.fillText('⚡ SPEED', pad, timerY);
      ctx.fillStyle = 'rgba(100,255,100,0.3)';
      ctx.fillRect(pad + 70 * SCALE, timerY - 10 * SCALE, barW, 12 * SCALE);
      ctx.fillStyle = '#66ff66';
      ctx.fillRect(pad + 70 * SCALE, timerY - 10 * SCALE, barW * (player.speedTimer / 480), 12 * SCALE);
      timerY += 20 * SCALE;
    }
    if (player.electricSpear) {
      ctx.fillStyle = '#00ccff';
      ctx.textAlign = 'left';
      ctx.font = `${Math.max(12, 14 * SCALE)}px 'Segoe UI', sans-serif`;
      const barW = 80 * SCALE;
      const secs = Math.ceil(player.electricSpearTimer / 60);
      ctx.fillText(`⚡ ELECTRIC (${secs}s)`, pad, timerY);
      ctx.fillStyle = 'rgba(0,204,255,0.3)';
      ctx.fillRect(pad + 110 * SCALE, timerY - 10 * SCALE, barW, 12 * SCALE);
      ctx.fillStyle = '#00ccff';
      ctx.fillRect(pad + 110 * SCALE, timerY - 10 * SCALE, barW * (player.electricSpearTimer / 1800), 12 * SCALE);
      timerY += 20 * SCALE;
    }
  }
}

// ============================================================
function drawGameOver(time) {
  ctx.fillStyle = 'rgba(5,15,25,0.75)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = BRAND.red;
  ctx.font = `bold ${Math.max(36, 50 * SCALE)}px 'Norse', 'Segoe UI', Tahoma, sans-serif`;
  ctx.fillText('GAME OVER', W/2, H * 0.18);

  ctx.fillStyle = BRAND.cream;
  ctx.font = `${Math.max(20, 26 * SCALE)}px 'Norse', 'Segoe UI', Tahoma, sans-serif`;
  ctx.fillText(`${playerName} — SCORE: ${score}  •  LEVEL: ${level}`, W/2, H * 0.27);

  if (score >= highScore && score > 0) {
    ctx.fillStyle = BRAND.gold;
    ctx.font = `bold ${Math.max(18, 22 * SCALE)}px 'Norse', 'Segoe UI', Tahoma, sans-serif`;
    ctx.fillText('★ NEW HIGH SCORE! ★', W/2, H * 0.33);
  }

  // Leaderboard
  if (leaderboard.length > 0) {
    const lbY = H * 0.40;
    ctx.fillStyle = BRAND.gold;
    ctx.font = `bold ${Math.max(16, 18 * SCALE)}px 'Norse', 'Segoe UI', Tahoma, sans-serif`;
    ctx.fillText('🏆 LEADERBOARD', W/2, lbY);

    ctx.font = `${Math.max(13, 15 * SCALE)}px 'Norse', 'Segoe UI', Tahoma, sans-serif`;
    const rowH = Math.max(20, 22 * SCALE);
    for (let i = 0; i < Math.min(leaderboard.length, 10); i++) {
      const entry = leaderboard[i];
      const isCurrentPlayer = entry.name.toLowerCase() === playerName.toLowerCase();
      ctx.fillStyle = isCurrentPlayer ? BRAND.gold : (i === 0 ? BRAND.gold : 'rgba(255,255,255,0.6)');
      if (isCurrentPlayer) {
        ctx.font = `bold ${Math.max(13, 15 * SCALE)}px 'Norse', 'Segoe UI', Tahoma, sans-serif`;
      } else {
        ctx.font = `${Math.max(13, 15 * SCALE)}px 'Norse', 'Segoe UI', Tahoma, sans-serif`;
      }
      ctx.fillText(`${i + 1}. ${entry.name} — ${entry.score} (Lvl ${entry.level})`, W/2, lbY + 24 + i * rowH);
    }
  }

  const pulse = 0.5 + Math.sin(time * 3) * 0.5;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = BRAND.cream;
  ctx.font = `${Math.max(16, 20 * SCALE)}px 'Norse', 'Segoe UI', Tahoma, sans-serif`;
  ctx.fillText(isTouchDevice ? 'TAP TO PLAY AGAIN' : 'PRESS ENTER TO PLAY AGAIN', W/2, H * 0.90);
  ctx.globalAlpha = 1;

  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.font = `${Math.max(10, 12 * SCALE)}px 'Norse', 'Segoe UI', Tahoma, sans-serif`;
  ctx.fillText('surfvikings.com', W/2, H * 0.96);
}

function drawLevelTransition(time) {

    'More sharks incoming!',

    'They smell blood!',
    'A feeding frenzy approaches!',

  if (level === 15) {

    ctx.fillText("There's a new power-up called Electric Spear", W/2, H * 0.67);
  }
}

// ============================================================
// SPAWN FUNCTIONS
// ============================================================
function spawnShark() {
  const edge = Math.floor(Math.random() * 4);
  let x, y;
  if (edge === 0) { x = Math.random() * W; y = -40; }
  else if (edge === 1) { x = W + 40; y = Math.random() * H; }
  else if (edge === 2) { x = Math.random() * W; y = H + 40; }
  else { x = -40; y = Math.random() * H; }

  const baseSpeed = 0.2 * Math.pow(1.02, level - 1); // +2% per level
  const speed = (baseSpeed + Math.random() * 0.3) * SCALE;
  const size = 0.7 + Math.random() * 0.6;
  const angle = Math.atan2(H/2 - y + (Math.random()-0.5)*200, W/2 - x + (Math.random()-0.5)*200);

  sharks.push({
    x, y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    angle,
    speed,
    size,
    radius: 16 * SCALE * size,
    phase: Math.random() * Math.PI * 2,
    turnTimer: Math.random() * 120,
    alive: true,
    deathTimer: 0
  });
}

function spawnPowerup() {
  const types = ['trident', 'shield', 'speed'];
  if (level >= 15) types.push('electric');
  const type = types[Math.floor(Math.random() * types.length)];
  powerups.push({
    x: 60 + Math.random() * (W - 120),
    y: 60 + Math.random() * (H - 120),
    type,
    radius: 14 * SCALE,
    phase: Math.random() * Math.PI * 2,
    life: 720 // frames before it disappears (20% longer)
  });
}

// ============================================================
// GAME INIT
// ============================================================
function startGame() {
  initAudio();
  startAmbient();
  score = 0;
  lives = 3;
  level = 1;
  gameTime = 0;
  sharks = [];
  spears = [];
  powerups = [];
  particles = [];
  player = createPlayer();
  gameState = STATE.PLAYING;
  spawnWave();
}

function spawnWave() {
  const count = 3 + level * 2;
  for (let i = 0; i < count; i++) {
    setTimeout(() => spawnShark(), i * 400);
  }
}

function nextLevel() {
  level++;
  gameState = STATE.LEVEL_TRANSITION;
  levelTimer = level === 15 ? 240 : 120; // Extra time at level 15 for announcement
  playSound('levelup');
}

// ============================================================
// UPDATE LOGIC
// ============================================================
function update() {
  gameTime++;

  if (gameState === STATE.LEVEL_TRANSITION) {
    levelTimer--;
    if (levelTimer <= 0) {
      gameState = STATE.PLAYING;
      spawnWave();
    }
    return;
  }

  if (gameState !== STATE.PLAYING || !player) return;

  // --- Player input ---
  const p = player;
  const turnSpeed = 0.055;
  const thrustPower = (p.speedBoost ? 0.09 : 0.06) * SCALE;
  const drag = 0.985;

  // Keyboard
  if (keys['ArrowLeft'] || keys['KeyA']) p.angle -= turnSpeed;
  if (keys['ArrowRight'] || keys['KeyD']) p.angle += turnSpeed;
  if (keys['ArrowUp'] || keys['KeyW']) {
    p.vx += Math.cos(p.angle) * thrustPower;
    p.vy += Math.sin(p.angle) * thrustPower;
  }
  if (keys['ArrowDown'] || keys['KeyS']) {
    p.vx -= Math.cos(p.angle) * thrustPower * 0.3;
    p.vy -= Math.sin(p.angle) * thrustPower * 0.3;
  }

  // Touch joystick
  if (joystickMag > 0.15) {
    // Rotate toward joystick angle
    let diff = joystickAngle - p.angle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    p.angle += diff * 0.08;
    // Thrust proportional to magnitude
    p.vx += Math.cos(p.angle) * thrustPower * joystickMag;
    p.vy += Math.sin(p.angle) * thrustPower * joystickMag;
  }

  // Physics - drift & water resistance
  p.vx *= drag;
  p.vy *= drag;
  p.x += p.vx;
  p.y += p.vy;

  // Wrap around screen
  if (p.x < -30) p.x = W + 30;
  if (p.x > W + 30) p.x = -30;
  if (p.y < -30) p.y = H + 30;
  if (p.y > H + 30) p.y = -30;

  // Invincibility
  if (p.invincible > 0) p.invincible--;

  // Power-up timers
  if (p.trident) {
    p.tridentTimer--;
    if (p.tridentTimer <= 0) p.trident = false;
  }
  if (p.shieldActive) {
    p.shieldTimer--;
    if (p.shieldTimer <= 0) p.shieldActive = false;
  }
  if (p.speedBoost) {
    p.speedTimer--;
    if (p.speedTimer <= 0) p.speedBoost = false;
  }
  if (p.electricSpear) {
    p.electricSpearTimer--;
    if (p.electricSpearTimer <= 0) p.electricSpear = false;
  }

  // --- Spear firing ---
  spearCooldown = Math.max(0, spearCooldown - 1);
  const firing = keys['Space'] || keys['KeyX'] || touchFiring;
  if (firing && spearCooldown <= 0) {
    const spd = 6 * SCALE;
    const isElectric = p.electricSpear;
    if (p.trident) {
      // Triple spread
      for (let spread = -0.2; spread <= 0.2; spread += 0.2) {
        spears.push({
          x: p.x + Math.cos(p.angle) * 20 * SCALE,
          y: p.y + Math.sin(p.angle) * 20 * SCALE,
          vx: Math.cos(p.angle + spread) * spd,
          vy: Math.sin(p.angle + spread) * spd,
          angle: p.angle + spread,
          life: 80,
          trident: true,
          electric: isElectric
        });
      }
    } else {
      spears.push({
        x: p.x + Math.cos(p.angle) * 20 * SCALE,
        y: p.y + Math.sin(p.angle) * 20 * SCALE,
        vx: Math.cos(p.angle) * spd,
        vy: Math.sin(p.angle) * spd,
        angle: p.angle,
        life: 80,
        trident: false,
        electric: isElectric
      });
    }
    spearCooldown = 12;
    playSound('throw');
  }

  // --- Update spears ---
  for (let i = spears.length - 1; i >= 0; i--) {
    const sp = spears[i];
    sp.x += sp.vx;
    sp.y += sp.vy;
    sp.life--;
    // Wrap
    if (sp.x < -20) sp.x = W + 20;
    if (sp.x > W + 20) sp.x = -20;
    if (sp.y < -20) sp.y = H + 20;
    if (sp.y > H + 20) sp.y = -20;
    if (sp.life <= 0) spears.splice(i, 1);
  }

  // --- Update sharks ---
  for (let i = sharks.length - 1; i >= 0; i--) {
    const sh = sharks[i];
    if (!sh.alive) {
      sh.deathTimer++;
      if (sh.deathTimer > 30) sharks.splice(i, 1);
      continue;
    }

    // Occasional direction change toward player
    sh.turnTimer--;
    if (sh.turnTimer <= 0) {
      const targetAngle = Math.atan2(p.y - sh.y, p.x - sh.x);
      let diff = targetAngle - sh.angle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      sh.angle += diff * (0.3 + Math.random() * 0.3);
      sh.vx = Math.cos(sh.angle) * sh.speed;
      sh.vy = Math.sin(sh.angle) * sh.speed;
      sh.turnTimer = 60 + Math.random() * 90;
    }

    sh.x += sh.vx;
    sh.y += sh.vy;

    // Wrap
    if (sh.x < -50) sh.x = W + 50;
    if (sh.x > W + 50) sh.x = -50;
    if (sh.y < -50) sh.y = H + 50;
    if (sh.y > H + 50) sh.y = -50;

    // Spear collision
    for (let j = spears.length - 1; j >= 0; j--) {
      const sp = spears[j];
      const dx = sp.x - sh.x;
      const dy = sp.y - sh.y;
      if (dx*dx + dy*dy < (sh.radius + 8*SCALE) * (sh.radius + 8*SCALE)) {
        sh.alive = false;
        sh.deathTimer = 0;
        spears.splice(j, 1);
        score += Math.round(100 * sh.size);
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('svHighScore', highScore.toString());
        }

        if (sp.electric) {
          // ELECTRIC EXPLOSION — blow up into bits and destroy nearby sharks
          const blastRadius = 120 * SCALE;
          // Big electric explosion particles
          spawnParticles(sh.x, sh.y, 'rgba(0,204,255,', 30, 6);
          spawnParticles(sh.x, sh.y, 'rgba(255,255,255,', 15, 4);
          // Draw electric shockwave ring (via particles spreading outward)
          for (let k = 0; k < 20; k++) {
            const a = (k / 20) * Math.PI * 2;
            particles.push({
              x: sh.x, y: sh.y,
              vx: Math.cos(a) * 5, vy: Math.sin(a) * 5,
              life: 1, decay: 0.025,
              color: 'rgba(0,204,255,', size: 3 * SCALE
            });
          }
          // Kill nearby sharks in blast radius
          for (let k = sharks.length - 1; k >= 0; k--) {
            const other = sharks[k];
            if (!other.alive || other === sh) continue;
            const odx = other.x - sh.x;
            const ody = other.y - sh.y;
            if (odx*odx + ody*ody < blastRadius * blastRadius) {
              other.alive = false;
              other.deathTimer = 0;
              score += Math.round(100 * other.size);
              spawnParticles(other.x, other.y, 'rgba(0,204,255,', 15, 4);
              spawnBlood(other.x, other.y);
            }
          }
          playSound('powerup'); // electric zap sound
        } else {
          spawnBlood(sh.x, sh.y);
          playSound('hit');
        }
        break;
      }
    }

    // Player collision
    if (sh.alive && p.invincible <= 0) {
      const dx = p.x - sh.x;
      const dy = p.y - sh.y;
      if (dx*dx + dy*dy < (p.radius + sh.radius) * (p.radius + sh.radius)) {
        if (p.shieldActive) {
          // Shield absorbs hit
          p.shieldActive = false;
          p.shieldTimer = 0;
          sh.alive = false;
          spawnBlood(sh.x, sh.y);
          spawnParticles(p.x, p.y, 'rgba(80,195,247,', 15, 4);
          playSound('hit');
          score += Math.round(50 * sh.size);
        } else {
          // Take damage
          lives--;
          spawnParticles(p.x, p.y, 'rgba(255,100,80,', 20, 4);
          playSound('damage');
          if (lives <= 0) {
            p.alive = false;
            saveToLeaderboard();
            gameState = STATE.GAME_OVER;
            playSound('gameover');
          } else {
            p.invincible = 120;
            p.x = W / 2;
            p.y = H / 2;
            p.vx = 0;
            p.vy = 0;
          }
        }
      }
    }
  }

  // --- Update power-ups ---
  for (let i = powerups.length - 1; i >= 0; i--) {
    const pu = powerups[i];
    pu.life--;
    if (pu.life <= 0) { powerups.splice(i, 1); continue; }

    // Player pickup
    const dx = p.x - pu.x;
    const dy = p.y - pu.y;
    if (dx*dx + dy*dy < (p.radius + pu.radius) * (p.radius + pu.radius)) {
      if (pu.type === 'trident') {
        p.trident = true;
        p.tridentTimer = 600;
      } else if (pu.type === 'shield') {
        p.shieldActive = true;
        p.shieldTimer = 900;
      } else if (pu.type === 'speed') {
        p.speedBoost = true;
        p.speedTimer = 480;
      } else if (pu.type === 'electric') {
        p.electricSpear = true;
        p.electricSpearTimer = 1800; // 30 seconds at 60fps
      }
      spawnParticles(pu.x, pu.y, 'rgba(255,255,200,', 10, 3);
      playSound('powerup');
      powerups.splice(i, 1);
    }
  }

  // --- Update particles ---
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vx *= 0.96;
    pt.vy *= 0.96;
    pt.life -= pt.decay;
    if (pt.life <= 0) particles.splice(i, 1);
  }

  // --- Spawn more sharks periodically ---
  if (gameTime % (Math.max(120, 300 - level * 20)) === 0 && sharks.filter(s => s.alive).length < 3 + level * 2) {
    spawnShark();
  }

  // --- Spawn power-ups ---
  if (gameTime % 600 === 0 && powerups.length < 2) {
    spawnPowerup();
  }

  // --- Level complete check (score-based: every 3000 points) ---
  const targetLevel = Math.floor(score / POINTS_PER_LEVEL) + 1;
  if (targetLevel > level && gameTime > 60) {
    nextLevel();
  }
}

// ============================================================
// MAIN RENDER
// ============================================================
function render() {
  const time = gameTime * 0.016;

  if (gameState === STATE.SPLASH) {
    drawSplash(time);
    return;
  }

  if (gameState === STATE.NAME_ENTRY) {
    drawNameEntry(time);
    return;
  }

  // Game background
  drawWater(time);

  // Power-ups
  for (const pu of powerups) drawPowerup(pu, time);

  // Spears
  for (const sp of spears) drawSpear(sp);

  // Sharks
  for (const sh of sharks) {
    if (sh.alive) {
      drawShark(sh, time);
    } else {
      // Death animation - sinking, fading
      ctx.save();
      ctx.globalAlpha = 1 - sh.deathTimer / 30;
      const shrink = 1 - sh.deathTimer / 60;
      ctx.translate(sh.x, sh.y);
      ctx.scale(shrink, shrink);
      ctx.translate(-sh.x, -sh.y);
      drawShark(sh, time);
      ctx.restore();
    }
  }

  // Particles
  drawParticles();

  // Player
  if (player) drawPlayer(player, time);

  // HUD
  drawHUD();

  // Level transition overlay
  if (gameState === STATE.LEVEL_TRANSITION) {
    drawLevelTransition(time);
  }

  // Game over overlay
  if (gameState === STATE.GAME_OVER) {
    drawGameOver(time);
  }
}

// ============================================================
// GAME LOOP
// ============================================================
function gameLoop() {
  resize(); // Handle any dynamic resizing
  update();
  render();
  requestAnimationFrame(gameLoop);
}

// ============================================================
// INPUT: START/RESTART
// ============================================================
function handleStart() {
  if (gameState === STATE.SPLASH || gameState === STATE.GAME_OVER) {
    playerName = '';
    nameError = '';
    gameState = STATE.NAME_ENTRY;
  }
}

function handleNameSubmit() {
  const trimmed = playerName.trim();
  if (trimmed.length === 0) {
    nameError = 'Please enter a name';
    return;
  }
  // Check if name is already on the leaderboard
  const existing = getActiveName(trimmed);
  if (existing) {
    nameError = 'This name has already been taken, choose another name';
    return;
  }
  nameError = '';
  playerName = trimmed;
  startGame();
}

window.addEventListener('keydown', e => {
  // Name entry input
  if (gameState === STATE.NAME_ENTRY) {
    if (e.code === 'Enter') {
      e.preventDefault();
      handleNameSubmit();
      return;
    }
    if (e.code === 'Backspace') {
      e.preventDefault();
      playerName = playerName.slice(0, -1);
      nameError = '';
      return;
    }
    if (e.code === 'Escape') {
      e.preventDefault();
      gameState = STATE.SPLASH;
      return;
    }
    // Allow typed characters (letters, numbers, spaces)
    if (e.key.length === 1 && playerName.length < 16) {
      e.preventDefault();
      playerName += e.key;
      nameError = '';
    }
    return;
  }

  if (e.code === 'Enter' || e.code === 'Space') {
    if (gameState === STATE.SPLASH || gameState === STATE.GAME_OVER) {
      e.preventDefault();
      handleStart();
    }
  }
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (gameState === STATE.SPLASH || gameState === STATE.GAME_OVER) {
    handleStart();
  }
  if (gameState === STATE.NAME_ENTRY) {
    // On touch devices, prompt for name via browser input
    const name = prompt('Enter your name:');
    if (name) {
      playerName = name.slice(0, 16);
      handleNameSubmit();
    }
  }
}, { passive: false });

canvas.addEventListener('click', e => {
  if (gameState === STATE.SPLASH || gameState === STATE.GAME_OVER) {
    handleStart();
  }
});

// ============================================================
// START
// ============================================================
gameLoop();

</script>
