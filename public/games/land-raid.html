        ctx.fillRect(sx - 4, sy - 3, 8, 6);
      }
    }

    // Gate
    if (villageGate) {
      const g = villageGate;
      if (!g.broken) {
        // Wooden gate
        const gateGrad = ctx.createLinearGradient(g.x, g.y, g.x + g.w, g.y);
        gateGrad.addColorStop(0, '#5a3a18');
        gateGrad.addColorStop(0.5, '#7a5a28');
        gateGrad.addColorStop(1, '#5a3a18');
        ctx.fillStyle = gateGrad;
        ctx.fillRect(g.x, g.y, g.w, g.h);
        // Planks
        ctx.strokeStyle = '#3a2008';
        ctx.lineWidth = 1;
        for (let i = 1; i < 5; i++) {
          ctx.beginPath();
          ctx.moveTo(g.x + g.w * i / 5, g.y);
          ctx.lineTo(g.x + g.w * i / 5, g.y + g.h);
          ctx.stroke();
        }
        // Iron bands
        ctx.fillStyle = '#505058';
        ctx.fillRect(g.x, g.y + 4, g.w, 3);
        ctx.fillRect(g.x, g.y + g.h - 7, g.w, 3);
        // Damage cracks
        const dmgRatio = 1 - g.hp / g.maxHp;
        if (dmgRatio > 0.15) {
          ctx.strokeStyle = '#1a0a02';
          ctx.lineWidth = 1.5;
          const numCracks = Math.floor(dmgRatio * 8);
          for (let i = 0; i < numCracks; i++) {
            const cx = g.x + 10 + (i * 37 % (g.w - 20));
            const cy = g.y + 3 + (i * 23 % (g.h - 6));
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + (i % 5) - 2, cy + 6 + (i % 3));
            ctx.stroke();
          }
        }
        // Gate HP bar when player is nearby
        const gdx = (g.x + g.w/2) - player.x, gdy = (g.y + g.h/2) - player.y;
        if (Math.sqrt(gdx*gdx + gdy*gdy) < 150) {
          const barW = g.w + 20;
          const barX = g.x - 10, barY = g.y - 18;
          ctx.fillStyle = 'rgba(0,0,0,0.7)';
          ctx.fillRect(barX, barY, barW, 10);
          ctx.fillStyle = dmgRatio > 0.6 ? '#c84020' : '#8a6a30';
          ctx.fillRect(barX + 1, barY + 1, (barW - 2) * (g.hp / g.maxHp), 8);
          ctx.strokeStyle = '#333';
          ctx.lineWidth = 1;
          ctx.strokeRect(barX, barY, barW, 10);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 9px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('GATE', g.x + g.w/2, barY + 8);
        }
      } else {
        // Broken gate - splintered wood debris
        ctx.fillStyle = '#4a2a08';
        ctx.fillRect(g.x, g.y, 8, g.h);
        ctx.fillRect(g.x + g.w - 8, g.y, 8, g.h);
        // Debris on ground
        ctx.fillStyle = 'rgba(90,60,20,0.4)';
        for (let i = 0; i < 6; i++) {
          ctx.save();
          ctx.translate(g.x + 10 + i * 10, g.y + g.h/2 + (i%3)*4 - 4);
          ctx.rotate(i * 0.8);
          ctx.fillRect(-6, -2, 12, 3);
          ctx.restore();
        }
        // Glow indicating entry
        const pulse = 0.3 + Math.sin(gameTime * 3) * 0.15;
        ctx.fillStyle = `rgba(212,168,67,${pulse})`;
        ctx.beginPath();
        ctx.ellipse(g.x + g.w/2, g.y + g.h/2, g.w/2 - 8, g.h, 0, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }

  // Buildings
  for (let b of buildings) drawBuilding(b);

  // Health pickups - potion vial
  for (let h of healthPickups) {
    ctx.save();
    ctx.translate(h.x, h.y);
    const hBob = Math.sin(gameTime*3 + h.x)*2;
    // Ground glow
    ctx.fillStyle = 'rgba(30,120,50,0.12)';
    ctx.beginPath();
    ctx.arc(0, hBob+2, h.size+4, 0, Math.PI*2);
    ctx.fill();
    // Vial body
    ctx.fillStyle = '#1a6a30';
    ctx.fillRect(-3, hBob-6, 6, 10);
    // Vial top
    ctx.fillStyle = '#2a8a40';
    ctx.fillRect(-4, hBob-8, 8, 4);
    // Cork
    ctx.fillStyle = '#8a6a30';
    ctx.fillRect(-2, hBob-10, 4, 3);
    // Shine
    ctx.fillStyle = 'rgba(150,255,150,0.3)';
    ctx.fillRect(-1, hBob-5, 2, 6);
    ctx.restore();
  }

  // Power-ups
  for (let p of powerups) {
    const bob = Math.sin(p.time * 2.5) * 3;
    ctx.save();
    ctx.translate(p.x, p.y + bob);
    if (p.type === 'hammer') {
      // Mjolnir - detailed
      // Ground glow
      ctx.fillStyle = `rgba(80,120,200,${0.08+Math.sin(p.time*3)*0.04})`;
      ctx.beginPath(); ctx.arc(0, 4, 22, 0, Math.PI*2); ctx.fill();
      // Handle - wrapped leather
      ctx.fillStyle = '#4a3a20';
      ctx.fillRect(-3, -4, 6, 18);
      ctx.strokeStyle = '#6a5a30';
      ctx.lineWidth = 0.8;
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.moveTo(-3, i*3); ctx.lineTo(3, i*3+1);
        ctx.stroke();
      }
      // Head - iron block
      const headGrad = ctx.createLinearGradient(-11, -14, 11, -6);
      headGrad.addColorStop(0, '#606068');
      headGrad.addColorStop(0.5, '#808088');
      headGrad.addColorStop(1, '#505058');
      ctx.fillStyle = headGrad;
      ctx.fillRect(-11, -16, 22, 14);
      ctx.strokeStyle = '#3a3a40';
      ctx.lineWidth = 1;
      ctx.strokeRect(-11, -16, 22, 14);
      // Rune engravings on head
      ctx.strokeStyle = 'rgba(100,150,220,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-6, -13); ctx.lineTo(-4, -6);
      ctx.moveTo(-6, -9); ctx.lineTo(-2, -9);
      ctx.moveTo(3, -13); ctx.lineTo(5, -6);
      ctx.moveTo(3, -9); ctx.lineTo(7, -12);
      ctx.stroke();
      // Lightning aura
      ctx.strokeStyle = `rgba(100,160,255,${0.2+Math.sin(p.time*5)*0.15})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, -4, 18, 0, Math.PI*2); ctx.stroke();
    } else {
      // Golden shield - ornate
      // Ground glow
      ctx.fillStyle = `rgba(180,150,40,${0.08+Math.sin(p.time*3)*0.03})`;
      ctx.beginPath(); ctx.arc(0, 4, 20, 0, Math.PI*2); ctx.fill();
      // Shield body
      const shieldGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, 14);
      shieldGrad.addColorStop(0, '#e8c840');
      shieldGrad.addColorStop(0.6, '#c8a030');
      shieldGrad.addColorStop(1, '#907020');
      ctx.fillStyle = shieldGrad;
      ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI*2); ctx.fill();
      // Rim
      ctx.strokeStyle = '#705010';
      ctx.lineWidth = 2;
      ctx.stroke();
      // Center boss
      ctx.fillStyle = '#d8b830';
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#a08020';
      ctx.lineWidth = 1;
      ctx.stroke();
      // Cross pattern
      ctx.strokeStyle = 'rgba(160,120,20,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, -11); ctx.lineTo(0, 11);
      ctx.moveTo(-11, 0); ctx.lineTo(11, 0);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Draw village walls and gate
  if (villageWall) {
    // Stone walls
    ctx.fillStyle = '#5a5a6a';
    ctx.fillRect(villageWall.x, villageWall.y, villageWall.w, villageWall.h);
    ctx.strokeStyle = '#3a3a4a';
    ctx.lineWidth = 8;
    ctx.strokeRect(villageWall.x, villageWall.y, villageWall.w, villageWall.h);

    // Draw gate
    if (villageGate) {
      if (villageGate.broken) {
        ctx.fillStyle = 'rgba(90,70,50,0.3)';
      } else {
        ctx.fillStyle = '#8a6a4a';
      }
      ctx.fillRect(villageGate.x, villageGate.y, villageGate.w, villageGate.h);

      if (!villageGate.broken) {
        // Gate HP bar
        const playerDist = Math.sqrt((player.x - (villageGate.x + villageGate.w/2))**2 + (player.y - (villageGate.y + villageGate.h/2))**2);
        if (playerDist < 150) {
          ctx.fillStyle = '#c0392b';
          ctx.fillRect(villageGate.x - 15, villageGate.y - 15, villageGate.w + 30, 8);
          ctx.fillStyle = '#27ae60';
          ctx.fillRect(villageGate.x - 15, villageGate.y - 15, (villageGate.hp / villageGate.maxHp) * (villageGate.w + 30), 8);
        }
      } else {
        // Draw open gate
        ctx.strokeStyle = '#6a5a3a';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(villageGate.x, villageGate.y, villageGate.w, villageGate.h);
        ctx.setLineDash([]);
      }
    }
  }

  // Catapults on village walls
  for (let c of catapults) {
    ctx.save();
    ctx.translate(c.x, c.y);
    const cs = c.size;

    // Flash when hit
    if (c.hitFlash > 0) {
      ctx.fillStyle = '#ffffff';
    } else {
      ctx.fillStyle = '#6a5020'; // wooden base
    }
    // Base platform
    ctx.fillRect(-cs*0.7, -cs*0.4, cs*1.4, cs*0.8);
    // Arm (vertical piece)
    ctx.fillStyle = c.hitFlash > 0 ? '#ffffff' : '#8b6914';
    ctx.fillRect(-cs*0.15, -cs*0.9, cs*0.3, cs*0.7);
    // Bucket/scoop at top
    ctx.fillStyle = c.hitFlash > 0 ? '#ffffff' : '#5a4a20';
    ctx.beginPath();
    ctx.arc(0, -cs*0.9, cs*0.3, 0, Math.PI*2);
    ctx.fill();
    // Wheels
    ctx.fillStyle = '#4a3a1a';
    ctx.beginPath(); ctx.arc(-cs*0.5, cs*0.4, cs*0.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cs*0.5, cs*0.4, cs*0.2, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // HP bar
    if (c.hp < c.maxHp) {
      const barW = cs * 2, barH = 3;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(c.x - barW/2 - 1, c.y - cs - 8, barW + 2, barH + 2);
      ctx.fillStyle = c.hp / c.maxHp > 0.5 ? '#c0a030' : '#c04030';
      ctx.fillRect(c.x - barW/2, c.y - cs - 7, barW * (c.hp / c.maxHp), barH);
    }
  }

  // Wolves — gray wolf shapes with bite animation
  for (let w of wolves) {
    if (w.hitFlash > 0 && Math.floor(gameTime*20)%2===0) continue; // flash when hit
    ctx.save();
    ctx.translate(w.x, w.y);
    ctx.rotate(w.facing);
    const s = w.size;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(0, s*0.3, s*0.9, s*0.25, 0, 0, Math.PI*2); ctx.fill();

    // Body — gray fur with darker back
    ctx.fillStyle = w.hitFlash > 0 ? '#fff' : '#8a8a90';
    ctx.beginPath(); ctx.ellipse(0, 0, s*1.0, s*0.5, 0, 0, Math.PI*2); ctx.fill();
    // Darker stripe on back
    ctx.fillStyle = '#6a6a70';
    ctx.beginPath(); ctx.ellipse(0, -s*0.15, s*0.7, s*0.2, 0, 0, Math.PI*2); ctx.fill();

    // Tail — sticks out behind the wolf
    ctx.strokeStyle = '#7a7a80';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-s*0.8, 0);
    ctx.quadraticCurveTo(-s*1.4, -s*0.3 + Math.sin(gameTime*6+w.x)*2, -s*1.2, -s*0.5);
    ctx.stroke();

    // Legs (4 little legs running)
    const legOff = Math.sin(gameTime*12 + w.x)*2;
    ctx.fillStyle = '#707076';
    ctx.fillRect(s*0.3, s*0.2+legOff, s*0.15, s*0.35);
    ctx.fillRect(s*0.05, s*0.2-legOff, s*0.15, s*0.35);
    ctx.fillRect(-s*0.3, s*0.2+legOff, s*0.15, s*0.35);
    ctx.fillRect(-s*0.55, s*0.2-legOff, s*0.15, s*0.35);

    // Head
    ctx.fillStyle = w.hitFlash > 0 ? '#fff' : '#9a9aa0';
    ctx.beginPath(); ctx.ellipse(s*0.7, -s*0.1, s*0.4, s*0.32, 0, 0, Math.PI*2); ctx.fill();

    // Snout/muzzle
    ctx.fillStyle = '#b0b0b8';
    const jawOpen = w.biteAnim > 0 ? Math.sin(w.biteAnim * Math.PI * 8) * 3 : 0;
    // Upper jaw
    ctx.beginPath();
    ctx.moveTo(s*0.9, -s*0.15);
    ctx.lineTo(s*1.3, -s*0.08 - jawOpen*0.5);
    ctx.lineTo(s*0.9, -s*0.0);
    ctx.fill();
    // Lower jaw
    ctx.beginPath();
    ctx.moveTo(s*0.9, s*0.0);
    ctx.lineTo(s*1.25, s*0.05 + jawOpen);
    ctx.lineTo(s*0.9, s*0.1);
    ctx.fill();

    // Eye — small and bright
    ctx.fillStyle = '#e8c820';
    ctx.beginPath(); ctx.arc(s*0.75, -s*0.18, s*0.08, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(s*0.76, -s*0.18, s*0.04, 0, Math.PI*2); ctx.fill();

    // Ears — pointed triangles
    ctx.fillStyle = '#7a7a80';
    ctx.beginPath();
    ctx.moveTo(s*0.5, -s*0.35); ctx.lineTo(s*0.65, -s*0.6); ctx.lineTo(s*0.75, -s*0.3);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(s*0.6, -s*0.35); ctx.lineTo(s*0.8, -s*0.55); ctx.lineTo(s*0.85, -s*0.25);
    ctx.fill();

    ctx.restore();

    // Wolf HP bar (only show when damaged)
    if (w.hp < w.maxHp) {
      const barW = s * 1.8, barH = 2;
      const barY = w.y - s - 8;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(w.x - barW/2 - 1, barY - 1, barW + 2, barH + 2);
      ctx.fillStyle = w.hp / w.maxHp > 0.5 ? '#8a8a9a' : '#aa6a4a';
      ctx.fillRect(w.x - barW/2, barY, barW * (w.hp / w.maxHp), barH);
    }
    // "WOLF" label
    ctx.fillStyle = '#8a8a9a';
    ctx.font = 'bold 7px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('WOLF', w.x, w.y - s - 11);
  }

  // Allies (drawn before enemies so they layer properly)
  for (let a of allies) {
    if (a.hitFlash > 0 && Math.floor(gameTime*20)%2===0) continue; // flash when hit
    // Draw ally as a Viking with a green-tinted cloak
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.facing + Math.PI/2);
    const s = a.size;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(0, s*0.5, s*0.85, s*0.3, 0, 0, Math.PI*2); ctx.fill();

    // Legs
    const legOff = Math.sin(gameTime*10 + a.x)*2;
    ctx.fillStyle = '#4a3520';
    ctx.fillRect(-s*0.32, s*0.2+legOff, s*0.22, s*0.45);
    ctx.fillRect(s*0.1, s*0.2-legOff, s*0.22, s*0.45);
    ctx.fillStyle = '#2a1a0a';
    ctx.fillRect(-s*0.35, s*0.55+legOff, s*0.28, s*0.12);
    ctx.fillRect(s*0.07, s*0.55-legOff, s*0.28, s*0.12);

    // Torso — chainmail
    const tGrad = ctx.createRadialGradient(0, 0, s*0.1, 0, 0, s);
    tGrad.addColorStop(0, '#6a7a62');
    tGrad.addColorStop(0.5, '#506048');
    tGrad.addColorStop(1, '#38483e');
    ctx.fillStyle = tGrad;
    ctx.beginPath(); ctx.ellipse(0, 0, s*0.75, s*0.6, 0, 0, Math.PI*2); ctx.fill();

    // Green cloak (ally identifier)
    ctx.fillStyle = 'rgba(40,100,50,0.6)';
    ctx.beginPath();
    ctx.moveTo(-s*0.5, s*0.1);
    ctx.quadraticCurveTo(-s*0.3, s*1.1+Math.sin(gameTime*3)*2, s*0.3, s*1.1+Math.sin(gameTime*3+1)*2);
    ctx.quadraticCurveTo(s*0.5, s*0.5, s*0.5, s*0.1);
    ctx.fill();

    // Belt
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(-s*0.65, -s*0.04, s*1.3, s*0.1);

    // Shoulders
    ctx.fillStyle = '#58685e';
    ctx.beginPath(); ctx.ellipse(-s*0.6, -s*0.1, s*0.22, s*0.18, -0.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s*0.6, -s*0.1, s*0.22, s*0.18, 0.2, 0, Math.PI*2); ctx.fill();

    // Head
    const hGrad = ctx.createRadialGradient(0, -s*0.5, 1, 0, -s*0.5, s*0.4);
    hGrad.addColorStop(0, '#d4aa70');
    hGrad.addColorStop(1, '#a07848');
    ctx.fillStyle = hGrad;
    ctx.beginPath(); ctx.arc(0, -s*0.5, s*0.36, 0, Math.PI*2); ctx.fill();

    // Helmet — iron with green trim
    ctx.fillStyle = '#607068';
    ctx.beginPath(); ctx.arc(0, -s*0.55, s*0.38, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#406048';
    ctx.fillRect(-s*0.4, -s*0.56, s*0.8, s*0.07);

    // Horns
    ctx.strokeStyle = '#d8ccb0';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-s*0.36, -s*0.55); ctx.quadraticCurveTo(-s*0.9, -s*1.0, -s*0.55, -s*1.35); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s*0.36, -s*0.55); ctx.quadraticCurveTo(s*0.9, -s*1.0, s*0.55, -s*1.35); ctx.stroke();

    // Beard
    ctx.fillStyle = '#7a5a2a';
    ctx.beginPath();
    ctx.moveTo(-s*0.2, -s*0.25); ctx.quadraticCurveTo(0, s*0.1, s*0.2, -s*0.25);
    ctx.fill();

    ctx.rotate(-(a.facing + Math.PI/2));

    // Weapon swing
    if (a.attackAnim > 0) {
      const swAng = a.facing + (Math.PI/3) * Math.sin(a.attackAnim * Math.PI * 4);
      const hx = Math.cos(a.facing)*s*0.4, hy = Math.sin(a.facing)*s*0.4;
      const wx = Math.cos(swAng) * (s + 30), wy = Math.sin(swAng) * (s + 30);
      ctx.strokeStyle = '#c0c0c8';
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(wx, wy); ctx.stroke();
      // Cross guard
      const mx = (hx+wx)*0.3, my = (hy+wy)*0.3;
      const px = Math.cos(swAng+Math.PI/2)*5, py = Math.sin(swAng+Math.PI/2)*5;
      ctx.strokeStyle = '#8a7a30'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(mx-px, my-py); ctx.lineTo(mx+px, my+py); ctx.stroke();
      // Trail
      ctx.strokeStyle = 'rgba(200,200,220,0.15)'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(0, 0, s + 20, swAng-0.4, swAng+0.4); ctx.stroke();
    } else {
      const idleAng = a.facing - 0.3;
      ctx.strokeStyle = '#a0a0a8'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a.facing)*s*0.3, Math.sin(a.facing)*s*0.3);
      ctx.lineTo(Math.cos(idleAng)*s*1.1, Math.sin(idleAng)*s*1.1);
      ctx.stroke();
    }

    ctx.restore();

    // Ally HP bar
    if (a.hp < a.maxHp) {
      const barW = s * 2.2, barH = 3;
      const barY = a.y - s - 12;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(a.x - barW/2 - 1, barY - 1, barW + 2, barH + 2);
      ctx.fillStyle = a.hp / a.maxHp > 0.5 ? '#2a8a3a' : '#8a8a2a';
      ctx.fillRect(a.x - barW/2, barY, barW * (a.hp / a.maxHp), barH);
    }
    // "ALLY" label
    ctx.fillStyle = '#4a8a4a';
    ctx.font = 'bold 8px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('ALLY', a.x, a.y - s - 16);
  }

  // Enemies
  for (let e of enemies) drawEnemy(e);

  // Player
  if (player) {
    if (player.invuln <= 0 || Math.floor(gameTime*20)%2===0) {
      drawViking(player.x, player.y, player.size, player.facing, player.attackAnim, player.shieldTimer > 0);
    }
  }

  // Trees (in front)
  for (let t of trees) if (t.y >= player.y) drawTree(t);

  // Projectiles
  for (let p of projectiles) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(Math.atan2(p.vy, p.vx));
    if (p.owner === 'catapult') {
      // Rock/boulder projectile
      ctx.fillStyle = '#7a6a5a';
      ctx.beginPath(); ctx.arc(0, 0, p.size, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#5a4a3a';
      ctx.beginPath(); ctx.arc(-2, -2, p.size*0.5, 0, Math.PI*2); ctx.fill();
    } else if (p.type === 'arrow') {
      // Shaft
      ctx.fillStyle = p.owner === 'player' ? '#7a6a40' : '#5a3a18';
      ctx.fillRect(-10, -1, 18, 2);
      // Arrowhead - metal
      ctx.fillStyle = p.owner === 'player' ? '#b0b0b8' : '#707078';
      ctx.beginPath();
      ctx.moveTo(8, -3.5);
      ctx.lineTo(14, 0);
      ctx.lineTo(8, 3.5);
      ctx.fill();
      // Fletching
      ctx.fillStyle = p.owner === 'player' ? 'rgba(180,180,190,0.5)' : 'rgba(100,60,30,0.5)';
      ctx.beginPath();
      ctx.moveTo(-10, -2.5); ctx.lineTo(-7, 0); ctx.lineTo(-10, 2.5);
      ctx.fill();
    }
    ctx.restore();
  }

  // Particles
  for (let p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    if (p.type === 'sparkle') {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (p.life/p.maxLife), 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;

  // Flash effect
  if (flashTimer > 0) {
    ctx.fillStyle = flashColor;
    ctx.fillRect(-20, -20, W+40, H+40);
  }

  ctx.restore();

  // ---- HUD ----
  if (player) {
    // HP Bar
    const barX = 15, barY = 15, barW = 180, barH = 18;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(barX-2, barY-2, barW+4, barH+4);
    const hpRatio = player.hp / player.maxHp;
    ctx.fillStyle = hpRatio > 0.5 ? '#2a8' : hpRatio > 0.25 ? '#da2' : '#d22';
    ctx.fillRect(barX, barY, barW * hpRatio, barH);
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX-2, barY-2, barW+4, barH+4);
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.max(11,13*SCALE)}px sans-serif`;
    ctx.textAlign = 'left';
    ctx.fillText(`HP: ${Math.ceil(player.hp)}/${player.maxHp}`, barX+5, barY+14);

    // Shield timer
    if (player.shieldTimer > 0) {
      ctx.fillStyle = BRAND.gold;
      ctx.font = `bold ${Math.max(12,14*SCALE)}px sans-serif`;
      ctx.fillText(`🛡 ${player.shieldTimer.toFixed(1)}s`, barX, barY + 35);
    }

    // Score & Gold
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'right';
    ctx.font = `bold ${Math.max(14,16*SCALE)}px 'NorseBold', sans-serif`;
    ctx.fillText(`Score: ${score}`, W-15, 28);
    ctx.fillStyle = BRAND.gold;
    ctx.fillText(`Gold: ${gold}`, W-15, 50);

    // Level & Gate status
    ctx.fillStyle = BRAND.cream;
    ctx.textAlign = 'center';
    ctx.font = `${Math.max(13,15*SCALE)}px 'Norse', sans-serif`;
    let gateStatus = '';
    if (villageGate) {
      if (villageGate.broken) gateStatus = ' — Gate Broken! Enter Village!';
      else if (enemies.length > 0) gateStatus = ` — Defeat all enemies to unlock gate (${enemies.length} remaining)`;
      else gateStatus = ` — Gate unlocked! Bash it! (${Math.ceil(villageGate.hp)}/${villageGate.maxHp})`;
    }
    ctx.fillText(`Level ${level}${gateStatus}`, W/2, 25);

    // "Kill enemies first" flash message
    if (gateBlockedMsg > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, gateBlockedMsg);
      ctx.fillStyle = '#ff4444';
      ctx.font = `bold ${Math.max(18,24*SCALE)}px 'NorseBold', sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('DEFEAT ALL ENEMIES FIRST!', W/2, H * 0.45);
      ctx.restore();
    }

    // Squad indicator — show allies and wolves count
    if (allies.length > 0 || wolves.length > 0) {
      ctx.save();
      ctx.fillStyle = '#8a9a8a';
      ctx.font = `bold ${Math.max(11,13*SCALE)}px sans-serif`;
      ctx.textAlign = 'right';
      let squadText = 'Squad:';
      if (allies.length > 0) squadText += ` ${allies.length} raider${allies.length>1?'s':''}`;
      if (wolves.length > 0) squadText += `${allies.length>0?' +':''} ${wolves.length} wolf${wolves.length>1?'ves':''}`;
      ctx.fillText(squadText, W - 15, 42);
      ctx.restore();
    }

    // Catapult warning
    if (catapults.length > 0) {
      ctx.save();
      ctx.fillStyle = '#cc8833';
      ctx.font = `bold ${Math.max(11,13*SCALE)}px sans-serif`;
      ctx.textAlign = 'right';
      const catMsg = enemies.length > 0
        ? `⚠ Catapults: ${catapults.length} (dormant — kill enemies first)`
        : `⚠ Catapults: ${catapults.length} ACTIVE — shoot with arrows!`;
      ctx.fillStyle = enemies.length > 0 ? '#887744' : '#cc8833';
      ctx.fillText(catMsg, W - 15, 55);
      ctx.restore();
    }

    // Weapon indicator - all 7 weapons
    const wepY = H - (isTouchDevice ? 230 : 50);
    const wepSlotW = Math.min(52, (W - 30) / WEAPONS.length);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(8, wepY - 5, wepSlotW * WEAPONS.length + 14, 35);
    for (let i = 0; i < WEAPONS.length; i++) {
      const wx = 12 + i * wepSlotW;
      if (!WEAPONS[i].unlocked) {
        ctx.fillStyle = 'rgba(60,60,60,0.4)';
        ctx.fillRect(wx, wepY, wepSlotW - 4, 25);
        ctx.fillStyle = '#444';
        ctx.font = '9px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🔒', wx+(wepSlotW-4)/2, wepY+17);
      } else {
        const isCurrent = i === currentWeapon;
        ctx.fillStyle = isCurrent ? 'rgba(212,168,67,0.5)' : 'rgba(80,80,80,0.5)';
        ctx.fillRect(wx, wepY, wepSlotW - 4, 25);
        ctx.strokeStyle = isCurrent ? BRAND.gold : '#555';
        ctx.lineWidth = isCurrent ? 2 : 1;
        ctx.strokeRect(wx, wepY, wepSlotW - 4, 25);
        ctx.fillStyle = isCurrent ? '#fff' : '#aaa';
        ctx.font = `bold ${Math.max(8, 10*SCALE)}px sans-serif`;
        ctx.textAlign = 'center';
        const shortName = WEAPONS[i].name.length > 6 ? WEAPONS[i].name.substring(0,6) : WEAPONS[i].name;
        ctx.fillText(`${i+1}:${shortName}`, wx+(wepSlotW-4)/2, wepY+17);
      }
    }
  }
}

function drawSplash(time) {
  // Dark atmospheric background
  const bgGrad = ctx.createRadialGradient(W/2, H*0.4, 50, W/2, H*0.5, Math.max(W,H)*0.8);
  bgGrad.addColorStop(0, '#1a1a12');
  bgGrad.addColorStop(0.5, '#0e0e08');
  bgGrad.addColorStop(1, '#060604');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Atmospheric fog/mist
  for (let i = 0; i < 8; i++) {
    const fx = W*0.2 + ((i*173) % 100)/100*W*0.6;
    const fy = H*0.6 + ((i*89) % 50)/100*H*0.3;
    ctx.fillStyle = `rgba(30,35,25,${0.03+Math.sin(time*0.5+i)*0.01})`;
    ctx.beginPath();
    ctx.ellipse(fx + Math.sin(time*0.3+i)*20, fy, 80+i*15, 20+i*5, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // Logo with subtle glow
  const logoSize = Math.min(W, H) * 0.38;
  ctx.globalAlpha = 0.06 + Math.sin(time*1.5)*0.02;
  ctx.fillStyle = BRAND.gold;
  ctx.beginPath();
  ctx.arc(W/2, H*0.3, logoSize*0.5, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha = 1;
  drawLogo(W/2, H * 0.3, logoSize);

  // Title
  ctx.fillStyle = BRAND.cream;
  ctx.textAlign = 'center';
  ctx.font = `bold ${Math.max(30, 46*SCALE)}px 'NorseBold', serif`;
  ctx.fillText('LAND RAID', W/2, H * 0.57);
  // Title shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillText('LAND RAID', W/2 + 2, H * 0.57 + 2);
  // Re-draw on top
  ctx.fillStyle = BRAND.cream;
  ctx.fillText('LAND RAID', W/2, H * 0.57);

  // Subtitle - understated
  ctx.fillStyle = 'rgba(180,150,80,0.7)';
  ctx.font = `${Math.max(13, 16*SCALE)}px 'Norse', serif`;
  ctx.fillText('Pillage the Villages', W/2, H * 0.63);

  // Divider line
  ctx.strokeStyle = 'rgba(180,150,80,0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W/2 - 80, H * 0.66);
  ctx.lineTo(W/2 + 80, H * 0.66);
  ctx.stroke();

  // Start prompt
  const pulse = 0.35 + Math.sin(time * 2.5) * 0.35;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = 'rgba(220,210,190,0.9)';
  ctx.font = `${Math.max(14, 16*SCALE)}px 'Norse', sans-serif`;
  ctx.fillText(isTouchDevice ? 'TAP TO START' : 'PRESS ENTER TO START', W/2, H * 0.72);
  ctx.globalAlpha = 1;

  // Leaderboard
  if (leaderboard.length > 0) {
    ctx.fillStyle = 'rgba(180,150,80,0.6)';
    ctx.font = `bold ${Math.max(13,15*SCALE)}px 'NorseBold', sans-serif`;
    ctx.fillText('HALL OF FAME', W/2, H * 0.80);
    ctx.font = `${Math.max(11,13*SCALE)}px sans-serif`;
    const top5 = leaderboard.slice(0, 5);
    for (let i = 0; i < top5.length; i++) {
      ctx.fillStyle = i === 0 ? 'rgba(180,150,80,0.7)' : 'rgba(200,200,200,0.4)';
      ctx.fillText(`${i+1}. ${top5[i].name} — ${top5[i].score}`, W/2, H*0.84 + i*Math.max(15,17*SCALE));
    }
  }

  // Branding
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.font = `${Math.max(10,11*SCALE)}px sans-serif`;
  ctx.fillText('surfvikings.com', W/2, H * 0.97);
}

function drawNameEntry(time) {
  ctx.fillStyle = '#1a1a0e';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = BRAND.cream;
  ctx.textAlign = 'center';
  ctx.font = `bold ${Math.max(24,32*SCALE)}px 'NorseBold', serif`;
  ctx.fillText('ENTER YOUR NAME, WARRIOR', W/2, H*0.3);

  // Name box
  const boxW = 300, boxH = 50;
  ctx.fillStyle = 'rgba(50,50,40,0.8)';
  ctx.fillRect(W/2-boxW/2, H*0.4, boxW, boxH);
  ctx.strokeStyle = BRAND.gold;
  ctx.lineWidth = 2;
  ctx.strokeRect(W/2-boxW/2, H*0.4, boxW, boxH);

  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.max(20,24*SCALE)}px sans-serif`;
  const cursor = Math.floor(time*2)%2===0 ? '|' : '';

  if (nameError) {
    ctx.fillStyle = '#f44';

  ctx.fillStyle = 'rgba(255,255,255,0.5)';

}

function drawLanding() {
  drawTerrain();

  // Viking ship at beach
  const shipX = W/2, shipY = H * 0.9 - (3 - landingTimer) * 20;
  ctx.save();
  ctx.translate(shipX, shipY);
  // Hull
  ctx.fillStyle = '#6b4226';
  ctx.beginPath();
  ctx.moveTo(-40, 0);
  ctx.quadraticCurveTo(-50, 15, -35, 20);
  ctx.lineTo(35, 20);
  ctx.quadraticCurveTo(50, 15, 40, 0);
  ctx.quadraticCurveTo(0, -10, -40, 0);
  ctx.fill();
  ctx.strokeStyle = '#3a2010';
  ctx.lineWidth = 2;
  ctx.stroke();
  // Mast
  ctx.fillStyle = '#4a2a0a';
  ctx.fillRect(-2, -40, 4, 40);
  // Sail
  ctx.fillStyle = '#c8b898';
  ctx.beginPath();
  ctx.moveTo(-20, -38);
  ctx.lineTo(20, -38);
  ctx.lineTo(15, -10);
  ctx.lineTo(-15, -10);
  ctx.fill();
  // Dragon head
  ctx.fillStyle = '#8B6914';
  ctx.beginPath();
  ctx.moveTo(40, 0);
  ctx.quadraticCurveTo(55, -15, 50, -25);
  ctx.quadraticCurveTo(45, -20, 40, -5);
  ctx.fill();
  ctx.restore();

  // Text
  ctx.fillStyle = BRAND.cream;
  ctx.textAlign = 'center';
  ctx.font = `bold ${Math.max(22,30*SCALE)}px 'NorseBold', serif`;
  ctx.fillText(`LEVEL ${level}: VILLAGE RAID`, W/2, H * 0.15);

  ctx.fillStyle = BRAND.gold;
  ctx.font = `${Math.max(14,18*SCALE)}px 'Norse', serif`;
  ctx.fillText('The warriors approach the shore...', W/2, H * 0.22);
}

// ============================================================
// SHOP
// ============================================================
let shopSelection = 0;
const shopItems = [
  { name:'Weapon Damage', key:'damage', cost:60, desc:'+5 damage per hit', max:5, type:'upgrade' },
  { name:'Armor', key:'armor', cost:50, desc:'+3 damage reduction', max:5, type:'upgrade' },
  { name:'Speed', key:'speed', cost:40, desc:'+0.5 movement speed', max:5, type:'upgrade' },
  { name:'Max Health', key:'maxHp', cost:70, desc:'+25 max HP', max:5, type:'upgrade' },
  { name:'Fire Blade', weaponIdx:6, cost:6000, desc:'One-hit kills on any enemy', type:'weapon' },
  { name:'Sword of Summer', weaponIdx:5, cost:7000, desc:'Breaks walls, kills 3 per swipe', type:'weapon' },
  { name:"Thor's Hammer", weaponIdx:4, cost:9000, desc:'Devastating AoE radius attack', type:'weapon' },
  { name:'Hire Viking Raider', cost:750, desc:'Sword-wielding ally fights beside you', type:'ally' },
  { name:'Raider Horde', cost:2025, desc:'Summon 5 raiders to overwhelm the enemy!', type:'horde' },
  { name:'Hire Wolf', cost:370, desc:'Fast gray wolf — bites enemies, quick on its feet', type:'wolf' },
  { name:'Wolf Pack', cost:870, desc:'Summon 4 wolves to hunt as a pack!', type:'wolfpack' }
];

function drawShop() {
  ctx.fillStyle = 'rgba(15,15,10,0.95)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = BRAND.cream;
  ctx.textAlign = 'center';
  ctx.font = `bold ${Math.max(28,36*SCALE)}px 'NorseBold', serif`;
  ctx.fillText('VIKING ARMORY', W/2, H*0.08);

  ctx.fillStyle = BRAND.gold;
  ctx.font = `bold ${Math.max(18,22*SCALE)}px 'Norse', serif`;
  ctx.fillText(`Gold: ${gold}`, W/2, H*0.14);

  // Section headers
  ctx.fillStyle = 'rgba(180,150,80,0.5)';
  ctx.font = `${Math.max(12,14*SCALE)}px 'Norse', sans-serif`;
  ctx.fillText('— UPGRADES —', W/2, H*0.19);

  const startY = H * 0.21;
  const itemH = Math.min(55, (H * 0.6) / shopItems.length);

  for (let i = 0; i < shopItems.length; i++) {
    const item = shopItems[i];
    const y = startY + i * itemH;
    const isSelected = i === shopSelection;

    // Section dividers
    if (i === 4 && item.type === 'weapon') {
      ctx.fillStyle = 'rgba(180,150,80,0.5)';
      ctx.font = `${Math.max(12,14*SCALE)}px 'Norse', sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('— PREMIUM WEAPONS —', W/2, y - 2);
    }
    if (item.type === 'wolf' && (i === 0 || shopItems[i-1].type !== 'wolf')) {
      ctx.fillStyle = 'rgba(140,140,170,0.5)';
      ctx.font = `${Math.max(12,14*SCALE)}px 'Norse', sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('— WOLF COMPANIONS —', W/2, y + 4);
    }

    if (item.type === 'upgrade') {
      const lvl = upgrades[item.key];
      const maxed = lvl >= item.max;
      const canBuy = gold >= item.cost && !maxed;

      ctx.fillStyle = isSelected ? 'rgba(212,168,67,0.15)' : 'rgba(50,50,40,0.4)';
      ctx.fillRect(W/2 - 200, y, 400, itemH - 6);
      if (isSelected) { ctx.strokeStyle = BRAND.gold; ctx.lineWidth = 2; ctx.strokeRect(W/2 - 200, y, 400, itemH - 6); }

      ctx.fillStyle = isSelected ? '#fff' : '#aaa';
      ctx.textAlign = 'left';
      ctx.font = `bold ${Math.max(13,15*SCALE)}px 'NorseBold', sans-serif`;
      ctx.fillText(item.name, W/2 - 185, y + 18);

      for (let j = 0; j < item.max; j++) {
        ctx.fillStyle = j < lvl ? BRAND.gold : '#333';
        ctx.fillRect(W/2 - 185 + j * 16, y + 26, 10, 6);
      }

      ctx.textAlign = 'right';
      if (maxed) { ctx.fillStyle = '#888'; ctx.font = `bold ${Math.max(11,13*SCALE)}px sans-serif`; ctx.fillText('MAXED', W/2 + 185, y + 18); }
      else { ctx.fillStyle = canBuy ? BRAND.gold : '#666'; ctx.font = `bold ${Math.max(11,13*SCALE)}px sans-serif`; ctx.fillText(`${item.cost}g`, W/2 + 185, y + 18); }

      ctx.fillStyle = '#777'; ctx.textAlign = 'left'; ctx.font = `${Math.max(10,12*SCALE)}px sans-serif`; ctx.fillText(item.desc, W/2 - 185, y + 42);
    } else if (item.type === 'weapon') {
      // Weapon item
      const owned = WEAPONS[item.weaponIdx].unlocked;
      const canBuy = gold >= item.cost && !owned;
      const weaponColor = WEAPONS[item.weaponIdx].color;

      ctx.fillStyle = isSelected ? 'rgba(212,168,67,0.15)' : 'rgba(40,35,25,0.5)';
      ctx.fillRect(W/2 - 200, y + 8, 400, itemH - 6);
      if (isSelected) { ctx.strokeStyle = weaponColor; ctx.lineWidth = 2; ctx.strokeRect(W/2 - 200, y + 8, 400, itemH - 6); }

      // Weapon color indicator
      ctx.fillStyle = weaponColor;
      ctx.fillRect(W/2 - 195, y + 14, 4, itemH - 18);

      ctx.fillStyle = isSelected ? '#fff' : '#ccc';
      ctx.textAlign = 'left';
      ctx.font = `bold ${Math.max(13,15*SCALE)}px 'NorseBold', sans-serif`;
      ctx.fillText(item.name, W/2 - 180, y + 26);

      ctx.textAlign = 'right';
      if (owned) { ctx.fillStyle = '#4a8'; ctx.font = `bold ${Math.max(11,13*SCALE)}px sans-serif`; ctx.fillText('OWNED', W/2 + 185, y + 26); }
      else { ctx.fillStyle = canBuy ? BRAND.gold : '#666'; ctx.font = `bold ${Math.max(11,13*SCALE)}px sans-serif`; ctx.fillText(`${item.cost.toLocaleString()}g`, W/2 + 185, y + 26); }

      ctx.fillStyle = '#888'; ctx.textAlign = 'left'; ctx.font = `${Math.max(10,12*SCALE)}px sans-serif`; ctx.fillText(item.desc, W/2 - 180, y + 42);
    } else if (item.type === 'ally') {
      // Ally hire item
      const canBuy = gold >= item.cost;

      ctx.fillStyle = isSelected ? 'rgba(100,180,120,0.15)' : 'rgba(35,50,35,0.5)';
      ctx.fillRect(W/2 - 200, y + 8, 400, itemH - 6);
      if (isSelected) { ctx.strokeStyle = '#4a8a4a'; ctx.lineWidth = 2; ctx.strokeRect(W/2 - 200, y + 8, 400, itemH - 6); }

      // Green ally indicator
      ctx.fillStyle = '#4a8a4a';
      ctx.fillRect(W/2 - 195, y + 14, 4, itemH - 18);

      ctx.fillStyle = isSelected ? '#fff' : '#ccc';
      ctx.textAlign = 'left';
      ctx.font = `bold ${Math.max(13,15*SCALE)}px 'NorseBold', sans-serif`;
      ctx.fillText(item.name, W/2 - 180, y + 26);

      ctx.textAlign = 'right';
      ctx.fillStyle = canBuy ? BRAND.gold : '#666';
      ctx.font = `bold ${Math.max(11,13*SCALE)}px sans-serif`;
      ctx.fillText(`${item.cost.toLocaleString()}g`, W/2 + 185, y + 26);

      // Show current ally count
      if (allies.length > 0) {
        ctx.fillStyle = '#4a8a4a';
        ctx.fillText(`(${allies.length} active)`, W/2 + 185, y + 40);
      }

      ctx.fillStyle = '#888'; ctx.textAlign = 'left'; ctx.font = `${Math.max(10,12*SCALE)}px sans-serif`; ctx.fillText(item.desc, W/2 - 180, y + 42);
    } else if (item.type === 'horde') {
      // Horde hire item
      const canBuy = gold >= item.cost;

      ctx.fillStyle = isSelected ? 'rgba(180,100,40,0.2)' : 'rgba(50,35,20,0.5)';
      ctx.fillRect(W/2 - 200, y + 8, 400, itemH - 6);
      if (isSelected) { ctx.strokeStyle = '#c87830'; ctx.lineWidth = 2; ctx.strokeRect(W/2 - 200, y + 8, 400, itemH - 6); }

      // Orange horde indicator
      ctx.fillStyle = '#c87830';
      ctx.fillRect(W/2 - 195, y + 14, 4, itemH - 18);

      ctx.fillStyle = isSelected ? '#fff' : '#ccc';
      ctx.textAlign = 'left';
      ctx.font = `bold ${Math.max(13,15*SCALE)}px 'NorseBold', sans-serif`;
      ctx.fillText(item.name, W/2 - 180, y + 26);

      ctx.textAlign = 'right';
      ctx.fillStyle = canBuy ? BRAND.gold : '#666';
      ctx.font = `bold ${Math.max(11,13*SCALE)}px sans-serif`;
      ctx.fillText(`${item.cost.toLocaleString()}g`, W/2 + 185, y + 26);

      if (allies.length > 0) {
        ctx.fillStyle = '#c87830';
        ctx.fillText(`(${allies.length} active)`, W/2 + 185, y + 40);
      }

      ctx.fillStyle = '#888'; ctx.textAlign = 'left'; ctx.font = `${Math.max(10,12*SCALE)}px sans-serif`; ctx.fillText(item.desc, W/2 - 180, y + 42);
    } else if (item.type === 'wolf' || item.type === 'wolfpack') {
      // Wolf items — silver/gray themed
      const canBuy = gold >= item.cost;
      const isWolfPack = item.type === 'wolfpack';
      const wolfColor = isWolfPack ? '#7a7aa0' : '#8a8a9a';

      ctx.fillStyle = isSelected ? 'rgba(130,130,160,0.15)' : 'rgba(40,40,50,0.5)';
      ctx.fillRect(W/2 - 200, y + 8, 400, itemH - 6);
      if (isSelected) { ctx.strokeStyle = wolfColor; ctx.lineWidth = 2; ctx.strokeRect(W/2 - 200, y + 8, 400, itemH - 6); }

      // Silver wolf indicator
      ctx.fillStyle = wolfColor;
      ctx.fillRect(W/2 - 195, y + 14, 4, itemH - 18);

      ctx.fillStyle = isSelected ? '#fff' : '#ccc';
      ctx.textAlign = 'left';
      ctx.font = `bold ${Math.max(13,15*SCALE)}px 'NorseBold', sans-serif`;
      ctx.fillText(item.name, W/2 - 180, y + 26);

      ctx.textAlign = 'right';
      ctx.fillStyle = canBuy ? BRAND.gold : '#666';
      ctx.font = `bold ${Math.max(11,13*SCALE)}px sans-serif`;
      ctx.fillText(`${item.cost.toLocaleString()}g`, W/2 + 185, y + 26);

      // Show current wolf count
      if (wolves.length > 0) {
        ctx.fillStyle = wolfColor;
        ctx.fillText(`(${wolves.length} wolves)`, W/2 + 185, y + 40);
      }

      ctx.fillStyle = '#888'; ctx.textAlign = 'left'; ctx.font = `${Math.max(10,12*SCALE)}px sans-serif`; ctx.fillText(item.desc, W/2 - 180, y + 42);
    }
  }

  // Controls hint
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.textAlign = 'center';
  ctx.font = `${Math.max(13,15*SCALE)}px sans-serif`;
  const hint = isTouchDevice ? 'TAP item to buy • TAP "CONTINUE" to proceed' : 'W/S to select • ENTER to buy • SPACE to continue';
  ctx.fillText(hint, W/2, H * 0.82);

  // Continue button
  const btnY = H * 0.87;
  ctx.fillStyle = 'rgba(26,107,124,0.6)';
  ctx.fillRect(W/2 - 80, btnY, 160, 40);
  ctx.strokeStyle = BRAND.tealLight;
  ctx.lineWidth = 2;
  ctx.strokeRect(W/2 - 80, btnY, 160, 40);
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.max(15,18*SCALE)}px 'NorseBold', sans-serif`;
  ctx.fillText('CONTINUE ➤', W/2, btnY + 27);
}

// Shop input
canvas.addEventListener('click', e => {
  if (gameState === STATE.SHOP) {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const startY = H * 0.21;
    const itemH = Math.min(55, (H * 0.6) / shopItems.length);

    // Check items
    for (let i = 0; i < shopItems.length; i++) {
      const y = startY + i * itemH;
      if (mx > W/2-200 && mx < W/2+200 && my > y && my < y+itemH) {
        shopSelection = i;
        buyShopItem();
        return;
      }
    }

    // Continue button
    const btnY = H * 0.87;
    if (mx > W/2-80 && mx < W/2+80 && my > btnY && my < btnY+40) {
      startNextLevel();
    }
  }
});

function buyShopItem() {
  const item = shopItems[shopSelection];
  if (item.type === 'upgrade') {
    if (gold >= item.cost && upgrades[item.key] < item.max) {
      gold -= item.cost;
      upgrades[item.key]++;
      playSound('gold');
    }
  } else if (item.type === 'weapon') {
    if (gold >= item.cost && !WEAPONS[item.weaponIdx].unlocked) {
      gold -= item.cost;
      WEAPONS[item.weaponIdx].unlocked = true;
      playSound('powerup');
    }
  } else if (item.type === 'ally') {
    if (gold >= item.cost) {
      gold -= item.cost;
      spawnAlly();
      playSound('powerup');
    }
  } else if (item.type === 'horde') {
    if (gold >= item.cost) {
      gold -= item.cost;
      for (let i = 0; i < 5; i++) spawnAlly();
      playSound('powerup');
      playSound('levelup');
    }
  } else if (item.type === 'wolf') {
    if (gold >= item.cost) {
      gold -= item.cost;
      spawnWolf();
      playSound('powerup');
    }
  } else if (item.type === 'wolfpack') {
    if (gold >= item.cost) {
      gold -= item.cost;
      for (let i = 0; i < 4; i++) spawnWolf();
      playSound('powerup');
      playSound('levelup');
    }
  }
}

function spawnAlly() {
  const allyHp = 120 + level * 20; // a bit more HP than the enemy boss chief
  allies.push({
    x: player ? player.x + 30 + Math.random()*40 - 20 : W/2 + 30,
    y: player ? player.y + 20 + Math.random()*20 : H*0.85,
    hp: allyHp,
    maxHp: allyHp,
    facing: 0,
    speed: 2.8,
    size: 16,
    damage: 30 + level * 3,
    attackRange: 45,
    attackCd: 0.8,
    attackTimer: 0,
    attackAnim: 0,
    hitFlash: 0,
    stagger: 0,
    target: null
  });
}

// Spawn a wolf — half the HP of a raider, 1/3 less damage, but faster!
function spawnWolf() {
  const wolfHp = 60 + level * 10; // half of raider HP
  wolves.push({
    x: player ? player.x + 20 + Math.random()*30 - 15 : W/2 + 20,
    y: player ? player.y + 15 + Math.random()*15 : H*0.85,
    hp: wolfHp,
    maxHp: wolfHp,
    facing: 0,
    speed: 3.8,         // faster than raiders (2.8)
    size: 12,            // smaller than raiders
    damage: 20 + level * 2, // 2/3 of raider damage
    attackRange: 30,     // short bite range
    attackCd: 0.55,      // faster bite cooldown
    attackTimer: 0,
    attackAnim: 0,
    hitFlash: 0,
    stagger: 0,
    biteAnim: 0          // jaw open/close animation timer
  });
}

function startNextLevel() {
  level++;
  generateLevel(level);
  landingTimer = 3;
  gameState = STATE.LANDING;
  playSound('levelup');
}

// ============================================================
// LEVEL TRANSITION
// ============================================================
function drawLevelTransition() {
  drawGame();
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = BRAND.gold;
  ctx.textAlign = 'center';
  ctx.font = `bold ${Math.max(30,40*SCALE)}px 'NorseBold', serif`;
  ctx.fillText('VILLAGE CONQUERED!', W/2, H*0.35);

  ctx.fillStyle = BRAND.cream;
  ctx.font = `${Math.max(18,24*SCALE)}px 'Norse', serif`;
  ctx.fillText(`Level ${level} Complete`, W/2, H*0.44);

  ctx.fillStyle = BRAND.gold;
  ctx.font = `bold ${Math.max(16,20*SCALE)}px 'Norse', sans-serif`;
  ctx.fillText(`+${levelGoldReward} Gold Pillaged`, W/2, H*0.53);
  ctx.fillText(`Score: ${score}`, W/2, H*0.60);
}

// ============================================================
// GAME OVER
// ============================================================
function drawGameOver(time) {
  drawGame();
  ctx.fillStyle = 'rgba(20,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = BRAND.red;
  ctx.textAlign = 'center';
  ctx.font = `bold ${Math.max(34,48*SCALE)}px 'NorseBold', serif`;
  ctx.fillText('FALLEN IN BATTLE', W/2, H*0.3);

  ctx.fillStyle = BRAND.cream;
  ctx.font = `${Math.max(18,22*SCALE)}px 'Norse', serif`;
  ctx.fillText(`Score: ${score}`, W/2, H*0.42);
  ctx.fillText(`Gold Pillaged: ${totalGold}`, W/2, H*0.49);
  ctx.fillText(`Level Reached: ${level}`, W/2, H*0.56);

  const pulse = 0.5 + Math.sin(time*3)*0.5;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#fff';
  ctx.font = `${Math.max(15,18*SCALE)}px sans-serif`;
  ctx.fillText(isTouchDevice ? 'TAP TO RAID AGAIN' : 'PRESS ENTER TO RAID AGAIN', W/2, H*0.70);
  ctx.globalAlpha = 1;

  // Leaderboard
  if (leaderboard.length > 0) {
    ctx.fillStyle = BRAND.gold;
    ctx.font = `bold ${Math.max(14,16*SCALE)}px 'NorseBold', sans-serif`;
    ctx.fillText('HALL OF FAME', W/2, H*0.78);
    ctx.font = `${Math.max(12,14*SCALE)}px sans-serif`;
    const top5 = leaderboard.slice(0,5);
    for (let i = 0; i < top5.length; i++) {
      ctx.fillStyle = i===0 ? BRAND.gold : 'rgba(255,255,255,0.6)';
      ctx.fillText(`${i+1}. ${top5[i].name} — ${top5[i].score}`, W/2, H*0.82 + i*Math.max(16,18*SCALE));
    }
  }
}

// ============================================================
// LEADERBOARD
// ============================================================
function saveToLeaderboard() {
  const existing = leaderboard.find(e => e.name.toLowerCase() === playerName.toLowerCase());
  if (existing) {
    if (score > existing.score) { existing.score = score; existing.level = level; }
  } else {
    leaderboard.push({ name:playerName, score, level });
  }
  leaderboard.sort((a,b) => b.score - a.score);
  if (leaderboard.length > 10) leaderboard.length = 10;
  localStorage.setItem('lrLeaderboard', JSON.stringify(leaderboard));
  highScore = leaderboard.length > 0 ? leaderboard[0].score : 0;
}

// ============================================================
// GLOBAL INPUT
// ============================================================
function startGame() {
  initAudio();
  if (gameState === STATE.SPLASH) {
    gameState = STATE.NAME_ENTRY;
    playerName = '';
  }
}

window.addEventListener('keydown', e => {
  if (gameState === STATE.SPLASH && e.code === 'Enter') {
    startGame();
  } else if (gameState === STATE.NAME_ENTRY) {
    if (e.code === 'Enter') {
      handleNameSubmit();
    } else if (e.code === 'Backspace') {
      playerName = playerName.slice(0, -1);
      nameError = '';
    } else if (e.key.length === 1 && playerName.length < 12) {
      playerName += e.key;
      nameError = '';
    }
  } else if (gameState === STATE.GAME_OVER && e.code === 'Enter') {
    gameState = STATE.SPLASH;
  } else if (gameState === STATE.SHOP) {
    if (e.code === 'KeyW' || e.code === 'ArrowUp') shopSelection = (shopSelection - 1 + shopItems.length) % shopItems.length;
    if (e.code === 'KeyS' || e.code === 'ArrowDown') shopSelection = (shopSelection + 1) % shopItems.length;
    if (e.code === 'Enter') buyShopItem();
    if (e.code === 'Space') startNextLevel();
  }
});

// Start the actual game from NAME_ENTRY — used by both keyboard Enter and touch prompt
function handleNameSubmit() {
  if (playerName.length < 2) return;
  score = 0; gold = 0; totalGold = 0; level = 1;
  upgrades = { damage:0, armor:0, speed:0, maxHp:0 };
  for (let i = 0; i < WEAPONS.length; i++) WEAPONS[i].unlocked = i < 4;
  currentWeapon = 0;
  allies = [];
  wolves = [];
  generateLevel(1);
  landingTimer = 3;
  gameState = STATE.LANDING;
}

// Touch: splash start, name entry prompt, game over restart
canvas.addEventListener('touchstart', e => {
  initAudio();
  if (gameState === STATE.SPLASH) {
    startGame();
  } else if (gameState === STATE.NAME_ENTRY) {
    // On mobile, the on-screen keyboard won't appear for canvas — use browser prompt instead
    const name = prompt('Enter your Viking name:');
    if (name && name.trim().length >= 2) {
      playerName = name.trim().slice(0, 12);
      handleNameSubmit();
    }
  } else if (gameState === STATE.GAME_OVER) {
    gameState = STATE.SPLASH;
  }
});

// ============================================================
// MAIN LOOP
// ============================================================
let lastTime = 0;
function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  ctx.clearRect(0, 0, W, H);

  switch(gameState) {
    case STATE.SPLASH: drawSplash(timestamp/1000); break;
    case STATE.NAME_ENTRY: drawNameEntry(timestamp/1000); break;
    case STATE.LANDING: update(dt); drawLanding(); break;
    case STATE.PLAYING: update(dt); drawGame(); break;
    case STATE.LEVEL_TRANSITION: update(dt); drawLevelTransition(); break;
    case STATE.SHOP: drawShop(); break;
    case STATE.GAME_OVER: drawGameOver(timestamp/1000); break;
  }

  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

</script>
