<title>Surf Vikings: Land Raid</title>
<style>
@font-face { font-family: 'Norse'; src: url('Norse.otf') format('opentype'); }

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a0e; font-family: 'Segoe UI', sans-serif; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

#weaponBtn { right: 140px; bottom: 55px; width: 65px; height: 65px; background: rgba(200,170,50,0.25); border: 2px solid rgba(200,170,50,0.45); display: flex; align-items: center; justify-content: center; font-size: 11px; color: rgba(255,255,255,0.6); font-weight: bold; }

  let next = currentWeapon;

    if (WEAPONS[idx].unlocked) { next = idx; break; }

  currentWeapon = next;
  playSound('shop');
}

// ============================================================
// LEVEL GENERATION
// ============================================================
function generateLevel(lvl) {
  enemies=[]; projectiles=[]; particles=[]; bloodPools=[]; powerups=[]; buildings=[]; trees=[]; goldPickups=[]; healthPickups=[]; catapults=[];
  enemiesKilled=0; spawnTimer=0; bossSpawned=false; insideVillage=false; villagePillaged=false;
  // Reposition surviving allies and wolves near player spawn
  for (let a of allies) { a.x = W/2 + (allies.indexOf(a))*30 - 15; a.y = H*0.85 + 25; }
  for (let w of wolves) { w.x = W/2 + (wolves.indexOf(w))*20 - 10; w.y = H*0.85 + 40; }

  // Village center and walls
  const villageCenterX = W / 2;
  villageCenterY = H * 0.25;
  const villageWidth = 240 + lvl * 20;
  const villageHeight = 200 + lvl * 15;

  villageWall = {
    x: villageCenterX - villageWidth/2,
    y: villageCenterY - villageHeight/2,
    w: villageWidth,
    h: villageHeight
  };

  // Gate on south side
  villageGate = {
    x: villageCenterX - 35,
    y: villageCenterY + villageHeight/2 - 20,
    w: 70,
    h: 20,
    hp: 80 + lvl * 40,
    maxHp: 80 + lvl * 40,
    broken: false
  };

  levelGoldReward = 100 + lvl * 50;

  // Buildings in a circle around the village center
  const numBuildings = 6 + Math.min(lvl, 2);
  const circleRadius = 70 + lvl * 5;
  for (let i = 0; i < numBuildings; i++) {
    const angle = (i / numBuildings) * Math.PI * 2;
    const bx = villageCenterX + Math.cos(angle) * circleRadius;
    const by = villageCenterY + Math.sin(angle) * circleRadius;
    buildings.push({ x:bx, y:by, w:40+Math.random()*20, h:35+Math.random()*15, hp:50+lvl*10, maxHp:50+lvl*10, type:Math.floor(Math.random()*3) });
  }

  // Trees scattered outside the village
  for (let i = 0; i < 25 + lvl * 3; i++) {
    let tx, ty;
    do {
      tx = Math.random() * W;
      ty = Math.random() * H;
    } while (tx > villageWall.x - 100 && tx < villageWall.x + villageWall.w + 100 &&
             ty > villageWall.y - 100 && ty < villageWall.y + villageWall.h + 100);
    trees.push({ x:tx, y:ty, size:8+Math.random()*12, type:Math.floor(Math.random()*3) });
  }

  // Catapult defenses on walls for level 5+
  if (lvl >= 5) {
    const numCatapults = Math.min(2 + Math.floor((lvl - 5) / 2), 6); // 2 at level 5, up to 6
    const wallX = villageWall.x, wallY = villageWall.y;
    const wallW = villageWall.w, wallH = villageWall.h;
    // Place catapults evenly along top, left, and right walls (not south — that's the gate)
    const positions = [];
    // Top wall
    for (let i = 0; i < Math.ceil(numCatapults / 3); i++) {
      positions.push({ x: wallX + wallW * (0.25 + i * 0.5), y: wallY + 10 });
    }
    // Left wall
    for (let i = 0; i < Math.ceil(numCatapults / 3); i++) {
      positions.push({ x: wallX + 10, y: wallY + wallH * (0.3 + i * 0.4) });
    }
    // Right wall
    for (let i = 0; i < Math.ceil(numCatapults / 3); i++) {
      positions.push({ x: wallX + wallW - 10, y: wallY + wallH * (0.3 + i * 0.4) });
    }
    for (let i = 0; i < numCatapults && i < positions.length; i++) {
      catapults.push({
        x: positions[i].x,
        y: positions[i].y,
        hp: 40 + lvl * 5,
        maxHp: 40 + lvl * 5,
        fireTimer: 2 + Math.random() * 2, // stagger initial shots
        fireCd: 2.5 - Math.min(lvl * 0.1, 1), // fire faster at higher levels
        range: 300 + lvl * 10,
        damage: 8 + lvl,
        size: 18,
        hitFlash: 0
      });
    }
  }

  spawnTimer = 2;
  player = createPlayer();
}


function spawnEnemy(forceType) {
  const types = ['warrior','warrior','warrior','fast','armored'];
  if (level >= 2) types.push('archer','archer');
  if (level >= 4) types.push('armored','armored');

  let type = forceType || types[Math.floor(Math.random()*types.length)];

  // Spawn from edges
  let ex, ey;
  const side = Math.floor(Math.random()*4);
  if (side===0) { ex=Math.random()*W; ey=-30; }
  else if (side===1) { ex=W+30; ey=Math.random()*H; }
  else if (side===2) { ex=Math.random()*W; ey=H+30; }
  else { ex=-30; ey=Math.random()*H; }

  let hp, speed, damage, size, color, attackRange, attackCd;
  switch(type) {
    case 'warrior': hp=20+level*4; speed=0.7+level*0.04; damage=5+level*0.5; size=14; color='#5a3a22'; attackRange=30; attackCd=1.2; break;
    case 'fast': hp=14+level*3; speed=1.1+level*0.05; damage=4+level*0.5; size=12; color='#3a4a20'; attackRange=25; attackCd=1.0; break;
    case 'armored': hp=45+level*8; speed=0.45+level*0.025; damage=8+level; size=17; color='#3a3a3a'; attackRange=35; attackCd=1.5; break;
    case 'archer': hp=16+level*3; speed=0.6+level*0.03; damage=6+level*0.5; size=13; color='#4a3020'; attackRange=200; attackCd=2.0; break;
    case 'chief': hp=100+level*20; speed=0.5+level*0.025; damage=12+level*1.5; size=24; color='#5a1010'; attackRange=40; attackCd=1.0; bossAlive=true; break;
  }

  enemies.push({ x:ex, y:ey, hp, maxHp:hp, speed, damage, size, color, type, attackRange, attackCd, attackTimer:0, facing:0, hitFlash:0, stagger:0 });
}

function drawViking(x, y, size, facing, attackAnim, shielded) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(facing + Math.PI/2);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(0, size*0.5, size*0.9, size*0.35, 0, 0, Math.PI*2);
  ctx.fill();

  // Legs (visible from top-down)
  const legOffset = player.moving ? Math.sin(gameTime*12)*3 : 0;
  ctx.fillStyle = '#4a3520';
  ctx.fillRect(-size*0.35, size*0.2+legOffset, size*0.25, size*0.5);
  ctx.fillRect(size*0.1, size*0.2-legOffset, size*0.25, size*0.5);
  // Boots
  ctx.fillStyle = '#2a1a0a';
  ctx.fillRect(-size*0.38, size*0.6+legOffset, size*0.31, size*0.15);
  ctx.fillRect(size*0.07, size*0.6-legOffset, size*0.31, size*0.15);

  // Torso / chainmail
  const torsoGrad = ctx.createRadialGradient(0, 0, size*0.1, 0, 0, size);
  torsoGrad.addColorStop(0, '#6a6a72');
  torsoGrad.addColorStop(0.5, '#505058');
  torsoGrad.addColorStop(1, '#38383e');
  ctx.fillStyle = torsoGrad;
  ctx.beginPath();
  ctx.ellipse(0, 0, size*0.8, size*0.65, 0, 0, Math.PI*2);
  ctx.fill();
  // Chainmail texture lines
  ctx.strokeStyle = 'rgba(120,120,130,0.3)';
  ctx.lineWidth = 0.5;
  for (let i = -3; i <= 3; i++) {
    ctx.beginPath();
    ctx.moveTo(-size*0.6, i*size*0.15);
    ctx.lineTo(size*0.6, i*size*0.15);
    ctx.stroke();
  }

  // Belt
  ctx.fillStyle = '#5a3a1a';
  ctx.fillRect(-size*0.7, -size*0.05, size*1.4, size*0.12);
  ctx.fillStyle = '#b8960a';
  ctx.fillRect(-size*0.08, -size*0.07, size*0.16, size*0.16);

  // Cape / cloak flowing behind
  ctx.fillStyle = 'rgba(100,20,20,0.6)';
  ctx.beginPath();
  ctx.moveTo(-size*0.5, size*0.1);
  ctx.quadraticCurveTo(-size*0.3, size*1.2 + Math.sin(gameTime*3)*3, size*0.3, size*1.2 + Math.sin(gameTime*3+1)*3);
  ctx.quadraticCurveTo(size*0.5, size*0.5, size*0.5, size*0.1);
  ctx.fill();

  // Shoulders (pauldrons)
  ctx.fillStyle = '#58585e';
  ctx.beginPath();
  ctx.ellipse(-size*0.65, -size*0.1, size*0.25, size*0.2, -0.2, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#3a3a3e';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(size*0.65, -size*0.1, size*0.25, size*0.2, 0.2, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();

  // Head
  const headGrad = ctx.createRadialGradient(0, -size*0.5, 1, 0, -size*0.5, size*0.45);
  headGrad.addColorStop(0, '#d4aa70');
  headGrad.addColorStop(1, '#a07848');
  ctx.fillStyle = headGrad;
  ctx.beginPath();
  ctx.arc(0, -size*0.5, size*0.4, 0, Math.PI*2);
  ctx.fill();

  // Helmet - iron with nose guard
  const helmGrad = ctx.createLinearGradient(-size*0.4, -size*0.9, size*0.4, -size*0.5);
  helmGrad.addColorStop(0, '#707078');
  helmGrad.addColorStop(0.5, '#909098');
  helmGrad.addColorStop(1, '#606068');
  ctx.fillStyle = helmGrad;
  ctx.beginPath();
  ctx.arc(0, -size*0.55, size*0.42, Math.PI, 0);
  ctx.fill();
  ctx.strokeStyle = '#3a3a40';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // Helmet rim
  ctx.fillStyle = '#505058';
  ctx.fillRect(-size*0.44, -size*0.56, size*0.88, size*0.08);
  // Nose guard
  ctx.fillStyle = '#606068';
  ctx.fillRect(-size*0.04, -size*0.7, size*0.08, size*0.35);

  // Horns - curved bone
  ctx.lineWidth = 3.5;
  const hornGrad = ctx.createLinearGradient(-size*1.2, -size*1.4, -size*0.4, -size*0.4);
  hornGrad.addColorStop(0, '#e8dcc0');
  hornGrad.addColorStop(1, '#a89870');
  ctx.strokeStyle = hornGrad;
  ctx.beginPath();
  ctx.moveTo(-size*0.4, -size*0.55);
  ctx.quadraticCurveTo(-size*1.0, -size*1.1, -size*0.6, -size*1.5);
  ctx.stroke();
  const hornGrad2 = ctx.createLinearGradient(size*1.2, -size*1.4, size*0.4, -size*0.4);
  hornGrad2.addColorStop(0, '#e8dcc0');
  hornGrad2.addColorStop(1, '#a89870');
  ctx.strokeStyle = hornGrad2;
  ctx.beginPath();
  ctx.moveTo(size*0.4, -size*0.55);
  ctx.quadraticCurveTo(size*1.0, -size*1.1, size*0.6, -size*1.5);
  ctx.stroke();

  // Beard
  ctx.fillStyle = '#6a4a1a';
  ctx.beginPath();
  ctx.moveTo(-size*0.25, -size*0.25);
  ctx.quadraticCurveTo(-size*0.3, -size*0.05, -size*0.15, size*0.05);
  ctx.quadraticCurveTo(0, size*0.15, size*0.15, size*0.05);
  ctx.quadraticCurveTo(size*0.3, -size*0.05, size*0.25, -size*0.25);
  ctx.fill();

  ctx.rotate(-(facing + Math.PI/2)); // undo rotation for weapon swing in world space

  // Attack animation - weapon swing
  if (attackAnim > 0) {
    const wep = WEAPONS[currentWeapon];
    const swingAngle = facing + (Math.PI/3) * Math.sin(attackAnim * Math.PI * 4);
    const handX = Math.cos(facing)*size*0.5;
    const handY = Math.sin(facing)*size*0.5;
    const wx = Math.cos(swingAngle) * (size + wep.range * 0.65);
    const wy = Math.sin(swingAngle) * (size + wep.range * 0.65);

    if (currentWeapon === 0) {
      // Sword - blade with fuller
      ctx.strokeStyle = '#d0d0d8';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(handX, handY); ctx.lineTo(wx, wy); ctx.stroke();
      ctx.strokeStyle = 'rgba(180,180,200,0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(handX, handY); ctx.lineTo(wx, wy); ctx.stroke();
      // Cross guard
      const mx = (handX+wx)*0.3, my = (handY+wy)*0.3;
      const perpX = Math.cos(swingAngle+Math.PI/2)*6, perpY = Math.sin(swingAngle+Math.PI/2)*6;
      ctx.strokeStyle = '#8a7a30';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(mx-perpX, my-perpY); ctx.lineTo(mx+perpX, my+perpY); ctx.stroke();
    } else if (currentWeapon === 1) {
      // Axe - wooden handle + metal head
      ctx.strokeStyle = '#6a4a28';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(handX, handY); ctx.lineTo(wx, wy); ctx.stroke();
      // Axe blade
      const bladeAngle = swingAngle + Math.PI/2;
      ctx.fillStyle = '#808088';
      ctx.beginPath();
      ctx.moveTo(wx, wy);
      ctx.lineTo(wx + Math.cos(bladeAngle)*10, wy + Math.sin(bladeAngle)*10);
      ctx.quadraticCurveTo(wx + Math.cos(swingAngle)*8, wy + Math.sin(swingAngle)*8, wx - Math.cos(bladeAngle)*10, wy - Math.sin(bladeAngle)*10);
      ctx.fill();
      ctx.strokeStyle = '#505058';
      ctx.lineWidth = 1;
      ctx.stroke();
    } else if (currentWeapon === 2) {
      // Spear - long shaft with metal tip
      ctx.strokeStyle = '#7a5a30';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(handX, handY); ctx.lineTo(wx, wy); ctx.stroke();
      // Spear tip
      const tipLen = 12;
      ctx.fillStyle = '#a0a0a8';
      ctx.beginPath();
      ctx.moveTo(wx, wy);
      ctx.lineTo(wx + Math.cos(swingAngle-0.3)*tipLen, wy + Math.sin(swingAngle-0.3)*tipLen);
      ctx.lineTo(wx + Math.cos(swingAngle)*tipLen*1.5, wy + Math.sin(swingAngle)*tipLen*1.5);
      ctx.lineTo(wx + Math.cos(swingAngle+0.3)*tipLen, wy + Math.sin(swingAngle+0.3)*tipLen);
      ctx.fill();
    }
    // Swing trail
    ctx.strokeStyle = 'rgba(200,200,220,0.15)';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.arc(0, 0, size + wep.range*0.5, swingAngle-0.4, swingAngle+0.4);
    ctx.stroke();
  } else {
    // Idle weapon held
    const wep = WEAPONS[currentWeapon];
    const idleAngle = facing - 0.3;
    const ih = Math.cos(idleAngle)*size*1.2, iv = Math.sin(idleAngle)*size*1.2;
    ctx.strokeStyle = currentWeapon === 2 ? '#7a5a30' : currentWeapon === 1 ? '#6a4a28' : '#a0a0a8';
    ctx.lineWidth = currentWeapon === 1 ? 3 : 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(facing)*size*0.3, Math.sin(facing)*size*0.3);
    ctx.lineTo(ih, iv);
    ctx.stroke();
  }

  // Shield aura
  if (shielded) {
    ctx.strokeStyle = 'rgba(180,150,40,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, size + 10 + Math.sin(gameTime*4)*2, 0, Math.PI*2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(180,150,40,0.15)';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.arc(0, 0, size + 15 + Math.sin(gameTime*4)*2, 0, Math.PI*2);
    ctx.stroke();
  }

  ctx.restore();
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  const rot = e.facing + Math.PI/2;
  const s = e.size;
  // Walking animation for all enemies
  const walkCycle = Math.sin(gameTime * 8 + e.x * 0.3 + e.y * 0.2);
  const legSwing = e.stagger > 0 ? 0 : walkCycle * 2.5;

  ctx.rotate(rot);

  // ---- SHADOW ----
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.ellipse(0, s*0.55, s*0.85, s*0.3, 0, 0, Math.PI*2);
  ctx.fill();

  // Hit flash tint
  const flash = e.hitFlash > 0;

  // ================================================================
  // CHIEF — Tribal warlord, scarred and massive
  // ================================================================
  if (e.type === 'chief') {
    // Legs — thick, fur-wrapped
    ctx.fillStyle = flash ? '#ccc' : '#3a2818';
    ctx.fillRect(-s*0.35, s*0.1+legSwing, s*0.28, s*0.55);
    ctx.fillRect(s*0.08, s*0.1-legSwing, s*0.28, s*0.55);
    // Fur wrappings on legs
    ctx.strokeStyle = '#6a5a3a';
    ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
      const ly = s*0.2 + i*s*0.14;
      ctx.beginPath(); ctx.moveTo(-s*0.37, ly+legSwing); ctx.lineTo(-s*0.05, ly+legSwing+2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s*0.06, ly-legSwing); ctx.lineTo(s*0.38, ly-legSwing+2); ctx.stroke();
    }
    // Heavy boots
    ctx.fillStyle = '#1a0e06';
    ctx.fillRect(-s*0.4, s*0.55+legSwing, s*0.35, s*0.14);
    ctx.fillRect(s*0.05, s*0.55-legSwing, s*0.35, s*0.14);

    // Fur cloak trailing behind
    ctx.fillStyle = flash ? '#bbb' : '#3a1208';
    ctx.beginPath();
    ctx.moveTo(-s*0.7, s*0.05);
    ctx.quadraticCurveTo(-s*0.5, s*1.3+Math.sin(gameTime*2.5)*2, 0, s*1.4+Math.sin(gameTime*2.5+0.5)*2);
    ctx.quadraticCurveTo(s*0.5, s*1.3+Math.sin(gameTime*2.5+1)*2, s*0.7, s*0.05);
    ctx.fill();
    // Fur trim edge
    ctx.fillStyle = '#7a6a4a';
    ctx.beginPath();
    ctx.moveTo(-s*0.72, s*0.03);
    ctx.quadraticCurveTo(-s*0.4, s*0.15, 0, s*0.12);
    ctx.quadraticCurveTo(s*0.4, s*0.15, s*0.72, s*0.03);
    ctx.lineTo(s*0.68, s*0.12);
    ctx.quadraticCurveTo(0, s*0.22, -s*0.68, s*0.12);
    ctx.fill();

    // Torso — large, battle-worn leather over chainmail
    const chiefBody = ctx.createRadialGradient(0, -s*0.05, s*0.1, 0, -s*0.05, s*0.8);
    chiefBody.addColorStop(0, flash ? '#ddd' : '#5a3a22');
    chiefBody.addColorStop(0.7, flash ? '#bbb' : '#3a2212');
    chiefBody.addColorStop(1, flash ? '#999' : '#2a180a');
    ctx.fillStyle = chiefBody;
    ctx.beginPath();
    ctx.ellipse(0, -s*0.05, s*0.75, s*0.6, 0, 0, Math.PI*2);
    ctx.fill();
    // Chainmail visible beneath
    ctx.strokeStyle = 'rgba(100,100,110,0.25)';
    ctx.lineWidth = 0.5;
    for (let i = -3; i <= 3; i++) {
      ctx.beginPath(); ctx.moveTo(-s*0.5, i*s*0.1-s*0.05); ctx.lineTo(s*0.5, i*s*0.1-s*0.05); ctx.stroke();
    }
    // Chest scars (battle-worn)
    ctx.strokeStyle = 'rgba(160,100,80,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-s*0.2, -s*0.25); ctx.lineTo(s*0.15, s*0.1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s*0.1, -s*0.3); ctx.lineTo(s*0.3, -s*0.05); ctx.stroke();

    // Shoulder guards — bone/metal
    const shGrad = ctx.createRadialGradient(-s*0.7, -s*0.15, 1, -s*0.7, -s*0.15, s*0.3);
    shGrad.addColorStop(0, '#807868');
    shGrad.addColorStop(1, '#504838');
    ctx.fillStyle = shGrad;
    ctx.beginPath(); ctx.ellipse(-s*0.7, -s*0.15, s*0.28, s*0.22, -0.2, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#30281e'; ctx.lineWidth = 1; ctx.stroke();
    // Bone spike on shoulder
    ctx.fillStyle = '#c8c0a0';
    ctx.beginPath(); ctx.moveTo(-s*0.85, -s*0.25); ctx.lineTo(-s*0.95, -s*0.55); ctx.lineTo(-s*0.75, -s*0.3); ctx.fill();
    // Right shoulder
    const shGrad2 = ctx.createRadialGradient(s*0.7, -s*0.15, 1, s*0.7, -s*0.15, s*0.3);
    shGrad2.addColorStop(0, '#807868');
    shGrad2.addColorStop(1, '#504838');
    ctx.fillStyle = shGrad2;
    ctx.beginPath(); ctx.ellipse(s*0.7, -s*0.15, s*0.28, s*0.22, 0.2, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#30281e'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#c8c0a0';
    ctx.beginPath(); ctx.moveTo(s*0.85, -s*0.25); ctx.lineTo(s*0.95, -s*0.55); ctx.lineTo(s*0.75, -s*0.3); ctx.fill();

    // Belt with skulls
    ctx.fillStyle = '#4a2a10';
    ctx.fillRect(-s*0.65, s*0.0, s*1.3, s*0.12);
    ctx.fillStyle = '#a09060';
    ctx.fillRect(-s*0.1, -s*0.02, s*0.2, s*0.16); // buckle
    // Mini skull on belt
    ctx.fillStyle = '#d0c8b0';
    ctx.beginPath(); ctx.arc(-s*0.35, s*0.06, s*0.06, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-s*0.37, s*0.04, s*0.02, s*0.02);
    ctx.fillRect(-s*0.34, s*0.04, s*0.02, s*0.02);

    // Head — scarred, grizzled
    const headGrad = ctx.createRadialGradient(0, -s*0.55, 1, 0, -s*0.55, s*0.4);
    headGrad.addColorStop(0, flash ? '#eee' : '#c49868');
    headGrad.addColorStop(1, flash ? '#ccc' : '#8a6840');
    ctx.fillStyle = headGrad;
    ctx.beginPath(); ctx.arc(0, -s*0.55, s*0.4, 0, Math.PI*2); ctx.fill();
    // Facial scar
    ctx.strokeStyle = 'rgba(160,80,70,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-s*0.15, -s*0.75); ctx.lineTo(s*0.05, -s*0.4); ctx.stroke();
    // Thick beard
    ctx.fillStyle = flash ? '#aaa' : '#3a2a18';
    ctx.beginPath();
    ctx.moveTo(-s*0.3, -s*0.38);
    ctx.quadraticCurveTo(-s*0.35, -s*0.15, -s*0.2, -s*0.05);
    ctx.quadraticCurveTo(0, s*0.05, s*0.2, -s*0.05);
    ctx.quadraticCurveTo(s*0.35, -s*0.15, s*0.3, -s*0.38);
    ctx.fill();
    // Braided beard detail
    ctx.strokeStyle = 'rgba(50,35,20,0.4)';
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(-s*0.08, -s*0.25); ctx.lineTo(-s*0.1, -s*0.05); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s*0.08, -s*0.25); ctx.lineTo(s*0.1, -s*0.05); ctx.stroke();
    // Eyes — fierce
    ctx.fillStyle = '#e8e0c0';
    ctx.beginPath(); ctx.ellipse(-s*0.12, -s*0.6, s*0.08, s*0.05, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s*0.12, -s*0.6, s*0.08, s*0.05, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2a1508';
    ctx.beginPath(); ctx.arc(-s*0.12, -s*0.6, s*0.04, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.12, -s*0.6, s*0.04, 0, Math.PI*2); ctx.fill();

    // Iron war crown with antler
    const crownGrad = ctx.createLinearGradient(-s*0.35, -s*0.95, s*0.35, -s*0.65);
    crownGrad.addColorStop(0, '#484048');
    crownGrad.addColorStop(0.5, '#686068');
    crownGrad.addColorStop(1, '#484048');
    ctx.fillStyle = crownGrad;
    ctx.beginPath();
    ctx.moveTo(-s*0.38, -s*0.65);
    ctx.lineTo(-s*0.28, -s*1.05);
    ctx.lineTo(-s*0.12, -s*0.78);
    ctx.lineTo(0, -s*1.12);
    ctx.lineTo(s*0.12, -s*0.78);
    ctx.lineTo(s*0.28, -s*1.05);
    ctx.lineTo(s*0.38, -s*0.65);
    ctx.fill();
    ctx.strokeStyle = '#282028';
    ctx.lineWidth = 1;
    ctx.stroke();
    // Antler on crown
    ctx.strokeStyle = '#b0a880';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -s*1.1); ctx.quadraticCurveTo(-s*0.2, -s*1.5, -s*0.1, -s*1.6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -s*1.1); ctx.quadraticCurveTo(s*0.2, -s*1.5, s*0.1, -s*1.6); ctx.stroke();
    // Crown jewel
    ctx.fillStyle = '#901818';
    ctx.beginPath(); ctx.arc(0, -s*0.92, s*0.05, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(200,50,50,0.3)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, -s*0.92, s*0.08, 0, Math.PI*2); ctx.stroke();

    // Weapon — great battle axe (world space)
    ctx.rotate(-rot);
    const wAngle = e.facing + Math.sin(gameTime*3)*0.15;
    const hx = Math.cos(wAngle), hy = Math.sin(wAngle);
    // Handle
    ctx.strokeStyle = '#5a3a18';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(hx*s*0.3, hy*s*0.3); ctx.lineTo(hx*s*2.2, hy*s*2.2); ctx.stroke();
    // Leather wrap on handle
    ctx.strokeStyle = '#7a5a28';
    ctx.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
      const wd = s*0.5 + i*s*0.25;
      ctx.beginPath(); ctx.arc(hx*wd, hy*wd, s*0.08, wAngle-1, wAngle+1); ctx.stroke();
    }
    // Double axe blade
    const tipX = hx*s*2.1, tipY = hy*s*2.1;
    const perpA = wAngle + Math.PI/2;
    ctx.fillStyle = '#707078';
    ctx.beginPath();
    ctx.moveTo(tipX + Math.cos(perpA)*s*0.5, tipY + Math.sin(perpA)*s*0.5);
    ctx.quadraticCurveTo(tipX + hx*s*0.3, tipY + hy*s*0.3, tipX - Math.cos(perpA)*s*0.5, tipY - Math.sin(perpA)*s*0.5);
    ctx.quadraticCurveTo(tipX - hx*s*0.15, tipY - hy*s*0.15, tipX + Math.cos(perpA)*s*0.5, tipY + Math.sin(perpA)*s*0.5);
    ctx.fill();
    ctx.strokeStyle = '#404048'; ctx.lineWidth = 1; ctx.stroke();
    // Blade edge gleam
    ctx.strokeStyle = 'rgba(180,180,200,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(tipX, tipY, s*0.35, perpA-0.3, perpA+0.3);
    ctx.stroke();
    ctx.rotate(rot);

  // ================================================================
  // ARMORED — Heavy infantry with plate and round shield
  // ================================================================
  } else if (e.type === 'armored') {
    // Legs — armored greaves
    ctx.fillStyle = flash ? '#ccc' : '#484850';
    ctx.fillRect(-s*0.32, s*0.12+legSwing, s*0.24, s*0.48);
    ctx.fillRect(s*0.08, s*0.12-legSwing, s*0.24, s*0.48);
    // Greave highlights
    ctx.strokeStyle = 'rgba(120,120,130,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-s*0.2, s*0.15+legSwing); ctx.lineTo(-s*0.2, s*0.5+legSwing); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s*0.2, s*0.15-legSwing); ctx.lineTo(s*0.2, s*0.5-legSwing); ctx.stroke();
    // Heavy boots
    ctx.fillStyle = '#1a1a1e';
    ctx.fillRect(-s*0.36, s*0.5+legSwing, s*0.32, s*0.14);
    ctx.fillRect(s*0.05, s*0.5-legSwing, s*0.32, s*0.14);

    // Torso — layered plate over mail
    const plateGrad = ctx.createRadialGradient(0, 0, s*0.05, 0, 0, s*0.8);
    plateGrad.addColorStop(0, flash ? '#ddd' : '#606068');
    plateGrad.addColorStop(0.6, flash ? '#bbb' : '#484850');
    plateGrad.addColorStop(1, flash ? '#999' : '#303038');
    ctx.fillStyle = plateGrad;
    ctx.beginPath(); ctx.ellipse(0, 0, s*0.72, s*0.58, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#282830'; ctx.lineWidth = 1.5; ctx.stroke();
    // Plate segments
    ctx.strokeStyle = 'rgba(90,90,100,0.35)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-s*0.5, -s*0.2); ctx.lineTo(s*0.5, -s*0.2);
    ctx.moveTo(-s*0.45, s*0.05); ctx.lineTo(s*0.45, s*0.05);
    ctx.moveTo(-s*0.35, s*0.25); ctx.lineTo(s*0.35, s*0.25);
    ctx.moveTo(0, -s*0.4); ctx.lineTo(0, s*0.3);
    ctx.stroke();
    // Metal sheen highlight
    ctx.fillStyle = 'rgba(160,160,170,0.08)';
    ctx.beginPath(); ctx.ellipse(-s*0.15, -s*0.15, s*0.3, s*0.25, -0.3, 0, Math.PI*2); ctx.fill();

    // Shoulders — heavy pauldrons
    ctx.fillStyle = flash ? '#bbb' : '#555560';
    ctx.beginPath(); ctx.ellipse(-s*0.68, -s*0.1, s*0.26, s*0.2, -0.15, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#303038'; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(s*0.68, -s*0.1, s*0.26, s*0.2, 0.15, 0, Math.PI*2); ctx.fill();
    ctx.stroke();
    // Rivets on pauldrons
    ctx.fillStyle = '#808088';
    [-0.58,-0.68,-0.78].forEach(px => { ctx.beginPath(); ctx.arc(px*s, -s*0.1, 1.5, 0, Math.PI*2); ctx.fill(); });
    [0.58,0.68,0.78].forEach(px => { ctx.beginPath(); ctx.arc(px*s, -s*0.1, 1.5, 0, Math.PI*2); ctx.fill(); });

    // Round shield on left arm
    ctx.save();
    const shieldGrad = ctx.createRadialGradient(-s*0.7, s*0.05, s*0.02, -s*0.7, s*0.05, s*0.38);
    shieldGrad.addColorStop(0, '#8a7a50');
    shieldGrad.addColorStop(0.5, '#6a5a30');
    shieldGrad.addColorStop(1, '#4a3a1a');
    ctx.fillStyle = shieldGrad;
    ctx.beginPath(); ctx.arc(-s*0.7, s*0.05, s*0.38, 0, Math.PI*2); ctx.fill();
    // Shield iron rim
    ctx.strokeStyle = '#505058';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Shield boss (center dome)
    ctx.fillStyle = '#707078';
    ctx.beginPath(); ctx.arc(-s*0.7, s*0.05, s*0.12, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#404048'; ctx.lineWidth = 1; ctx.stroke();
    // Shield cross pattern
    ctx.strokeStyle = 'rgba(90,80,50,0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-s*0.7, s*0.05-s*0.3); ctx.lineTo(-s*0.7, s*0.05+s*0.3);
    ctx.moveTo(-s*0.7-s*0.3, s*0.05); ctx.lineTo(-s*0.7+s*0.3, s*0.05);
    ctx.stroke();
    ctx.restore();

    // Head — full great helm
    const helmGrad = ctx.createLinearGradient(-s*0.3, -s*0.85, s*0.3, -s*0.45);
    helmGrad.addColorStop(0, flash ? '#ddd' : '#585860');
    helmGrad.addColorStop(0.4, flash ? '#eee' : '#707078');
    helmGrad.addColorStop(1, flash ? '#ccc' : '#484850');
    ctx.fillStyle = helmGrad;
    ctx.beginPath(); ctx.arc(0, -s*0.5, s*0.38, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#303038'; ctx.lineWidth = 1.5; ctx.stroke();
    // Helm face plate / T-visor
    ctx.fillStyle = '#1a1a20';
    ctx.fillRect(-s*0.04, -s*0.7, s*0.08, s*0.3); // nose guard
    ctx.fillRect(-s*0.22, -s*0.55, s*0.44, s*0.06); // eye slit
    // Helm rivet line
    ctx.fillStyle = '#606068';
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.arc(i*s*0.1, -s*0.72, 1.5, 0, Math.PI*2); ctx.fill();
    }

    // Weapon — mace (world space)
    ctx.rotate(-rot);
    const mAngle = e.facing;
    const mx = Math.cos(mAngle), my = Math.sin(mAngle);
    ctx.strokeStyle = '#5a4a28';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(mx*s*0.4, my*s*0.4); ctx.lineTo(mx*s*1.5, my*s*1.5); ctx.stroke();
    // Mace head
    ctx.fillStyle = '#606068';
    ctx.beginPath(); ctx.arc(mx*s*1.5, my*s*1.5, s*0.18, 0, Math.PI*2); ctx.fill();
    // Flanges on mace
    ctx.strokeStyle = '#404048'; ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      const fa = mAngle + i*Math.PI/2;
      ctx.beginPath();
      ctx.moveTo(mx*s*1.5, my*s*1.5);
      ctx.lineTo(mx*s*1.5+Math.cos(fa)*s*0.25, my*s*1.5+Math.sin(fa)*s*0.25);
      ctx.stroke();
    }
    ctx.rotate(rot);

  // ================================================================
  // ARCHER — Lean hunter, hooded, with longbow
  // ================================================================
  } else if (e.type === 'archer') {
    // Legs — lighter, wrapped leggings
    ctx.fillStyle = flash ? '#ccc' : '#3a3228';
    ctx.fillRect(-s*0.28, s*0.12+legSwing, s*0.2, s*0.45);
    ctx.fillRect(s*0.08, s*0.12-legSwing, s*0.2, s*0.45);
    // Leg wraps
    ctx.strokeStyle = '#5a4a30';
    ctx.lineWidth = 0.8;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(-s*0.3, s*0.2+i*s*0.12+legSwing); ctx.lineTo(-s*0.06, s*0.24+i*s*0.12+legSwing); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(s*0.06, s*0.2+i*s*0.12-legSwing); ctx.lineTo(s*0.3, s*0.24+i*s*0.12-legSwing); ctx.stroke();
    }
    // Soft boots
    ctx.fillStyle = '#2a1e12';
    ctx.fillRect(-s*0.3, s*0.48+legSwing, s*0.24, s*0.1);
    ctx.fillRect(s*0.06, s*0.48-legSwing, s*0.24, s*0.1);

    // Quiver on back
    ctx.fillStyle = '#5a3a18';
    ctx.fillRect(s*0.2, -s*0.3, s*0.12, s*0.6);
    ctx.strokeStyle = '#3a2208'; ctx.lineWidth = 0.8; ctx.strokeRect(s*0.2, -s*0.3, s*0.12, s*0.6);
    // Arrow feathers poking out
    ctx.fillStyle = '#c8c0a8';
    ctx.fillRect(s*0.22, -s*0.38, s*0.03, s*0.1);
    ctx.fillRect(s*0.27, -s*0.35, s*0.03, s*0.1);
    ctx.fillRect(s*0.24, -s*0.4, s*0.03, s*0.1);

    // Torso — leather jerkin
    const leatherGrad = ctx.createRadialGradient(0, 0, s*0.05, 0, 0, s*0.7);
    leatherGrad.addColorStop(0, flash ? '#ddd' : '#5a4830');
    leatherGrad.addColorStop(1, flash ? '#aaa' : '#3a2818');
    ctx.fillStyle = leatherGrad;
    ctx.beginPath(); ctx.ellipse(0, 0, s*0.6, s*0.48, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#2a1a0a'; ctx.lineWidth = 1; ctx.stroke();
    // Leather stitching
    ctx.strokeStyle = 'rgba(90,70,40,0.3)';
    ctx.lineWidth = 0.5;
    ctx.setLineDash([2, 3]);
    ctx.beginPath(); ctx.moveTo(0, -s*0.35); ctx.lineTo(0, s*0.3); ctx.stroke();
    ctx.setLineDash([]);
    // Belt with pouches
    ctx.fillStyle = '#4a3018';
    ctx.fillRect(-s*0.5, s*0.02, s*1.0, s*0.08);
    ctx.fillStyle = '#3a2210';
    ctx.fillRect(-s*0.35, -s*0.02, s*0.12, s*0.14); // pouch
    ctx.fillRect(s*0.2, -s*0.02, s*0.1, s*0.12); // pouch

    // Head — weathered face
    const archHeadGrad = ctx.createRadialGradient(0, -s*0.48, 1, 0, -s*0.48, s*0.32);
    archHeadGrad.addColorStop(0, flash ? '#eee' : '#b89060');
    archHeadGrad.addColorStop(1, flash ? '#ccc' : '#8a6840');
    ctx.fillStyle = archHeadGrad;
    ctx.beginPath(); ctx.arc(0, -s*0.48, s*0.3, 0, Math.PI*2); ctx.fill();
    // Stubble/short beard
    ctx.fillStyle = 'rgba(60,45,25,0.3)';
    ctx.beginPath();
    ctx.arc(0, -s*0.35, s*0.18, -0.5, Math.PI+0.5);
    ctx.fill();
    // Eyes — sharp, focused
    ctx.fillStyle = '#d8d0b0';
    ctx.beginPath(); ctx.ellipse(-s*0.1, -s*0.52, s*0.06, s*0.035, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s*0.1, -s*0.52, s*0.06, s*0.035, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2a2a10';
    ctx.beginPath(); ctx.arc(-s*0.1, -s*0.52, s*0.03, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.1, -s*0.52, s*0.03, 0, Math.PI*2); ctx.fill();

    // Hood — draped over head
    ctx.fillStyle = flash ? '#bbb' : '#3a4522';
    ctx.beginPath();
    ctx.arc(0, -s*0.52, s*0.34, Math.PI+0.2, -0.2);
    ctx.quadraticCurveTo(s*0.38, -s*0.3, s*0.25, -s*0.2);
    ctx.lineTo(-s*0.25, -s*0.2);
    ctx.quadraticCurveTo(-s*0.38, -s*0.3, -s*0.34, -s*0.52);
    ctx.fill();
    // Hood shadow
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.arc(0, -s*0.5, s*0.28, 0.3, Math.PI-0.3);
    ctx.fill();

    // Longbow + bowstring (world space)
    ctx.rotate(-rot);
    const bowAngle = e.facing;
    const bowPerp = bowAngle + Math.PI/2;
    const bcx = Math.cos(bowPerp)*s*0.4, bcy = Math.sin(bowPerp)*s*0.4;
    // Bow stave — curved wood
    ctx.strokeStyle = '#6a4a1a';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(bcx, bcy, s*0.8, bowAngle-0.55, bowAngle+0.55);
    ctx.stroke();
    // Bow tips
    ctx.fillStyle = '#8a6a2a';
    const bt1x = bcx+Math.cos(bowAngle-0.55)*s*0.8, bt1y = bcy+Math.sin(bowAngle-0.55)*s*0.8;
    const bt2x = bcx+Math.cos(bowAngle+0.55)*s*0.8, bt2y = bcy+Math.sin(bowAngle+0.55)*s*0.8;
    ctx.beginPath(); ctx.arc(bt1x, bt1y, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bt2x, bt2y, 2, 0, Math.PI*2); ctx.fill();
    // Bowstring
    ctx.strokeStyle = '#b0a890';
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(bt1x, bt1y); ctx.lineTo(bt2x, bt2y); ctx.stroke();
    ctx.rotate(rot);

  // ================================================================
  // FAST — Berserker scout, painted, feral
  // ================================================================
  } else if (e.type === 'fast') {
    // Legs — bare, muscular
    ctx.fillStyle = flash ? '#ccc' : '#9a7a58';
    ctx.fillRect(-s*0.26, s*0.1+legSwing*1.3, s*0.18, s*0.42);
    ctx.fillRect(s*0.08, s*0.1-legSwing*1.3, s*0.18, s*0.42);
    // Leg muscle definition
    ctx.strokeStyle = 'rgba(100,70,45,0.25)';
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(-s*0.17, s*0.15+legSwing*1.3); ctx.lineTo(-s*0.17, s*0.4+legSwing*1.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s*0.17, s*0.15-legSwing*1.3); ctx.lineTo(s*0.17, s*0.4-legSwing*1.3); ctx.stroke();
    // Fur-wrapped feet
    ctx.fillStyle = '#5a4020';
    ctx.fillRect(-s*0.28, s*0.42+legSwing*1.3, s*0.22, s*0.1);
    ctx.fillRect(s*0.06, s*0.42-legSwing*1.3, s*0.22, s*0.1);

    // Torso — bare chest with war paint and scars
    const skinGrad = ctx.createRadialGradient(0, 0, s*0.05, 0, 0, s*0.65);
    skinGrad.addColorStop(0, flash ? '#eee' : '#b89068');
    skinGrad.addColorStop(1, flash ? '#ccc' : '#8a6a48');
    ctx.fillStyle = skinGrad;
    ctx.beginPath(); ctx.ellipse(0, 0, s*0.58, s*0.46, 0, 0, Math.PI*2); ctx.fill();
    // Muscular definition
    ctx.strokeStyle = 'rgba(100,70,45,0.2)';
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(0, -s*0.3); ctx.lineTo(0, s*0.2); ctx.stroke();
    ctx.beginPath(); ctx.arc(-s*0.15, -s*0.1, s*0.15, -0.8, 0.8); ctx.stroke();
    ctx.beginPath(); ctx.arc(s*0.15, -s*0.1, s*0.15, Math.PI-0.8, Math.PI+0.8); ctx.stroke();
    // War paint — tribal patterns across chest
    ctx.strokeStyle = 'rgba(160,25,15,0.55)';
    ctx.lineWidth = 1.5;
    // Chevron pattern
    ctx.beginPath(); ctx.moveTo(-s*0.35, -s*0.15); ctx.lineTo(0, s*0.1); ctx.lineTo(s*0.35, -s*0.15); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s*0.3, -s*0.05); ctx.lineTo(0, s*0.18); ctx.lineTo(s*0.3, -s*0.05); ctx.stroke();
    // Spirals on shoulders
    ctx.strokeStyle = 'rgba(160,25,15,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(-s*0.35, -s*0.2, s*0.08, 0, Math.PI*1.5); ctx.stroke();
    ctx.beginPath(); ctx.arc(s*0.35, -s*0.2, s*0.08, Math.PI*0.5, Math.PI*2); ctx.stroke();
    // Scars
    ctx.strokeStyle = 'rgba(180,130,110,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-s*0.25, -s*0.3); ctx.lineTo(-s*0.05, s*0.05); ctx.stroke();

    // Fur loincloth/kilt
    ctx.fillStyle = '#5a4020';
    ctx.beginPath();
    ctx.moveTo(-s*0.4, s*0.05);
    ctx.lineTo(-s*0.35, s*0.25);
    ctx.lineTo(s*0.35, s*0.25);
    ctx.lineTo(s*0.4, s*0.05);
    ctx.fill();
    ctx.fillStyle = '#7a6040';
    ctx.fillRect(-s*0.15, s*0.05, s*0.3, s*0.18);

    // Head — wild-eyed, shaved sides
    const fastHeadGrad = ctx.createRadialGradient(0, -s*0.46, 1, 0, -s*0.46, s*0.3);
    fastHeadGrad.addColorStop(0, flash ? '#eee' : '#b89060');
    fastHeadGrad.addColorStop(1, flash ? '#ccc' : '#8a6a48');
    ctx.fillStyle = fastHeadGrad;
    ctx.beginPath(); ctx.arc(0, -s*0.46, s*0.3, 0, Math.PI*2); ctx.fill();
    // Mohawk / top-knot hair
    ctx.fillStyle = flash ? '#888' : '#2a1a0a';
    ctx.beginPath();
    ctx.moveTo(-s*0.06, -s*0.55);
    ctx.quadraticCurveTo(-s*0.08, -s*0.95, 0, -s*1.0);
    ctx.quadraticCurveTo(s*0.08, -s*0.95, s*0.06, -s*0.55);
    ctx.fill();
    // Face paint — heavy across eyes and cheeks
    ctx.fillStyle = 'rgba(20,20,20,0.5)';
    ctx.fillRect(-s*0.25, -s*0.55, s*0.5, s*0.08); // eye band
    ctx.fillStyle = 'rgba(140,20,10,0.5)';
    // Diagonal face stripes
    ctx.beginPath(); ctx.moveTo(-s*0.2, -s*0.45); ctx.lineTo(-s*0.28, -s*0.3); ctx.lineTo(-s*0.22, -s*0.3); ctx.lineTo(-s*0.14, -s*0.45); ctx.fill();
    ctx.beginPath(); ctx.moveTo(s*0.14, -s*0.45); ctx.lineTo(s*0.22, -s*0.3); ctx.lineTo(s*0.28, -s*0.3); ctx.lineTo(s*0.2, -s*0.45); ctx.fill();
    // Wild eyes — wide, crazed
    ctx.fillStyle = '#e8dcc0';
    ctx.beginPath(); ctx.ellipse(-s*0.1, -s*0.5, s*0.07, s*0.05, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s*0.1, -s*0.5, s*0.07, s*0.05, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2a1008';
    ctx.beginPath(); ctx.arc(-s*0.1, -s*0.5, s*0.03, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.1, -s*0.5, s*0.03, 0, Math.PI*2); ctx.fill();
    // Bared teeth / snarl
    ctx.fillStyle = '#d0c8a0';
    ctx.fillRect(-s*0.08, -s*0.36, s*0.16, s*0.04);

    // Dual hand axes (world space)
    ctx.rotate(-rot);
    const da1 = e.facing - 0.35 + Math.sin(gameTime*6)*0.1;
    const da2 = e.facing + 0.35 - Math.sin(gameTime*6)*0.1;
    // Left axe
    ctx.strokeStyle = '#5a3a18'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(da1)*s*1.2, Math.sin(da1)*s*1.2); ctx.stroke();
    ctx.fillStyle = '#707078';
    const ax1x = Math.cos(da1)*s*1.15, ax1y = Math.sin(da1)*s*1.15;
    ctx.beginPath();
    ctx.arc(ax1x, ax1y, s*0.12, da1-1.2, da1+1.2);
    ctx.fill();
    // Right axe
    ctx.strokeStyle = '#5a3a18';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(da2)*s*1.2, Math.sin(da2)*s*1.2); ctx.stroke();
    ctx.fillStyle = '#707078';
    const ax2x = Math.cos(da2)*s*1.15, ax2y = Math.sin(da2)*s*1.15;
    ctx.beginPath();
    ctx.arc(ax2x, ax2y, s*0.12, da2-1.2, da2+1.2);
    ctx.fill();
    ctx.rotate(rot);

  // ================================================================
  // WARRIOR — Common tribal fighter with tunic and sword
  // ================================================================
  } else {
    // Legs — cloth-wrapped
    ctx.fillStyle = flash ? '#ccc' : '#4a3a28';
    ctx.fillRect(-s*0.28, s*0.1+legSwing, s*0.2, s*0.44);
    ctx.fillRect(s*0.08, s*0.1-legSwing, s*0.2, s*0.44);
    // Cloth wraps
    ctx.strokeStyle = '#5a4830';
    ctx.lineWidth = 0.8;
    for (let i = 0; i < 2; i++) {
      const ly = s*0.22 + i*s*0.15;
      ctx.beginPath(); ctx.moveTo(-s*0.3, ly+legSwing); ctx.lineTo(-s*0.06, ly+2+legSwing); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s*0.06, ly-legSwing); ctx.lineTo(s*0.3, ly+2-legSwing); ctx.stroke();
    }
    // Simple leather shoes
    ctx.fillStyle = '#2a1a0e';
    ctx.fillRect(-s*0.3, s*0.45+legSwing, s*0.24, s*0.1);
    ctx.fillRect(s*0.06, s*0.45-legSwing, s*0.24, s*0.1);

    // Torso — rough-woven tunic over leather
    const tunicGrad = ctx.createRadialGradient(0, 0, s*0.05, 0, 0, s*0.7);
    tunicGrad.addColorStop(0, flash ? '#ddd' : '#6a5238');
    tunicGrad.addColorStop(1, flash ? '#aaa' : '#3a2a18');
    ctx.fillStyle = tunicGrad;
    ctx.beginPath(); ctx.ellipse(0, 0, s*0.65, s*0.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#2a1a0a'; ctx.lineWidth = 1; ctx.stroke();
    // Tunic weave texture
    ctx.strokeStyle = 'rgba(80,60,35,0.2)';
    ctx.lineWidth = 0.5;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.moveTo(-s*0.45, i*s*0.12); ctx.lineTo(s*0.45, i*s*0.12); ctx.stroke();
    }
    // Neckline
    ctx.strokeStyle = '#4a3a20';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-s*0.15, -s*0.35);
    ctx.quadraticCurveTo(0, -s*0.2, s*0.15, -s*0.35);
    ctx.stroke();
    // Belt
    ctx.fillStyle = '#3a2510';
    ctx.fillRect(-s*0.55, s*0.02, s*1.1, s*0.08);
    ctx.fillStyle = '#706030';
    ctx.fillRect(-s*0.06, 0, s*0.12, s*0.12); // buckle

    // Shoulders — slight padding
    ctx.fillStyle = flash ? '#bbb' : '#5a4228';
    ctx.beginPath(); ctx.ellipse(-s*0.58, -s*0.08, s*0.18, s*0.14, -0.15, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s*0.58, -s*0.08, s*0.18, s*0.14, 0.15, 0, Math.PI*2); ctx.fill();

    // Head — rough, bearded
    const warHeadGrad = ctx.createRadialGradient(0, -s*0.48, 1, 0, -s*0.48, s*0.3);
    warHeadGrad.addColorStop(0, flash ? '#eee' : '#c49868');
    warHeadGrad.addColorStop(1, flash ? '#ccc' : '#906840');
    ctx.fillStyle = warHeadGrad;
    ctx.beginPath(); ctx.arc(0, -s*0.48, s*0.3, 0, Math.PI*2); ctx.fill();
    // Unkempt hair
    ctx.fillStyle = flash ? '#999' : '#3a2a14';
    ctx.beginPath();
    ctx.arc(0, -s*0.52, s*0.28, Math.PI+0.3, -0.3);
    ctx.fill();
    // Some hair strands
    ctx.strokeStyle = '#3a2a14';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-s*0.2, -s*0.65); ctx.quadraticCurveTo(-s*0.3, -s*0.5, -s*0.25, -s*0.35); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s*0.2, -s*0.65); ctx.quadraticCurveTo(s*0.3, -s*0.5, s*0.25, -s*0.35); ctx.stroke();
    // Short rough beard
    ctx.fillStyle = flash ? '#999' : '#4a3a1a';
    ctx.beginPath();
    ctx.moveTo(-s*0.18, -s*0.35);
    ctx.quadraticCurveTo(-s*0.2, -s*0.2, -s*0.12, -s*0.15);
    ctx.quadraticCurveTo(0, -s*0.1, s*0.12, -s*0.15);
    ctx.quadraticCurveTo(s*0.2, -s*0.2, s*0.18, -s*0.35);
    ctx.fill();
    // Eyes
    ctx.fillStyle = '#d8d0b0';
    ctx.beginPath(); ctx.ellipse(-s*0.1, -s*0.52, s*0.06, s*0.04, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s*0.1, -s*0.52, s*0.06, s*0.04, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a1a08';
    ctx.beginPath(); ctx.arc(-s*0.1, -s*0.52, s*0.025, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.1, -s*0.52, s*0.025, 0, Math.PI*2); ctx.fill();
    // Leather cap / headband
    ctx.fillStyle = flash ? '#aaa' : '#4a3018';
    ctx.fillRect(-s*0.22, -s*0.62, s*0.44, s*0.08);

    // Weapon — short sword (world space)
    ctx.rotate(-rot);
    const wAngle = e.facing + Math.sin(gameTime*4+e.x)*0.08;
    const whx = Math.cos(wAngle), why = Math.sin(wAngle);
    // Handle
    ctx.strokeStyle = '#5a3a18';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(whx*s*0.3, why*s*0.3); ctx.lineTo(whx*s*0.6, why*s*0.6); ctx.stroke();
    // Blade
    ctx.strokeStyle = '#909098';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(whx*s*0.6, why*s*0.6); ctx.lineTo(whx*s*1.35, why*s*1.35); ctx.stroke();
    // Blade edge gleam
    ctx.strokeStyle = 'rgba(200,200,210,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(whx*s*0.7, why*s*0.7); ctx.lineTo(whx*s*1.3, why*s*1.3); ctx.stroke();
    // Cross guard
    const cgPerp = wAngle + Math.PI/2;
    ctx.strokeStyle = '#6a5a30';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(whx*s*0.58+Math.cos(cgPerp)*s*0.12, why*s*0.58+Math.sin(cgPerp)*s*0.12);
    ctx.lineTo(whx*s*0.58-Math.cos(cgPerp)*s*0.12, why*s*0.58-Math.sin(cgPerp)*s*0.12);
    ctx.stroke();
    ctx.rotate(rot);
  }

  ctx.rotate(-rot); // back to world space for HP bar

  // ---- HP BAR ----
  if (e.hp < e.maxHp) {
    const barW = s * 2.4;
    const barH = e.type === 'chief' ? 5 : 3.5;
    const barY = -s - (e.type === 'chief' ? 20 : 14);
    // Background
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(-barW/2 - 1, barY - 1, barW + 2, barH + 2);
    // Bar
    const hpRatio = e.hp / e.maxHp;
    const barColor = e.type === 'chief'
      ? (hpRatio > 0.5 ? '#b89020' : '#c86020')
      : (hpRatio > 0.5 ? '#6a4030' : '#aa2018');
    ctx.fillStyle = barColor;
    ctx.fillRect(-barW/2, barY, barW * hpRatio, barH);
    // Border
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(-barW/2 - 1, barY - 1, barW + 2, barH + 2);
  }

  ctx.restore();
}

// Color shade helper
function shadeColor(color, amt) {
  if (!color.startsWith('#') || color.length < 7) return color;
  let r = parseInt(color.substring(1,3),16) + amt;
  let g = parseInt(color.substring(3,5),16) + amt;
  let b = parseInt(color.substring(5,7),16) + amt;
  r = Math.max(0,Math.min(255,r));
  g = Math.max(0,Math.min(255,g));
  b = Math.max(0,Math.min(255,b));
  return `rgb(${r},${g},${b})`;
}

function drawBuilding(b) {
  ctx.save();

  // Building shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(b.x - b.w/2 + 4, b.y - b.h/2 + 4, b.w, b.h);

  // Wall - wooden planks gradient
  const wallGrad = ctx.createLinearGradient(b.x - b.w/2, b.y, b.x + b.w/2, b.y);
  wallGrad.addColorStop(0, '#7a5a20');
  wallGrad.addColorStop(0.3, '#8a6a2a');
  wallGrad.addColorStop(0.7, '#7a5a20');
  wallGrad.addColorStop(1, '#6a4a18');
  ctx.fillStyle = wallGrad;
  ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
  // Plank lines
  ctx.strokeStyle = 'rgba(60,35,10,0.3)';
  ctx.lineWidth = 0.5;
  for (let i = 1; i < 5; i++) {
    const px = b.x - b.w/2 + (b.w/5)*i;
    ctx.beginPath(); ctx.moveTo(px, b.y - b.h/2); ctx.lineTo(px, b.y + b.h/2); ctx.stroke();
  }
  ctx.strokeStyle = '#4a2a08';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);

  // Thatched roof
  const roofH = 22;
  const roofGrad = ctx.createLinearGradient(b.x, b.y - b.h/2 - roofH, b.x, b.y - b.h/2);
  roofGrad.addColorStop(0, '#6a4a20');
  roofGrad.addColorStop(1, '#5a3a15');
  ctx.fillStyle = roofGrad;
  ctx.beginPath();
  ctx.moveTo(b.x - b.w/2 - 8, b.y - b.h/2);
  ctx.lineTo(b.x, b.y - b.h/2 - roofH);
  ctx.lineTo(b.x + b.w/2 + 8, b.y - b.h/2);
  ctx.fill();
  ctx.strokeStyle = '#3a2008';
  ctx.lineWidth = 1;
  ctx.stroke();
  // Thatch texture lines
  ctx.strokeStyle = 'rgba(90,60,20,0.4)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < 4; i++) {
    const ty = b.y - b.h/2 - roofH*0.2 - i*4;
    ctx.beginPath();
    ctx.moveTo(b.x - b.w/3 - i*2, ty + i*5);
    ctx.lineTo(b.x + b.w/3 + i*2, ty + i*5);
    ctx.stroke();
  }

  // Door - dark arched entrance
  ctx.fillStyle = '#1a0a02';
  ctx.beginPath();
  ctx.moveTo(b.x - 6, b.y + b.h/2);
  ctx.lineTo(b.x - 6, b.y + 2);
  ctx.arc(b.x, b.y + 2, 6, Math.PI, 0);
  ctx.lineTo(b.x + 6, b.y + b.h/2);
  ctx.fill();

  // Damage cracks (deterministic, not random per frame)
  if (b.hp < b.maxHp) {
    const dmgRatio = 1 - b.hp / b.maxHp;
    if (dmgRatio > 0.2) {
      ctx.strokeStyle = '#2a1a08';
      ctx.lineWidth = 1;
      // Fixed crack positions based on building position
      const seed = Math.floor(b.x * 7 + b.y * 13);
      const numCracks = Math.floor(dmgRatio * 6);
      for (let i = 0; i < numCracks; i++) {
        const cx = b.x - b.w*0.3 + ((seed + i*37) % 100)/100 * b.w*0.6;
        const cy = b.y - b.h*0.3 + ((seed + i*53) % 100)/100 * b.h*0.6;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + ((seed+i)%7)-3, cy + ((seed+i*2)%9)-4);
        ctx.lineTo(cx + ((seed+i*3)%11)-5, cy + ((seed+i*4)%13)-6);
        ctx.stroke();
      }
    }
    if (dmgRatio > 0.6) {
      // Smoke wisps
      ctx.fillStyle = 'rgba(60,50,40,0.15)';
      ctx.beginPath();
      ctx.arc(b.x + Math.sin(gameTime*2)*5, b.y - b.h/2 - roofH - 10 - Math.sin(gameTime)*5, 8, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawTree(t) {
  ctx.save();
  ctx.translate(t.x, t.y);

  // Tree shadow
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.ellipse(t.size*0.3, t.size*0.2, t.size*0.8, t.size*0.3, 0.3, 0, Math.PI*2);
  ctx.fill();

  // Trunk with bark texture
  const trunkGrad = ctx.createLinearGradient(-4, 0, 4, 0);
  trunkGrad.addColorStop(0, '#3a2210');
  trunkGrad.addColorStop(0.5, '#5a3a1a');
  trunkGrad.addColorStop(1, '#3a2210');
  ctx.fillStyle = trunkGrad;
  ctx.fillRect(-3.5, -t.size*0.3, 7, t.size*0.9);
  // Bark lines
  ctx.strokeStyle = 'rgba(30,15,5,0.3)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(-1, -t.size*0.2); ctx.lineTo(-1.5, t.size*0.4);
  ctx.moveTo(1, -t.size*0.1); ctx.lineTo(1.5, t.size*0.3);
  ctx.stroke();

  if (t.type === 2) {
    // Pine/conifer
    const layers = 4;
    for (let i = layers-1; i >= 0; i--) {
      const ly = -t.size*0.3 - i*t.size*0.25;
      const lw = t.size*(0.7 - i*0.12);
      ctx.fillStyle = i%2===0 ? '#1a3a0e' : '#204a12';
      ctx.beginPath();
      ctx.moveTo(-lw, ly + t.size*0.15);
      ctx.lineTo(0, ly - t.size*0.1);
      ctx.lineTo(lw, ly + t.size*0.15);
      ctx.fill();
    }
  } else {
    // Deciduous - layered canopy
    const baseGreen = t.type === 0 ? [35,75,22] : [45,85,28];
    for (let i = 0; i < 3; i++) {
      const ox = (i-1)*t.size*0.25;
      const oy = -t.size*0.5 - i*t.size*0.12;
      const r = t.size*(0.55 - i*0.05);
      const shade = i * 8;
      ctx.fillStyle = `rgb(${baseGreen[0]-shade},${baseGreen[1]-shade},${baseGreen[2]-shade})`;
      ctx.beginPath();
      ctx.arc(ox, oy, r, 0, Math.PI*2);
      ctx.fill();
    }
    // Subtle highlight
    ctx.fillStyle = `rgba(${baseGreen[0]+20},${baseGreen[1]+20},${baseGreen[2]+10},0.3)`;
    ctx.beginPath();
    ctx.arc(-t.size*0.15, -t.size*0.7, t.size*0.25, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

// ============================================================
// TERRAIN
// ============================================================
function drawTerrain() {
  // Base grass - rich gradient
  const baseGrad = ctx.createLinearGradient(0, 0, 0, H*0.82);
  baseGrad.addColorStop(0, '#2a4a16');
  baseGrad.addColorStop(0.3, '#325218');
  baseGrad.addColorStop(0.6, '#2e4e18');
  baseGrad.addColorStop(1, '#3a5a1e');
  ctx.fillStyle = baseGrad;
  ctx.fillRect(0, 0, W, H);

  // Grass variation patches - subtle, natural
  for (let i = 0; i < 40; i++) {
    const gx = ((i * 137 + level * 53) % 100) / 100 * W;
    const gy = ((i * 89 + level * 31) % 100) / 100 * (H * 0.82);
    const shade = i % 3;
    ctx.fillStyle = shade === 0 ? 'rgba(60,90,30,0.15)' : shade === 1 ? 'rgba(40,65,18,0.12)' : 'rgba(50,80,25,0.1)';
    ctx.beginPath();
    ctx.ellipse(gx, gy, 25+i*2.5, 15+i*1.5, i*0.3, 0, Math.PI*2);
    ctx.fill();
  }

  // Scattered small rocks on grass
  for (let i = 0; i < 8; i++) {
    const rx = ((i * 197 + level * 71) % 100) / 100 * W;
    const ry = ((i * 127 + level * 43) % 80) / 100 * H * 0.75;
    ctx.fillStyle = 'rgba(90,85,75,0.25)';
    ctx.beginPath();
    ctx.ellipse(rx, ry, 4+i%3, 3+i%2, i*0.7, 0, Math.PI*2);
    ctx.fill();
  }

  // Beach at bottom - layered transition
  const beachY = H * 0.82;
  const beachGrad = ctx.createLinearGradient(0, beachY - 40, 0, H);
  beachGrad.addColorStop(0, '#3a5a1e');
  beachGrad.addColorStop(0.08, '#6a7a3a');
  beachGrad.addColorStop(0.15, '#b0a068');
  beachGrad.addColorStop(0.35, '#c2a86b');
  beachGrad.addColorStop(0.55, '#a89050');
  beachGrad.addColorStop(0.7, '#3a6878');
  beachGrad.addColorStop(0.85, '#1a5a7c');
  beachGrad.addColorStop(1, '#0e3a50');
  ctx.fillStyle = beachGrad;
  ctx.fillRect(0, beachY - 40, W, H - beachY + 40);

  // Sand speckle texture
  for (let i = 0; i < 30; i++) {
    const sx = ((i * 83 + level * 19) % 100) / 100 * W;
    const sy = beachY + ((i * 47 + level * 29) % 40);
    ctx.fillStyle = `rgba(180,160,100,${0.08 + (i%3)*0.03})`;
    ctx.beginPath();
    ctx.arc(sx, sy, 2 + i%3, 0, Math.PI*2);
    ctx.fill();
  }

  // Water - soft animated waves
  for (let i = 0; i < 6; i++) {
    const wy = H - 20 + i * 5;
    const waveAlpha = 0.06 + i * 0.04;
    ctx.fillStyle = `rgba(10,50,70,${waveAlpha})`;
    ctx.beginPath();
    ctx.moveTo(0, wy);
    for (let x = 0; x <= W; x += 20) {
      ctx.lineTo(x, wy + Math.sin(gameTime*1.2 + x*0.02 + i*0.8)*3);
    }
    ctx.lineTo(W, H); ctx.lineTo(0, H);
    ctx.fill();
  }
  // Wave foam
  ctx.strokeStyle = 'rgba(200,210,220,0.08)';
  ctx.lineWidth = 1.5;
  const foamY = H * 0.92;
  ctx.beginPath();
  ctx.moveTo(0, foamY);
  for (let x = 0; x <= W; x += 10) {
    ctx.lineTo(x, foamY + Math.sin(gameTime*1.5 + x*0.03)*2);
  }
  ctx.stroke();

  // Dirt path - worn and textured
  const pathGrad = ctx.createLinearGradient(W/2 - 25, 0, W/2 + 25, 0);
  pathGrad.addColorStop(0, 'rgba(75,55,30,0.7)');
  pathGrad.addColorStop(0.3, 'rgba(90,65,35,0.8)');
  pathGrad.addColorStop(0.7, 'rgba(90,65,35,0.8)');
  pathGrad.addColorStop(1, 'rgba(75,55,30,0.7)');
  ctx.fillStyle = pathGrad;
  ctx.beginPath();
  ctx.moveTo(W/2 - 28, H * 0.82);
  ctx.quadraticCurveTo(W/2 - 18, H * 0.5, W/2 + 8, villageCenterY + 80);
  ctx.lineTo(W/2 + 38, villageCenterY + 80);
  ctx.quadraticCurveTo(W/2 + 22, H * 0.5, W/2 + 28, H * 0.82);
  ctx.fill();
  // Path edge wear
  ctx.strokeStyle = 'rgba(50,38,20,0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W/2 - 28, H * 0.82);
  ctx.quadraticCurveTo(W/2 - 18, H * 0.5, W/2 + 8, villageCenterY + 80);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(W/2 + 28, H * 0.82);
  ctx.quadraticCurveTo(W/2 + 22, H * 0.5, W/2 + 38, villageCenterY + 80);
  ctx.stroke();

  // Village area - path leads to gate
  if (villageWall) {
    const pathEndY = villageWall.y + villageWall.h;
    // Adjust path to end at gate
    ctx.fillStyle = 'rgba(75,55,30,0.5)';
    ctx.beginPath();
    ctx.moveTo(W/2 - 20, pathEndY);
    ctx.lineTo(W/2 + 20, pathEndY);
    ctx.lineTo(W/2 + 25, pathEndY + 30);
    ctx.lineTo(W/2 - 25, pathEndY + 30);
    ctx.fill();
  }
}

// ============================================================
// PARTICLES & BLOOD
// ============================================================
function spawnBlood(x, y, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;
    particles.push({ x, y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed, life:0.5+Math.random()*0.5, maxLife:0.5+Math.random()*0.5, size:2+Math.random()*3, color:Math.random()>0.3?COLORS.blood:COLORS.bloodDark, type:'blood' });
  }
  // Blood pool
  bloodPools.push({ x:x+Math.random()*10-5, y:y+Math.random()*10-5, size:8+Math.random()*15, life:8+Math.random()*4, maxLife:8+Math.random()*4, color:Math.random()>0.5?'rgba(139,26,26,0.4)':'rgba(90,10,10,0.35)' });
}

function spawnGoldParticle(x, y) {
  for (let i = 0; i < 5; i++) {
    const angle = Math.random()*Math.PI*2, speed = 1+Math.random()*2;
    particles.push({ x, y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed-2, life:0.8, maxLife:0.8, size:3, color:BRAND.gold, type:'sparkle' });
  }
}

function spawnHitSparks(x, y) {
  for (let i = 0; i < 3; i++) {
    const angle = Math.random()*Math.PI*2, speed = 2+Math.random()*3;
    particles.push({ x, y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed, life:0.3, maxLife:0.3, size:2, color:'#ff8', type:'spark' });
  }
}

// ============================================================
// ATTACK LOGIC
// ============================================================
function attackAction() {
  if (attackCooldown > 0 || !player) return;
  const wep = WEAPONS[currentWeapon];
  attackCooldown = wep.cooldown;
  player.attackAnim = 0.25;
  playSound(wep.name.toLowerCase().includes('hammer') ? 'thunder' : wep.name === 'Fire Blade' ? 'damage' : currentWeapon < 4 ? WEAPONS[currentWeapon].name.toLowerCase() : 'hit');

  if (wep.projectile) {
    // Bow - shoot arrow toward mouse cursor (or facing direction on touch)
    let aimAngle = player.facing;
    if (!isTouchDevice && (mouseX !== 0 || mouseY !== 0)) {
      aimAngle = Math.atan2(mouseY - player.y, mouseX - player.x);
      player.facing = aimAngle; // face toward cursor when shooting
    }
    projectiles.push({ x:player.x, y:player.y, vx:Math.cos(aimAngle)*7, vy:Math.sin(aimAngle)*7, damage:wep.damage + upgrades.damage*5, size:4, life:2, owner:'player', type:'arrow' });
  } else {
    // Melee
    const dmg = wep.damage + upgrades.damage * 5;

    // Check gate hit — must kill all enemies first!
    if (villageGate && !villageGate.broken) {
      const gx = villageGate.x + villageGate.w/2;
      const gy = villageGate.y + villageGate.h/2;
      const gdx = gx - player.x, gdy = gy - player.y;
      const gdist = Math.sqrt(gdx*gdx + gdy*gdy);
      if (gdist < wep.range + 30) {
        let angleToGate = Math.atan2(gdy, gdx);
        let angleDiff = angleToGate - player.facing;
        while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
        while (angleDiff < -Math.PI) angleDiff += Math.PI*2;
        if (Math.abs(angleDiff) < wep.arc/2 + 0.3) {
          if (enemies.length > 0) {
            // Gate is protected — enemies still alive!
            spawnHitSparks(gx, gy);
            if (!gateBlockedMsg || gateBlockedMsg <= 0) gateBlockedMsg = 2.0;
          } else if (currentWeapon === 1 || wep.breaksWalls) { // Axe or Sword of Summer
            villageGate.hp -= dmg;
            spawnHitSparks(gx, gy);
            playSound('axe');
            if (villageGate.hp <= 0) {
              villageGate.broken = true;
              playSound('thunder');
              shakeTimer = 0.3;
              shakeIntensity = 8;
            }
          } else {
            spawnHitSparks(gx, gy);
          }
        }
      }
    }

    // AOE attack for Thor's Hammer
    if (wep.aoe) {
      for (let e of enemies) {
        const dx = e.x - player.x, dy = e.y - player.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < wep.aoeRadius) {
          e.hp -= dmg;
          e.hitFlash = 0.1;
          spawnHitSparks(e.x, e.y);
          if (e.hp <= 0) { spawnBlood(e.x, e.y, 12); score += 100; enemiesKilled++; }
        }
      }
      flashTimer = 0.15;
      flashColor = 'rgba(100,150,255,0.2)';
      shakeTimer = 0.2;
      shakeIntensity = 6;
      playSound('thunder');
    } else {
      // Regular melee attacks
      let hitCount = 0;
      for (let e of enemies) {
        if (wep.multiHit && hitCount >= wep.multiHit) break;
        const dx = e.x - player.x, dy = e.y - player.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < wep.range + e.size) {
          let angleToEnemy = Math.atan2(dy, dx);
          let angleDiff = angleToEnemy - player.facing;
          while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
          while (angleDiff < -Math.PI) angleDiff += Math.PI*2;
          if (Math.abs(angleDiff) < wep.arc/2 + 0.3) {
            e.hp -= dmg;
            e.hitFlash = 0.1;
            e.stagger = 0.15;
            const knockback = 5;
            e.x += (dx/dist) * knockback;
            e.y += (dy/dist) * knockback;
            spawnHitSparks(e.x, e.y);
            playSound('hit');
            hitCount++;
            if (e.hp <= 0) {
              spawnBlood(e.x, e.y, 12);
              score += e.type === 'chief' ? 500 : e.type === 'armored' ? 150 : 100;
              enemiesKilled++;
              if (Math.random() < 0.15) {
                healthPickups.push({ x:e.x, y:e.y, amount:15+level*2, time:0, size:10 });
              }
            }
          }
        }
      }
    }
    enemies = enemies.filter(e => e.hp > 0);
  }
}


// Key-based weapon switching
window.addEventListener('keydown', e => {
  if (gameState === STATE.PLAYING) {
    if (e.code === 'Digit1' && WEAPONS[0].unlocked) currentWeapon = 0;
    if (e.code === 'Digit2' && WEAPONS[1].unlocked) currentWeapon = 1;
    if (e.code === 'Digit3' && WEAPONS[2].unlocked) currentWeapon = 2;
    if (e.code === 'Digit4' && WEAPONS[3].unlocked) currentWeapon = 3;
    if (e.code === 'Digit5' && WEAPONS[4].unlocked) currentWeapon = 4;
    if (e.code === 'Digit6' && WEAPONS[5].unlocked) currentWeapon = 5;
    if (e.code === 'Digit7' && WEAPONS[6].unlocked) currentWeapon = 6;
    if (e.code === 'Space') attackAction();
  }
});

// ============================================================
// UPDATE
// ============================================================
function update(dt) {
  gameTime += dt;

  if (gameState === STATE.LANDING) {
    landingTimer -= dt;
    if (landingTimer <= 0) { gameState = STATE.PLAYING; }
    return;
  }

  if (gameState === STATE.LEVEL_TRANSITION) {
    transitionTimer -= dt;
    if (transitionTimer <= 0) gameState = STATE.SHOP;
    return;
  }

  if (gameState !== STATE.PLAYING) return;

  if (attackCooldown > 0) attackCooldown -= dt;
  if (player.attackAnim > 0) player.attackAnim -= dt;
  if (player.invuln > 0) player.invuln -= dt;
  if (player.shieldTimer > 0) player.shieldTimer -= dt;
  if (flashTimer > 0) flashTimer -= dt;
  if (shakeTimer > 0) shakeTimer -= dt;
  if (gateBlockedMsg > 0) gateBlockedMsg -= dt;

  // Touch attack
  if (touchAttacking) attackAction();

  // Player movement
  let mx = 0, my = 0;
  if (keys['KeyW'] || keys['ArrowUp']) my = -1;
  if (keys['KeyS'] || keys['ArrowDown']) my = 1;
  if (keys['KeyA'] || keys['ArrowLeft']) mx = -1;
  if (keys['KeyD'] || keys['ArrowRight']) mx = 1;

  if (isTouchDevice && joystickMag > 0.2) {
    mx = Math.cos(joystickAngle) * joystickMag;
    my = Math.sin(joystickAngle) * joystickMag;
  }

  if (mx !== 0 || my !== 0) {
    const mag = Math.sqrt(mx*mx+my*my);
    mx /= mag; my /= mag;
    player.x += mx * player.speed;
    player.y += my * player.speed;
    player.facing = Math.atan2(my, mx);
    player.moving = true;
  } else {
    player.moving = false;
  }

  // Clamp player
  player.x = Math.max(player.size, Math.min(W - player.size, player.x));
  player.y = Math.max(player.size, Math.min(H - player.size, player.y));

  // Wall collision
  if (villageWall && !insideVillage) {
    // Check if player is trying to enter from the gate
    if (villageGate.broken && player.y > villageGate.y - 30 && player.y < villageGate.y + 50 &&
        player.x > villageGate.x - 30 && player.x < villageGate.x + villageGate.w + 30) {
      insideVillage = true;
    }
    // Block movement through walls
    if (!villageGate.broken || player.y <= villageGate.y - 30 || player.y >= villageGate.y + 50) {
      // Check collision with walls
      const vx = villageWall.x, vy = villageWall.y, vw = villageWall.w, vh = villageWall.h;
      if (player.x - player.size < vx + vw && player.x + player.size > vx &&
          player.y - player.size < vy + vh && player.y + player.size > vy) {
        // Push player out based on closest wall
        const cx = vx + vw/2, cy = vy + vh/2;
        const dx = player.x - cx, dy = player.y - cy;
        if (Math.abs(dx) > Math.abs(dy)) {
          player.x = dx > 0 ? vx + vw + player.size : vx - player.size;
        } else {
          player.y = dy > 0 ? vy + vh + player.size : vy - player.size;
        }
      }
    }
  }

  // Enemy spawning — stops after enough kills so player can clear and bash gate
  const killTarget = 10 + level * 5; // enemies to kill before spawning stops
  const allEnemiesSpawned = enemiesKilled >= killTarget;
  spawnTimer -= dt;
  if (!allEnemiesSpawned && spawnTimer <= 0 && enemies.length < 15 + level * 2) {
    spawnEnemy(null);
    spawnTimer = Math.max(1.5, 4 - level * 0.3) + Math.random() * 2;
    // Boss spawns once near kill target
    if (!bossSpawned && enemiesKilled >= killTarget - 3) {
      spawnEnemy('chief');
      bossSpawned = true;
    }
    // Power-up chance
    if (Math.random() < 0.08) {
      const type = Math.random() < 0.5 ? 'hammer' : 'shield';
      powerups.push({ x: W*0.1+Math.random()*W*0.8, y: H*0.2+Math.random()*H*0.5, type, time:0, size:16 });
    }
  }

  // Enemy AI
  for (let e of enemies) {
    if (e.hitFlash > 0) e.hitFlash -= dt;
    if (e.stagger > 0) { e.stagger -= dt; continue; }

    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    e.facing = Math.atan2(dy, dx);

    if (e.type === 'archer' && dist < e.attackRange && dist > 60) {
      // Archer: stay at range and shoot
      e.attackTimer -= dt;
      if (e.attackTimer <= 0) {
        e.attackTimer = e.attackCd;
        const angle = Math.atan2(dy, dx);
        projectiles.push({ x:e.x, y:e.y, vx:Math.cos(angle)*4, vy:Math.sin(angle)*4, damage:e.damage, size:3, life:3, owner:'enemy', type:'arrow' });
      }
    } else if (dist > e.attackRange) {
      // Move toward player (swarming)
      const spd = e.speed;
      // Add slight variation for natural swarming
      const wobble = Math.sin(gameTime * 3 + e.x * 0.1) * 0.3;
      e.x += (dx/dist) * spd + Math.cos(e.facing + Math.PI/2) * wobble;
      e.y += (dy/dist) * spd + Math.sin(e.facing + Math.PI/2) * wobble;
    } else {
      // Melee attack
      e.attackTimer -= dt;
      if (e.attackTimer <= 0) {
        e.attackTimer = e.attackCd;
        if (player.shieldTimer <= 0 && player.invuln <= 0) {
          const dmg = Math.max(1, e.damage - upgrades.armor * 3);
          player.hp -= dmg;
          player.invuln = 0.3;
          playSound('damage');
          flashTimer = 0.15;
          flashColor = 'rgba(200,0,0,0.3)';
          shakeTimer = 0.15;
          shakeIntensity = 5;
          if (player.hp <= 0) {
            gameState = STATE.GAME_OVER;
            playSound('gameover');
            saveToLeaderboard();
          }
        }
      }
    }

    // Enemy-enemy separation
    for (let other of enemies) {
      if (other === e) continue;
      const ox = e.x - other.x, oy = e.y - other.y;
      const od = Math.sqrt(ox*ox + oy*oy);
      if (od < e.size + other.size && od > 0) {
        e.x += (ox/od) * 0.8;
        e.y += (oy/od) * 0.8;
      }
    }
  }

  // Projectiles
  for (let p of projectiles) {
    p.x += p.vx; p.y += p.vy; p.life -= dt;

    if (p.owner === 'player') {
      for (let e of enemies) {
        const dx = e.x-p.x, dy = e.y-p.y;
        if (Math.sqrt(dx*dx+dy*dy) < e.size + p.size) {
          e.hp -= p.damage;
          e.hitFlash = 0.1;
          p.life = 0;
          spawnHitSparks(p.x, p.y);
          playSound('hit');
          if (e.hp <= 0) {
            spawnBlood(e.x, e.y, 12);
            score += e.type === 'chief' ? 500 : e.type === 'armored' ? 150 : 100;
            enemiesKilled++;
            if (Math.random() < 0.15) healthPickups.push({ x:e.x, y:e.y, amount:15+level*2, time:0, size:10 });
          }
          break;
        }
      }
      // Player arrows can destroy catapults (only after enemies are cleared)
      if (p.life > 0 && enemies.length === 0) {
        for (let c of catapults) {
          const dx = c.x-p.x, dy = c.y-p.y;
          if (Math.sqrt(dx*dx+dy*dy) < c.size + p.size) {
            c.hp -= p.damage;
            c.hitFlash = 0.15;
            p.life = 0;
            spawnHitSparks(p.x, p.y);
            playSound('hit');
            if (c.hp <= 0) {
              // Catapult destroyed — wood debris particles
              for (let i = 0; i < 8; i++) {
                particles.push({ x:c.x, y:c.y, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4, life:0.8, color:'#8b6914', size:3, type:'spark' });
              }
              score += 200;
            }
            break;
          }
        }
      }
    } else if (p.owner === 'catapult') {
      // Catapult rocks hit player
      const dx = player.x-p.x, dy = player.y-p.y;
      if (Math.sqrt(dx*dx+dy*dy) < player.size + p.size) {
        if (player.shieldTimer <= 0 && player.invuln <= 0) {
          const dmg = Math.max(1, p.damage - upgrades.armor * 3);
          player.hp -= dmg;
          player.invuln = 0.3;
          playSound('damage');
          flashTimer = 0.15;
          flashColor = 'rgba(200,0,0,0.3)';
        }
        p.life = 0;
        spawnHitSparks(p.x, p.y);
        if (player.hp <= 0) { gameState = STATE.GAME_OVER; playSound('gameover'); saveToLeaderboard(); }
      }
      // Catapult rocks also hit allies
      if (p.life > 0) {
        for (let a of allies) {
          const adx = a.x-p.x, ady = a.y-p.y;
          if (Math.sqrt(adx*adx+ady*ady) < a.size + p.size) {
            a.hp -= p.damage;
            a.hitFlash = 0.1;
            p.life = 0;
            spawnHitSparks(p.x, p.y);
            if (a.hp <= 0) spawnBlood(a.x, a.y, 10);
            break;
          }
        }
      }
      // Catapult rocks also hit wolves
      if (p.life > 0) {
        for (let w of wolves) {
          const wdx = w.x-p.x, wdy = w.y-p.y;
          if (Math.sqrt(wdx*wdx+wdy*wdy) < w.size + p.size) {
            w.hp -= p.damage;
            w.hitFlash = 0.1;
            p.life = 0;
            spawnHitSparks(p.x, p.y);
            if (w.hp <= 0) spawnBlood(w.x, w.y, 6);
            break;
          }
        }
      }
    } else if (p.owner === 'enemy') {
      const dx = player.x-p.x, dy = player.y-p.y;
      if (Math.sqrt(dx*dx+dy*dy) < player.size + p.size) {
        if (player.shieldTimer <= 0 && player.invuln <= 0) {
          const dmg = Math.max(1, p.damage - upgrades.armor * 3);
          player.hp -= dmg;
          player.invuln = 0.3;
          playSound('damage');
          flashTimer = 0.15;
          flashColor = 'rgba(200,0,0,0.3)';
        }
        p.life = 0;
        if (player.hp <= 0) { gameState = STATE.GAME_OVER; playSound('gameover'); saveToLeaderboard(); }
      }
      // Enemy arrows can also hit wolves
      if (p.life > 0) {
        for (let w of wolves) {
          const wdx = w.x-p.x, wdy = w.y-p.y;
          if (Math.sqrt(wdx*wdx+wdy*wdy) < w.size + p.size) {
            w.hp -= p.damage;
            w.hitFlash = 0.1;
            p.life = 0;
            if (w.hp <= 0) spawnBlood(w.x, w.y, 6);
            break;
          }
        }
      }
    }
  }
  enemies = enemies.filter(e => e.hp > 0);
  projectiles = projectiles.filter(p => p.life > 0 && p.x > -50 && p.x < W+50 && p.y > -50 && p.y < H+50);

  // Power-ups
  for (let i = powerups.length-1; i >= 0; i--) {
    const p = powerups[i];
    p.time += dt;
    const dx = player.x-p.x, dy = player.y-p.y;
    if (Math.sqrt(dx*dx+dy*dy) < player.size + p.size) {
      if (p.type === 'hammer') {
        // Thor's hammer - kill only enemies currently on screen
        playSound('thunder');
        flashTimer = 0.3;
        flashColor = 'rgba(255,255,200,0.5)';
        shakeTimer = 0.4;
        shakeIntensity = 10;
        const onScreen = enemies.filter(e => e.x > 0 && e.x < W && e.y > 0 && e.y < H);
        for (let e of onScreen) { spawnBlood(e.x, e.y, 8); score += 50; enemiesKilled++; }
        enemies = enemies.filter(e => !(e.x > 0 && e.x < W && e.y > 0 && e.y < H));
      } else if (p.type === 'shield') {
        player.shieldTimer = 8;
        playSound('powerup');
      }
      powerups.splice(i, 1);
    }
  }

  // Health pickups
  for (let i = healthPickups.length-1; i >= 0; i--) {
    const h = healthPickups[i];
    h.time += dt;
    const dx = player.x-h.x, dy = player.y-h.y;
    if (Math.sqrt(dx*dx+dy*dy) < player.size + h.size) {
      player.hp = Math.min(player.maxHp, player.hp + h.amount);
      playSound('powerup');
      healthPickups.splice(i, 1);
    } else if (h.time > 10) {
      healthPickups.splice(i, 1);
    }
  }

  // Ally AI
  for (let a of allies) {
    if (a.hitFlash > 0) a.hitFlash -= dt;
    if (a.stagger > 0) { a.stagger -= dt; continue; }
    if (a.attackAnim > 0) a.attackAnim -= dt;

    // Find nearest enemy
    let nearestEnemy = null, nearestDist = Infinity;
    for (let e of enemies) {
      const dx = e.x - a.x, dy = e.y - a.y;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d < nearestDist) { nearestDist = d; nearestEnemy = e; }
    }

    if (nearestEnemy && nearestDist < 300) {
      // Chase enemy
      const dx = nearestEnemy.x - a.x, dy = nearestEnemy.y - a.y;
      a.facing = Math.atan2(dy, dx);
      if (nearestDist > a.attackRange) {
        a.x += (dx/nearestDist) * a.speed;
        a.y += (dy/nearestDist) * a.speed;
      } else {
        // Attack!
        a.attackTimer -= dt;
        if (a.attackTimer <= 0) {
          a.attackTimer = a.attackCd;
          a.attackAnim = 0.2;
          nearestEnemy.hp -= a.damage;
          nearestEnemy.hitFlash = 0.1;
          nearestEnemy.stagger = 0.1;
          const kb = 3;
          nearestEnemy.x += (dx/nearestDist) * kb;
          nearestEnemy.y += (dy/nearestDist) * kb;
          spawnHitSparks(nearestEnemy.x, nearestEnemy.y);
          playSound('sword');
          if (nearestEnemy.hp <= 0) {
            spawnBlood(nearestEnemy.x, nearestEnemy.y, 10);
            score += nearestEnemy.type === 'chief' ? 500 : 100;
            enemiesKilled++;
            if (Math.random() < 0.12) healthPickups.push({ x:nearestEnemy.x, y:nearestEnemy.y, amount:15+level*2, time:0, size:10 });
          }
        }
      }
    } else {
      // Follow player loosely
      const pdx = player.x - a.x + (allies.indexOf(a)) * 25 - 12;
      const pdy = player.y - a.y + 25;
      const pdist = Math.sqrt(pdx*pdx + pdy*pdy);
      if (pdist > 50) {
        a.x += (pdx/pdist) * a.speed * 0.8;
        a.y += (pdy/pdist) * a.speed * 0.8;
        a.facing = Math.atan2(pdy, pdx);
      }
    }

    // Enemy attacks hurt allies too
    for (let e of enemies) {
      if (e.stagger > 0) continue;
      const edx = a.x - e.x, edy = a.y - e.y;
      const edist = Math.sqrt(edx*edx + edy*edy);
      if (edist < e.attackRange + a.size) {
        e.attackTimer -= dt;
        if (e.attackTimer <= 0) {
          e.attackTimer = e.attackCd;
          a.hp -= e.damage;
          a.hitFlash = 0.1;
          a.stagger = 0.1;
          if (a.hp <= 0) {
            spawnBlood(a.x, a.y, 15);
          }
        }
      }
    }

    // Clamp ally to screen
    a.x = Math.max(a.size, Math.min(W - a.size, a.x));
    a.y = Math.max(a.size, Math.min(H - a.size, a.y));
  }
  // Remove dead allies
  allies = allies.filter(a => a.hp > 0);

  // Wolf AI — same idea as allies but faster and uses bite attacks
  for (let w of wolves) {
    if (w.hitFlash > 0) w.hitFlash -= dt;
    if (w.biteAnim > 0) w.biteAnim -= dt;
    if (w.stagger > 0) { w.stagger -= dt; continue; }
    if (w.attackAnim > 0) w.attackAnim -= dt;

    // Find nearest enemy (same pattern as ally AI)
    let nearestEnemy = null, nearestDist = Infinity;
    for (let e of enemies) {
      const dx = e.x - w.x, dy = e.y - w.y;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d < nearestDist) { nearestDist = d; nearestEnemy = e; }
    }

    if (nearestEnemy && nearestDist < 250) {
      // Chase enemy — wolves are fast!
      const dx = nearestEnemy.x - w.x, dy = nearestEnemy.y - w.y;
      w.facing = Math.atan2(dy, dx);
      if (nearestDist > w.attackRange) {
        w.x += (dx/nearestDist) * w.speed;
        w.y += (dy/nearestDist) * w.speed;
      } else {
        // Bite attack!
        w.attackTimer -= dt;
        if (w.attackTimer <= 0) {
          w.attackTimer = w.attackCd;
          w.attackAnim = 0.15;
          w.biteAnim = 0.2; // jaw opens for drawing
          nearestEnemy.hp -= w.damage;
          nearestEnemy.hitFlash = 0.1;
          nearestEnemy.stagger = 0.08;
          const kb = 2;
          nearestEnemy.x += (dx/nearestDist) * kb;
          nearestEnemy.y += (dy/nearestDist) * kb;
          spawnHitSparks(nearestEnemy.x, nearestEnemy.y);
          playSound('sword'); // reuse sword sound for bite
          if (nearestEnemy.hp <= 0) {
            spawnBlood(nearestEnemy.x, nearestEnemy.y, 8);
            score += nearestEnemy.type === 'chief' ? 500 : 100;
            enemiesKilled++;
            if (Math.random() < 0.1) healthPickups.push({ x:nearestEnemy.x, y:nearestEnemy.y, amount:10+level*2, time:0, size:10 });
          }
        }
      }
    } else {
      // Follow player loosely — wolves spread out a bit
      const pdx = player.x - w.x + (wolves.indexOf(w)) * 18 - 9;
      const pdy = player.y - w.y + 35;
      const pdist = Math.sqrt(pdx*pdx + pdy*pdy);
      if (pdist > 40) {
        w.x += (pdx/pdist) * w.speed * 0.85;
        w.y += (pdy/pdist) * w.speed * 0.85;
        w.facing = Math.atan2(pdy, pdx);
      }
    }

    // Enemies can hurt wolves too
    for (let e of enemies) {
      if (e.stagger > 0) continue;
      const edx = w.x - e.x, edy = w.y - e.y;
      const edist = Math.sqrt(edx*edx + edy*edy);
      if (edist < e.attackRange + w.size) {
        e.attackTimer -= dt;
        if (e.attackTimer <= 0) {
          e.attackTimer = e.attackCd;
          w.hp -= e.damage;
          w.hitFlash = 0.1;
          w.stagger = 0.08;
          if (w.hp <= 0) {
            spawnBlood(w.x, w.y, 8);
          }
        }
      }
    }

    // Keep wolves on screen
    w.x = Math.max(w.size, Math.min(W - w.size, w.x));
    w.y = Math.max(w.size, Math.min(H - w.size, w.y));
  }
  // Remove dead wolves
  wolves = wolves.filter(w => w.hp > 0);

  // Catapult AI — only activates after all enemies are defeated (village's last defense!)
  for (let c of catapults) {
    if (c.hitFlash > 0) c.hitFlash -= dt;
    // Catapults stay dormant while enemies are alive
    if (enemies.length > 0) continue;
    c.fireTimer -= dt;
    if (c.fireTimer <= 0) {
      c.fireTimer = c.fireCd;
      // Find nearest target (player, ally, or wolf)
      let tx = player.x, ty = player.y;
      let bestDist = Math.sqrt((player.x-c.x)**2 + (player.y-c.y)**2);
      for (let a of allies) {
        const ad = Math.sqrt((a.x-c.x)**2 + (a.y-c.y)**2);
        if (ad < bestDist) { bestDist = ad; tx = a.x; ty = a.y; }
      }
      for (let w of wolves) {
        const wd = Math.sqrt((w.x-c.x)**2 + (w.y-c.y)**2);
        if (wd < bestDist) { bestDist = wd; tx = w.x; ty = w.y; }
      }
      if (bestDist < c.range) {
        // Fire a slow rock projectile
        const angle = Math.atan2(ty - c.y, tx - c.x);
        const speed = 2.5;
        projectiles.push({
          x: c.x, y: c.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          damage: c.damage,
          size: 8,
          life: 4,
          owner: 'catapult',
          color: '#7a6a5a'
        });
      }
    }
  }
  // Remove destroyed catapults
  catapults = catapults.filter(c => c.hp > 0);

  // Particles
  for (let p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.95; p.vy *= 0.95;
    if (p.type === 'blood') p.vy += 2 * dt;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);

  // Blood pools fade
  for (let b of bloodPools) b.life -= dt;
  bloodPools = bloodPools.filter(b => b.life > 0);

  // Check level completion — player entered village through broken gate
  if (insideVillage && !villagePillaged) {
    villagePillaged = true;
    // Gold reward increases each level
    gold += levelGoldReward;
    totalGold += levelGoldReward;
    score += 1000 + level * 200;
    // Bonus health
    player.hp = Math.min(player.maxHp, player.hp + 30);
    // Gold particles from each building
    for (let b of buildings) {
      spawnGoldParticle(b.x, b.y);
    }
    playSound('levelup');
    playSound('gold');
    transitionTimer = 3;
    gameState = STATE.LEVEL_TRANSITION;
  }
}

// ============================================================
// DRAW GAME
// ============================================================
function drawGame() {
  ctx.save();

  // Screen shake
  if (shakeTimer > 0) {
    ctx.translate(
      (Math.random()-0.5) * shakeIntensity * (shakeTimer/0.15),
      (Math.random()-0.5) * shakeIntensity * (shakeTimer/0.15)
    );
  }

  drawTerrain();

  // Blood pools
  for (let b of bloodPools) {
    ctx.globalAlpha = Math.min(1, b.life / b.maxLife * 2) * 0.6;
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.ellipse(b.x, b.y, b.size, b.size*0.6, 0, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Trees (behind)
  for (let t of trees) if (t.y < player.y) drawTree(t);

  // Village walls
  if (villageWall) {
    const vw = villageWall;
    // Wall shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(vw.x + 4, vw.y + 4, vw.w, vw.h);
    // Stone wall - thick border
    ctx.strokeStyle = '#5a5040';
    ctx.lineWidth = 12;
    ctx.strokeRect(vw.x, vw.y, vw.w, vw.h);
    // Wall inner edge
    ctx.strokeStyle = '#3a3028';
    ctx.lineWidth = 2;
    ctx.strokeRect(vw.x - 6, vw.y - 6, vw.w + 12, vw.h + 12);
    ctx.strokeRect(vw.x + 6, vw.y + 6, vw.w - 12, vw.h - 12);
    // Stone texture on walls
    ctx.fillStyle = 'rgba(80,70,55,0.3)';
    for (let i = 0; i < 20; i++) {
      const sx = vw.x + ((i * 137 + level * 7) % 100) / 100 * vw.w;
      const sy = vw.y + ((i * 89 + level * 11) % 100) / 100 * vw.h;
      // Only draw on the wall border, not inside
      const onWall = sx < vw.x + 8 || sx > vw.x + vw.w - 8 || sy < vw.y + 8 || sy > vw.y + vw.h - 8;
      if (onWall) {
